<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DispatchMonkey — Cảng Cát Lái</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg:#0c1118; --panel:#161d28; --panel2:#1f2835; --line:#2c3747;
    --ink:#f2f6fb; --ink2:#aab6c6; --ink3:#8291a3;
    --accent:#5b9dff; --accent-ink:#06142c;
    --go:#2fbf71; --warn:#e8a33d; --stop:#e5544b;
    --sheet-peek:238px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    /* driver UX: 18px floor, 56px targets — arm's-length mount, gloves, glare */
    font:18px/1.42 'Fira Sans',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  button{font:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  #map{position:fixed; inset:0}
  .maplibregl-ctrl-bottom-right{bottom:calc(var(--sheet-peek) + 58px)}
  .maplibregl-ctrl-bottom-left{display:none}

  /* ---- floating: where from / where to ---- */
  #where{
    position:fixed; left:12px; right:12px; top:max(12px,env(safe-area-inset-top));
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.45); overflow:hidden; z-index:5;
  }
  #where button{
    display:flex; align-items:center; gap:12px; width:100%; min-height:58px;
    background:none; border:0; color:var(--ink); text-align:left; padding:0 15px;
  }
  #where button + button{border-top:1px solid var(--line)}
  #where .dot{width:11px; height:11px; border-radius:50%; border:2.5px solid var(--ink3); flex:none}
  #where .dot.to{border-radius:3px; border-color:var(--accent); background:var(--accent)}
  #where .txt{flex:1; font-size:17px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #where .txt.empty{color:var(--ink3); font-weight:400}
  #where .ico{flex:none; color:var(--ink3)}
  body.tall #where,body.tall #mapbtns{opacity:0; pointer-events:none; transition:opacity .15s}

  /* ---- floating map buttons ---- */
  #mapbtns{position:fixed; right:12px; top:150px; display:grid; gap:9px; z-index:5}
  #mapbtns button{
    width:52px; height:52px; border-radius:13px; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.4);
    display:grid; place-items:center; font-size:14px; font-weight:700;
  }
  #mapbtns button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  /* ---- bottom sheet ---- */
  #sheet{
    position:fixed; left:0; right:0; bottom:58px; z-index:6;
    background:var(--panel); border-top:1px solid var(--line); border-radius:20px 20px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.5);
    height:var(--sheet-peek); display:flex; flex-direction:column;
    transition:height .22s ease;
  }
  #sheet.tall{height:calc(100% - 58px - 64px)}
  #grip{flex:none; padding:9px 0 3px; display:grid; place-items:center}
  #grip i{display:block; width:40px; height:4px; border-radius:2px; background:var(--line)}
  .pane{flex:1; overflow-y:auto; padding:4px 16px 18px; -webkit-overflow-scrolling:touch}
  .pane[hidden]{display:none}

  /* ---- the answer ---- */
  .kicker{font-size:13px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--ink3)}
  .ansRow{display:flex; align-items:center; gap:12px; margin:2px 0 2px}
  .ansTime{font-size:46px; font-weight:800; letter-spacing:-.025em; line-height:1.05; font-variant-numeric:tabular-nums}
  .wait{
    margin-left:auto; text-align:right; font-size:15px; color:var(--ink2); line-height:1.25;
  }
  .wait b{display:block; font-size:21px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  .ansSub{color:var(--ink2); font-size:16px; margin-bottom:10px}
  .ansSub b{color:var(--ink); font-weight:600}
  .saved{color:var(--go); font-weight:600}
  .primary{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:58px; border:0; border-radius:14px;
    background:var(--accent); color:var(--accent-ink); font-size:19px; font-weight:800;
  }
  .primary[disabled]{background:var(--panel2); color:var(--ink3)}
  .ghost{
    width:100%; min-height:52px; border-radius:13px; border:1px solid var(--line);
    background:transparent; color:var(--ink2); font-size:16px; font-weight:600; margin-top:9px;
  }
  .chip{
    display:inline-block; font-size:12px; font-weight:600; border:1px solid var(--line);
    border-radius:4px; padding:1px 6px; color:var(--ink3); vertical-align:2px; white-space:nowrap;
  }
  .chip.sim{color:#d8b53c; border-color:#5d5120}
  .why{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .why li{font-size:16px; color:var(--ink2); margin-bottom:7px}
  .why ul{margin:0; padding-left:20px}
  .alt{
    display:flex; align-items:center; gap:12px; width:100%; min-height:62px; text-align:left;
    background:var(--panel2); border:1px solid var(--line); border-radius:13px;
    color:var(--ink); padding:9px 14px; margin-top:9px;
  }
  .alt .at{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums}
  .alt .an{flex:1; font-size:15px; color:var(--ink2)}
  .alt .aw{font-size:15px; color:var(--ink2); text-align:right}
  .blocked{color:var(--stop); font-size:15px; margin-top:10px}
  h2.pt{font-size:21px; font-weight:800; margin:6px 0 2px; letter-spacing:-.01em}
  p.ps{color:var(--ink2); font-size:15.5px; margin:0 0 14px}

  /* ---- slot bars ---- */
  #slots{display:grid; gap:7px}
  .slot{display:flex; align-items:center; gap:10px; min-height:40px}
  .slot .t{width:52px; flex:none; font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums}
  .slot .bar{flex:1; height:22px; background:var(--panel2); border-radius:6px; overflow:hidden; display:flex}
  .slot .fill{height:100%}
  .slot .claim{height:100%; background:var(--accent)}
  .slot .w{width:66px; flex:none; text-align:right; font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums}
  .slot.mine .t,.slot.mine .w{color:var(--ink); font-weight:700}
  .slot.mine .bar{outline:2px solid var(--accent); outline-offset:1px}
  .legend{display:flex; gap:14px; flex-wrap:wrap; color:var(--ink2); font-size:14.5px; margin:12px 0 2px}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px}

  /* ---- settings ---- */
  .srow{padding:14px 0; border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .lab{display:block; font-size:14.5px; font-weight:600; color:var(--ink2); margin-bottom:8px}
  .seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px;
    background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:4px}
  .seg.v{grid-auto-flow:row}
  .seg button{min-height:50px; border:0; border-radius:9px; background:transparent; color:var(--ink2); font-size:16px}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
  input[type=time],input[type=number],#q{
    width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font:inherit; min-height:56px;
  }
  .two{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .note{font-size:14.5px; color:var(--ink3); margin-top:7px}
  /* fleet card (shared state with the dispatcher website) */
  #fleet{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin:2px 0 12px}
  #fleet.alert{border-color:var(--warn)} #fleet.new{border-color:var(--go)} #fleet.late{border-color:var(--stop)}
  #fleet .fk{font-size:12.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--ink3); display:flex; gap:8px; align-items:center}
  #fleet .fk .sync{margin-left:auto; font-weight:600; letter-spacing:0; text-transform:none}
  #fleet .fk .sync.on{color:var(--go)}
  #fleet .fm{font-size:18px; margin-top:4px}
  #fleet .fm b{font-size:24px; font-variant-numeric:tabular-nums}
  #fleet .fs{font-size:14px; color:var(--ink2); margin-top:4px}
  .tier{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.4px; border-radius:5px; padding:1px 5px; vertical-align:middle}
  .tier.der{background:#a77bf3; color:#150828} .tier.real{background:#4c8dff; color:#04102a}
  .tier.sim{background:#f08c2e; color:#1f0e00} .tier.est{background:#8a96a8; color:#0c1118}
  #report{width:100%; min-height:52px; margin-top:10px; border-radius:12px; border:1px solid var(--stop); background:transparent;
    color:var(--ink); font:inherit; font-weight:700; font-size:16px; cursor:pointer}
  #report[disabled]{opacity:.75; cursor:default}
  .costs{width:100%; border-collapse:collapse; font-size:14.5px; margin-top:6px}
  .costs td{padding:4px 0; border-bottom:1px solid var(--line); color:var(--ink2)}
  .costs td:last-child{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
  .costs tr.unbilled td{color:#d8b53c}
  .slot.full .bar{opacity:.45} .slot.full .w{color:var(--stop); font-weight:700}
  details{margin-top:12px}
  summary{min-height:48px; display:flex; align-items:center; font-size:16px; color:var(--ink2)}
  .rule{font-size:15px; color:var(--ink2); margin:8px 0}
  .rule .src{font-size:13px; color:var(--ink3)}

  /* ---- tab bar ---- */
  #tabs{
    position:fixed; left:0; right:0; bottom:0; height:58px; z-index:7;
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr;
    background:var(--panel); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #tabs button{
    background:none; border:0; color:var(--ink3); display:grid; place-items:center; gap:2px;
    font-size:12px; font-weight:600;
  }
  #tabs button[aria-pressed="true"]{color:var(--accent)}

  /* ---- search overlay ---- */
  #search{position:fixed; inset:0; background:var(--bg); z-index:20; padding:14px 14px 0; display:flex; flex-direction:column}
  #search[hidden]{display:none}
  .sTop{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  #sBack{min-width:52px; min-height:52px; border-radius:13px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink); font-size:22px}
  #sTitle{font-size:20px; font-weight:800}
  #sList{overflow-y:auto; padding-bottom:20px}
  .res{
    display:flex; align-items:center; gap:13px; width:100%; min-height:66px; text-align:left;
    background:none; border:0; border-bottom:1px solid var(--line); color:var(--ink);
    font-size:17.5px; font-weight:600; padding:10px 2px;
  }
  .res small{display:block; color:var(--ink3); font-size:14px; font-weight:400; margin-top:2px}
  .res[disabled]{color:var(--ink3)}
  .res .pin{width:40px; height:40px; flex:none; border-radius:11px; background:var(--panel2);
    display:grid; place-items:center; color:var(--ink3)}
  #toast{
    position:fixed; left:50%; bottom:calc(var(--sheet-peek) + 72px); transform:translateX(-50%); z-index:30;
    background:#17271d; border:1px solid #2c4a35; border-radius:11px;
    padding:13px 20px; font-size:16px; display:none; max-width:92vw; text-align:center;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="where">
  <button id="btnFrom" type="button">
    <span class="dot"></span><span class="txt" id="txtFrom"></span>
    <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button id="btnTo" type="button">
    <span class="dot to"></span><span class="txt" id="txtTo"></span>
    <svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  </button>
</div>

<div id="mapbtns">
  <button id="btn3d" type="button" aria-pressed="true" title="2D / 3D">3D</button>
  <button id="btnFit" type="button" title="Toàn tuyến">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>
  </button>
</div>

<div id="sheet">
  <div id="grip"><i></i></div>

  <div class="pane" id="paneMap">
    <div id="fleet" aria-live="polite"></div>
    <button class="ghost" id="soloToggle" type="button"></button>
    <div id="solo" hidden>
    <div class="kicker" id="kDepart"></div>
    <div class="ansRow">
      <span class="ansTime" id="aTime">—</span>
      <span class="wait"><b id="aWait">—</b><span id="aWaitLab"></span></span>
    </div>
    <div class="ansSub" id="aSub"></div>
    <button class="primary" id="aGo"></button>
    <button class="ghost" id="aWhy"></button>
    <div class="why" id="whyBox" hidden></div>
    </div>
  </div>

  <div class="pane" id="paneSlots" hidden>
    <h2 class="pt" id="slotsTitle"></h2>
    <p class="ps" id="slotsSub"></p>
    <div id="slots"></div>
    <div class="legend" id="slotsLegend"></div>
  </div>

  <div class="pane" id="paneSet" hidden>
    <h2 class="pt" id="setTitle"></h2>
    <div class="srow">
      <span class="lab" id="labTruck"></span>
      <div class="seg" id="segTruck" style="flex-wrap:wrap"></div>
      <div class="note" id="truckNote"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labLang"></span>
      <div class="seg" id="segLang"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labScn"></span>
      <div class="seg v" id="segScn"></div>
      <div class="note" id="scnNote"></div>
    </div>
    <div class="srow">
      <div class="two">
        <div><label class="lab" for="demoTime" id="labNow"></label><input id="demoTime" type="time" value="06:10"></div>
        <div><label class="lab" for="slot" id="labSlot"></label><input id="slot" type="time"></div>
      </div>
      <div class="note" id="slotNote"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labReg"></span>
      <div class="seg" id="segReg"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labPay"></span>
      <div class="seg" id="segPay"></div>
      <div class="note" id="payNote"></div>
    </div>
    <div class="srow">
      <div class="two">
        <div><label class="lab" for="fuel" id="labFuel"></label><input id="fuel" type="number" value="35" min="10" max="80" step="1"></div>
        <div><label class="lab" for="hours" id="labHours"></label><input id="hours" type="number" min="0" max="11" step="0.5" placeholder="8"></div>
      </div>
    </div>
    <div class="srow">
      <details><summary id="sumRules"></summary><div id="rules"></div></details>
      <details><summary id="sumLedger"></summary><div id="ledger"></div></details>
      <div class="note" id="srcNote"></div>
    </div>
  </div>
</div>

<nav id="tabs">
  <button type="button" data-tab="map" aria-pressed="true">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></svg>
    <span data-i18n="tabMap"></span>
  </button>
  <button type="button" data-tab="slots" aria-pressed="false">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span data-i18n="tabSlots"></span>
  </button>
  <button type="button" data-tab="set" aria-pressed="false">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.9 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H3a2 2 0 110-4h.1A1.6 1.6 0 004.2 7l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1V3a2 2 0 114 0v.1A1.6 1.6 0 0017.1 5l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
    <span data-i18n="tabSet"></span>
  </button>
</nav>

<div id="search" hidden>
  <div class="sTop">
    <button id="sBack" type="button" aria-label="Back">‹</button>
    <div id="sTitle"></div>
  </div>
  <input id="q" type="search" autocomplete="off">
  <div id="sList"></div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="fleet.js"></script>
<script>
const $ = s => document.querySelector(s);
let lang = 'en', scenario = 'normal', tab = 'map';
let geo = null, POI = {}, map, mapReady = false, routeRoads = [];
let best = null, alts = [], blockedMsg = '', claimed = {}, myClaim = null;
let originId = ORIGINS[0].id, destId = 'cat-lai';

/* Destinations. Only Cát Lái has route data today — the rest are listed but
 * disabled so a driver never gets a silent wrong answer. */
const DESTS = [
  { id: 'cat-lai', vi: 'Cảng Cát Lái', en: 'Cát Lái Port', sub: { vi: 'Nguyễn Thị Định, TP Thủ Đức', en: 'Nguyễn Thị Định, Thủ Đức' }, ok: true },
  { id: 'phu-huu', vi: 'Cảng Phú Hữu', en: 'Phú Hữu Port', sub: { vi: 'TP Thủ Đức', en: 'Thủ Đức' }, ok: false },
  { id: 'tc-hiep-phuoc', vi: 'Tân Cảng Hiệp Phước', en: 'Tân Cảng Hiệp Phước', sub: { vi: 'Nhà Bè', en: 'Nhà Bè' }, ok: false },
  { id: 'icd-truong-tho', vi: 'ICD Trường Thọ', en: 'ICD Trường Thọ', sub: { vi: 'TP Thủ Đức', en: 'Thủ Đức' }, ok: false },
];

const STR = {
  tabMap: { vi: 'Bản đồ', en: 'Map' },
  tabSlots: { vi: 'Khung giờ', en: 'Gate slots' },
  tabSet: { vi: 'Cài đặt', en: 'Settings' },
  from: { vi: 'Đi từ đâu?', en: 'Start from?' },
  to: { vi: 'Đi đâu?', en: 'Where to?' },
  pickFrom: { vi: 'Chọn điểm xuất phát', en: 'Choose starting point' },
  pickTo: { vi: 'Chọn nơi đến', en: 'Choose destination' },
  searchPh: { vi: 'Tìm cảng, ICD, bãi…', en: 'Search port, ICD, depot…' },
  soon: { vi: 'Sắp có', en: 'Coming soon' },
  depart: { vi: 'Nên xuất phát', en: 'Leave at' },
  waitLab: { vi: 'phút chờ cổng', en: 'min gate wait' },
  sub: { vi: 'Vào cổng <b>{gate}</b> · {route} · {km} km', en: 'Gate at <b>{gate}</b> · {route} · {km} km' },
  saved: { vi: 'Tiết kiệm {n} phút nổ máy chờ so với đi ngay', en: 'Saves {n} min of engine-on waiting vs leaving now' },
  go: { vi: 'Nhận giờ này', en: 'Take this time' },
  goDone: { vi: 'Gửi cho nhà xe qua Zalo', en: 'Send to dispatcher via Zalo' },
  why: { vi: 'Vì sao giờ này?', en: 'Why this time?' },
  whyHide: { vi: 'Ẩn lý do', en: 'Hide reasons' },
  conf: { vi: 'Độ tin cậy', en: 'Confidence' },
  confLow: { vi: 'thấp', en: 'low' },
  confMed: { vi: 'trung bình', en: 'medium' },
  altTitle: { vi: 'Giờ khác', en: 'Other times' },
  noOption: { vi: 'Không có giờ nào hợp lệ. Mở Cài đặt và nới giờ hẹn hoặc giờ lái còn lại.',

function toast(msg) {
  $('#toast').textContent = msg; $('#toast').style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').style.display = 'none', 2400);
}

/* segmented control — never a native select (unusable with gloves in sunlight) */
function seg(id, options, value, onPick) {
  const el = $(id); el.innerHTML = '';
  for (const o of options) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = o.label;
    b.setAttribute('aria-pressed', String(o.v === value));
    b.onclick = () => { onPick(o.v); };
    el.appendChild(b);
  }
}

/* ---------------- search (also used as first-run onboarding) -------------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let searchDone = null;

function openSearch(field, onDone) {
  searchDone = onDone;
  $('#search').hidden = false;
  $('#sTitle').textContent = field === 'from' ? T('pickFrom') : T('pickTo');
  $('#q').placeholder = T('searchPh');
  $('#q').value = '';
  const items = field === 'from'
    ? ORIGINS.map(o => ({ id: o.id, name: oname(o), sub: '', ok: true }))
    : DESTS.map(d => ({ id: d.id, name: d[lang], sub: d.ok ? d.sub[lang] : T('soon'), ok: d.ok }));
  const draw = () => {
    const q = norm($('#q').value);
    $('#sList').innerHTML = '';
    for (const it of items.filter(i => norm(i.name).includes(q))) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'res';
      b.innerHTML = `<span class="pin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.4 7-11a7 7 0 10-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
        <span>${it.name}${it.sub ? `<small>${it.sub}</small>` : ''}</span>`;
      if (!it.ok) b.disabled = true;
      else b.onclick = () => { $('#search').hidden = true; searchDone(it.id); };
      $('#sList').appendChild(b);
    }
  };
  $('#q').oninput = draw; draw();
  $('#q').focus();
}
$('#sBack').onclick = () => { $('#search').hidden = true; };
$('#btnFrom').onclick = () => openSearch('from', id => { originId = id; saveProfile(); applyLang(); run(); });
$('#btnTo').onclick = () => openSearch('to', id => { destId = id; saveProfile(); applyLang(); run(); });

function saveProfile() {
  try { localStorage.setItem('dunggio-profile', JSON.stringify({ origin: originId, dest: destId, lang, truck: myTruck })); } catch {}
}

/* ---------------- recommendation (contract shape) ------------------------- */
function ctxNow() {
  return {
    nowMin: hm($('#demoTime').value || '06:10'), scenario,
    fuelPer100: +$('#fuel').value || 35, payType: $('#segPay').dataset.v,
    hourlyRate: RATES.driverVndPerH.v, dieselPrice: RATES.dieselVndPerL.v,
    hoursLeft: $('#hours').value ? +$('#hours').value : null,
    slotMin: $('#slot').value ? hm($('#slot').value) : null,
    registered24: $('#segReg').dataset.v === 'yes', poiCount: POI,
  };
}

function run() {
  const ctx = ctxNow();
  const opts = [];
  for (const r of ROUTES[originId]) for (const d of [0, 15, 30, 60, 90, 120]) opts.push(evalOption(r, d, ctx));
  const burden = LEDGER['Nguyễn Thị Định (Cát Lái)'] || 0;
  const ranked = scoreOptions(opts, WEIGHTS, 1 + Math.min(1, burden / 600)) || [];
  best = ranked[0] || null;
  // alternatives: next best at a different departure time
  alts = [];
  for (const o of ranked.slice(1)) {
    if (alts.length >= 2) break;
    if (o.departTime !== best.departTime && !alts.some(a => a.departTime === o.departTime)) alts.push(o);
  }
  const blocked = opts.filter(o => o.blocked.length);
  blockedMsg = (!best && blocked.length) ? T('noOption') : '';
  renderAnswer();
  renderSlots();
  const prev = routeRoads.join();
  routeRoads = best ? best.route.roads : [];
  paintRoads();
  if (routeRoads.join() !== prev) fitRoute();   // re-frame only when the road set changes
}

/* Confidence is never "high": the whole replay is simulated, and a disrupted
 * day rests on unverified driver reports. */
const confidence = () => scenario === 'normal' ? 'medium' : 'low';

function renderAnswer() {
  $('#kDepart').textContent = T('depart');
  if (!best) {
    $('#aTime').textContent = '—'; $('#aWait').textContent = '—';
    $('#aSub').textContent = blockedMsg; $('#aGo').disabled = true;
    $('#whyBox').hidden = true; return;
  }
  const o = best;
  $('#aGo').disabled = false;
  $('#aTime').textContent = o.departTime;
  $('#aWait').textContent = o.queue.lo === o.queue.hi ? o.queue.mid : `${o.queue.lo}–${o.queue.hi}`;
  $('#aWaitLab').textContent = T('waitLab');
  $('#aSub').innerHTML = T('sub')
    .replace('{gate}', o.gateTime).replace('{route}', o.route[lang]).replace('{km}', o.km)
    + ` <span class="chip sim">SIMULATED</span>`;
  const now = ROUTES[originId].map(r => evalOption(r, 0, ctxNow())).filter(x => !x.blocked.length)
    .sort((a, b) => a.idleMin - b.idleMin)[0];
  const savedMin = now ? Math.round(now.idleMin - o.idleMin) : 0;
  $('#whyBox').innerHTML = `
    ${savedMin > 4 ? `<div class="saved" style="margin-bottom:9px">${T('saved').replace('{n}', savedMin)}</div>` : ''}
    <ul>${reasons(o, now).map(r => `<li>${r}</li>`).join('')}</ul>
    <div class="kicker" style="margin-top:12px">${T('costT')}</div>
    ${costTable(o)}
    <div class="note">${T('conf')}: ${confidence() === 'low' ? T('confLow') : T('confMed')} · data_source: synthetic</div>
    ${alts.length ? `<div class="kicker" style="margin-top:14px">${T('altTitle')}</div>` : ''}
    ${alts.map(a => `<button class="alt" data-dep="${a.departTime}" type="button">
        <span class="at">${a.departTime}</span>
        <span class="an">${a.route[lang]}</span>
        <span class="aw">${a.queue.lo}–${a.queue.hi} ${lang === 'vi' ? 'ph' : 'min'}</span>
      </button>`).join('')}`;
  $('#whyBox').querySelectorAll('.alt').forEach(el => {
    el.onclick = () => {
      best = alts.find(a => a.departTime === el.dataset.dep) || best;
      alts = []; renderAnswer(); renderSlots();
      routeRoads = best.route.roads; paintRoads();
    };
  });
}

/* xSHIP lens: every cost on one bill, including the ones nobody bills. */
function costTable(o) {
  const vnd = v => Math.round(v).toLocaleString(lang === 'vi' ? 'vi-VN' : 'en-US') + ' ₫';
  const fuel = o.fuelL * RATES.dieselVndPerL.v;
  const wage = Math.max(0, o.costVnd - fuel - o.tollVnd - o.penaltyVnd);
  const rows = [
    [T('cFuel').replace('{l}', o.fuelL).replace('{p}', RATES.dieselVndPerL.v.toLocaleString()), vnd(fuel), 'est', 'EST', RATES.dieselVndPerL.src],
    [T('cToll'), vnd(o.tollVnd), 'est', 'EST', 'cầu Phú Mỹ container toll, estimate'],
    [T('cWage'), vnd(wage), 'est', 'EST', RATES.driverVndPerH.src],
    [T('cPen'), vnd(o.penaltyVnd), 'sim', 'SIM', 'simulated'],
  ];
  return `<table class="costs">${rows.map(([a, b, c, t, tip]) => `<tr><td>${a} ${tier(c, t, tip)}</td><td>${b}</td></tr>`).join('')}
    <tr><td><b>${T('cTotal')}</b></td><td><b>${vnd(o.costVnd)}</b></td></tr>
    <tr class="unbilled"><td>${T('cUnpaid')} ${tier('der', 'DERIVED', 'queue + waiting, per-trip pay')}</td><td>${o.unpaidMin} ${lang === 'vi' ? 'phút' : 'min'}</td></tr>
    <tr class="unbilled"><td>${T('cExpo')} ${tier('real', 'OSM', 'schools/clinics within 150 m of the queue road, OpenStreetMap')}</td><td>${o.exposure}</td></tr></table>`;
}

/* ---------------- gate slot load (30-min buckets) ------------------------- */
function renderSlots() {
  const scn = SCENARIOS[scenario];
  const cap = scn.capacityPerSlot * 2;                   // two 15-min slots per bar
  const mine = best ? Math.floor((best.gateMin % 1440) / 30) : -1;
  let html = '';
  for (let b = 12; b <= 39; b++) {                       // 06:00 → 20:00
    const arr = (ARRIVALS[b * 2] + ARRIVALS[b * 2 + 1]) * scn.arrivalsFactor;
    const load = arr / cap;
    const w = queueWaitAt(b * 30, scn).mid;
    const col = load >= 1 ? 'var(--stop)' : load >= .85 ? 'var(--warn)' : 'var(--go)';
    const held = (claimed[b] || 0) / cap * 100;
    const full = load >= 1;                               // Amazon-style: a full slot is not offered
    html += `<div class="slot${b === mine ? ' mine' : ''}${full ? ' full' : ''}">
      <span class="t">${fmt(b * 30)}</span>
      <span class="bar">
        <span class="fill" style="width:${Math.min(100, load * 100).toFixed(1)}%;background:${col}"></span>
        <span class="claim" style="width:${Math.min(20, held).toFixed(1)}%"></span>
      </span>
      <span class="w">${full ? T('full') : `${w} ${lang === 'vi' ? 'ph' : 'min'}`}</span>
    </div>`;
  }
  $('#slots').innerHTML = html;
  $('#slotsLegend').innerHTML = [
    ['var(--go)', T('legClear')], ['var(--warn)', T('legSlow')],
    ['var(--stop)', T('legJam')], ['var(--accent)', T('legMine')],
  ].map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')
    + ` <span class="chip sim">SIMULATED</span>`;
}

/* ---------------- map ------------------------------------------------------ */
function roadColor(name) {
  const scn = SCENARIOS[scenario];
  if ((scn.slowRoads || []).includes(name)) return '#dc2626';
  const w = queueWaitAt(hm($('#demoTime').value || '06:10'), scn).mid;
  if (name === 'Nguyễn Thị Định') return w >= 20 ? '#dc2626' : w >= 10 ? '#d97706' : '#15803d';
  if (name === 'Đồng Văn Cống') return w >= 40 ? '#d97706' : '#15803d';   // queue spillback
  return '#15803d';
}

function paintRoads() {
  if (!mapReady || !geo) return;
  const onRoute = ['in', ['get', 'name'], ['literal', routeRoads]];
  const m = ['match', ['get', 'name']];
  for (const name of Object.keys(geo.roads)) m.push(name, roadColor(name));
  m.push('#15803d');
  // off-route roads stay visible but recede, so the driver sees one line to follow
  map.setPaintProperty('roads', 'line-color', ['case', onRoute, m, '#8b96a5']);
  map.setPaintProperty('roads', 'line-width', ['case', onRoute, 7, 3]);
  map.setPaintProperty('roads', 'line-opacity', ['case', onRoute, 1, .55]);
  map.setFilter('route-case', onRoute);
}

function fitRoute() {
  if (!mapReady || !geo) return;
  const pts = routeRoads.flatMap(r => geo.roads[r] || []);
  if (!pts.length) return;
  const b = pts.reduce((a, p) => a.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  const sheetH = $('#sheet').getBoundingClientRect().height + 58;
  map.fitBounds(b, { padding: { top: 150, bottom: sheetH + 10, left: 36, right: 76 }, duration: 600 });
}

/* schools/hospitals within ~150 m of each road (exposure input) */
function poiCounts() {
  const out = {};
  const pois = [...(geo.schools || []), ...(geo.hospitals || [])];
  for (const [name, line] of Object.entries(geo.roads || {})) {
    let n = 0;
    for (const p of pois) {
      for (let i = 0; i < line.length; i += 2) {
        const dLat = (p.lat - line[i][1]) * 111320, dLon = (p.lon - line[i][0]) * 109200;
        if (dLat * dLat + dLon * dLon < 150 * 150) { n++; break; }
      }
    }
    out[name] = n;
  }
  return out;
}

/* ---------------- language + chrome --------------------------------------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  const o = ORIGINS.find(x => x.id === originId);
  $('#txtFrom').textContent = o ? oname(o) : T('from');
  $('#txtFrom').classList.toggle('empty', !o);
  $('#txtTo').textContent = nameOf(DESTS, destId) || T('to');
  $('#aGo').textContent = T('go');
  /* One time on screen: the dispatcher's plan is the answer; the solo planner is
   * folded away so a driver (or judge) never sees two different leave times. */
  $('#soloToggle').textContent = $('#solo').hidden
    ? (lang === 'vi' ? 'Chạy chuyến riêng, không theo nhà xe? Tự xem giờ đi ▸' : 'Not on a fleet job? Plan your own trip ▸')
    : (lang === 'vi' ? 'Ẩn công cụ chuyến riêng ▴' : 'Hide own-trip planner ▴');
  $('#aWhy').textContent = $('#whyBox').hidden ? T('why') : T('whyHide');
  for (const [id, k] of [['#slotsTitle','slotsTitle'], ['#slotsSub','slotsSub'], ['#setTitle','setTitle'],
    ['#labLang','labLang'], ['#labScn','labScn'], ['#labNow','labNow'], ['#labSlot','labSlot'],
    ['#slotNote','slotNote'], ['#labReg','labReg'], ['#labPay','labPay'], ['#payNote','payNote'],
    ['#labFuel','labFuel'], ['#labHours','labHours'], ['#sumRules','sumRules'],
    ['#sumLedger','sumLedger'], ['#srcNote','srcNote']]) $(id).textContent = T(k);

  $('#labTruck').textContent = T('labTruck'); $('#truckNote').textContent = T('truckNote');
  seg('#segTruck', FLEET.map(t => ({ v: t.id, label: t.id })), myTruck,
    v => { myTruck = v; saveProfile(); applyLang(); renderFleet(); });
  seg('#segLang', [{ v: 'vi', label: 'Tiếng Việt' }, { v: 'en', label: 'English' }], lang,
    v => { lang = v; saveProfile(); applyLang(); run(); });
  seg('#segPay', [{ v: 'trip', label: T('payTrip') }, { v: 'hourly', label: T('payHour') }],
    $('#segPay').dataset.v, v => { $('#segPay').dataset.v = v; applyLang(); run(); });
  seg('#segReg', [{ v: 'no', label: T('no') }, { v: 'yes', label: T('yes') }],
    $('#segReg').dataset.v, v => { $('#segReg').dataset.v = v; applyLang(); run(); });
  seg('#segScn', Object.entries(SCENARIOS).map(([k, s]) => ({ v: k, label: s[lang] })), scenario,
    v => { scenario = v; applyLang(); run(); });
  $('#scnNote').innerHTML = scenario === 'disrupted'
    ? `${SCENARIOS.disrupted.report[lang]} <span class="chip sim">SIMULATED</span>` : '';
  $('#rules').innerHTML = RULES.map(r =>
    `<div class="rule">${r[lang]}<div class="src">${(lang === 'en' && r.src_en) || r.src} · ${lang === 'vi' ? 'kiểm tra' : 'verified'} ${r.verified} · ${r.confidence}</div></div>`).join('');
  $('#ledger').innerHTML = Object.entries(LEDGER).map(([a, v]) =>
    `<div class="rule">${a}: <b>${v}</b> ${lang === 'vi' ? 'phút xe nổ máy chờ' : 'idle truck-minutes'}</div>`).join('');
  setMapLang();
}

/* Map labels follow the app language: English names where OSM has them, else the local name. */
const _origTF = {};
function setMapLang() {
  if (!map || !map.isStyleLoaded || !map.isStyleLoaded()) return;
  for (const l of map.getStyle().layers) {
    if (l.type !== 'symbol') continue;
    const tf = map.getLayoutProperty(l.id, 'text-field');
    if (tf == null) continue;
    if (!(l.id in _origTF)) _origTF[l.id] = tf;
    if (!JSON.stringify(_origTF[l.id]).includes('name')) continue;
    map.setLayoutProperty(l.id, 'text-field', lang === 'en'
      ? ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']]
      : _origTF[l.id]);
  }
}

/* engine-written reasons (no LLM ever writes a number) */
function reasons(o, vs) {
  const vi = lang === 'vi', r = [];
  const loadPct = Math.round((ARRIVALS[Math.floor((o.gateMin % 1440) / 15)] * SCENARIOS[scenario].arrivalsFactor)
    / SCENARIOS[scenario].capacityPerSlot * 100);
  r.push(vi ? `Khung giờ này cổng nhận ${loadPct}% so với sức thông quan`
            : `At this slot the gate is at ${loadPct}% of its clearing capacity`);
  if (vs) { const c = clauses(o, vs, lang); if (c) r.push(c[0].toUpperCase() + c.slice(1)); }
  if (o.waitOpenMin > 0) r.push(vi ? `Gồm ${o.waitOpenMin} phút chờ cổng mở lúc 7:30`
                                   : `Includes ${o.waitOpenMin} min waiting for the 7:30 opening`);
  if (o.unpaidMin) r.push(vi ? `${o.unpaidMin} phút này anh/chị không được trả công`
                             : `${o.unpaidMin} of these minutes are unpaid for you`);
  return r;
}

/* ---------------- fleet plan + shared state with the dispatcher website ---- */
/* Same engine as the website (fleet.js → allocateFleet 'aware'): app users are placed
 * first, one at a time, each counting the ones before it. The website's Re-plan and
 * Approve arrive here through /api/state. Offline, the card shows the morning plan. */
let myTruck = 'T09', SH = { step: 0, approved: false, trust: false, reports: 0, rev: -1 }, shOnline = false, DAYF = null;
function fleetDay() {
  if (!DAYF) DAYF = runDay({}, geo ? exposureShare(geo.roads['Nguyễn Thị Định'], [...geo.schools, ...geo.hospitals]) : 0.243);
  return DAYF;
}
const tier = (cls, txt, tip) => `<span class="tier ${cls}" title="${tip}">${txt}</span>`;
function renderFleet() {
  const d = fleetDay(), id = myTruck, vi = lang === 'vi';
  const row = p => p.ev.rows.find(r => r.id === id);
  const n = row(d.normal), st = row(d.stale), re = row(d.replan);
  const step = SH.step, live = step === 4 && SH.approved;
  let r = n, cls = '', head = T('fleetLeave').replace('{dep}', fmt(n.depart)).replace('{gate}', fmt(n.gate)), extra = '';
  if (step >= 3 && !live) {
    r = st; cls = st.late ? 'late' : 'alert';
    head = T('fleetLeave').replace('{dep}', fmt(st.depart)).replace('{gate}', fmt(st.gate));
    extra = `<div class="fs">${st.late ? T('fleetAlert').replace('{late}', Math.round(st.whArrive - st.win[1])) : T('fleetAlertOk')}</div>`
          + (step === 4 ? `<div class="fs">${T('fleetPending')}</div>` : '');
  }
  if (live) {
    r = re; cls = 'new';
    head = Math.abs(re.depart - st.depart) >= 5
      ? T('fleetNew').replace('{dep}', fmt(re.depart)).replace('{old}', fmt(st.depart))
      : T('fleetLeave').replace('{dep}', fmt(re.depart)).replace('{gate}', fmt(re.gate)) + `<div class="fs">${T('fleetSame')}</div>`;
  }
  const creep = Math.max(0, Math.round(r.depart - r.planned));
  $('#fleet').className = cls;
  $('#fleet').innerHTML = `
    <div class="fk">${T('fleetK').replace('{id}', id)} ${tier('sim', 'SIM', vi ? 'Đội xe, đơn hàng, giờ kho là mô phỏng' : 'Fleet, jobs and warehouse windows are simulated')}
      <span class="sync ${shOnline ? 'on' : ''}">● ${shOnline ? (vi ? 'đồng bộ với nhà xe' : 'live with dispatcher') : (vi ? 'ngoại tuyến' : 'offline')}</span></div>
    <div class="fm">${head} ${tier('der', 'DERIVED', vi ? 'Tính bởi bộ xếp giờ: mỗi xe được xếp có tính các xe đã xếp trước (chống dồn cục)' : 'Computed by the allocator: each truck is placed counting the trucks already placed (anti-herding)')}</div>
    <div class="fs">${T('fleetSub').replace('{w}', Math.round(r.wait)).replace('{wh}', fmt(r.whArrive)).replace('{close}', fmt(r.win[1]))}</div>
    ${extra}
    <div class="fs">${T('creep').replace('{cap}', CREEP_CAP_MIN).replace('{n}', creep ? T('creepN').replace('{n}', creep) : T('creepNone'))}</div>
    <div class="note">${T('appFirst')}</div>
    <button id="report" type="button"></button>`;
  const mine = (() => { try { return localStorage.getItem('dg-reported') === '1'; } catch { return false; } })();
  $('#report').textContent = step >= 2 ? T('report2') : (step >= 1 ? T('report1') : T('report'));
  $('#report').disabled = step >= 2 || (step >= 1 && mine);   // one phone = one source
  $('#report').onclick = doReport;
}
async function doReport() {
  try { localStorage.setItem('dg-reported', '1'); } catch {}
  // A second report only confirms if it comes from a different phone (independent source).
  const reports = SH.reports + 1;
  const patch = { reports, step: Math.max(SH.step, reports >= 2 ? 2 : 1) };
  try {
    const st = await (await fetch('/api/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })).json();
    applyShared(st);
  } catch { applyShared({ ...SH, ...patch, rev: SH.rev + 1 }); }
}
function applyShared(st) {
  const was = SH;
  SH = st;
  if (st.step !== was.step) {
    scenario = st.step >= 3 ? 'disrupted' : 'normal';         // the map turns red once the incident is CONFIRMED + applied
    if (st.step === 0) { try { localStorage.removeItem('dg-reported'); } catch {} }
    applyLang(); run();
  }
  if (st.approved && !was.approved && st.step === 4) toast(lang === 'vi' ? 'Nhà xe đã duyệt kế hoạch mới' : 'Dispatcher approved a new plan');
  renderFleet();
}
async function pullShared() {
  try {
    const st = await (await fetch('/api/state', { cache: 'no-store' })).json();
    const first = !shOnline; shOnline = true;
    if (st.rev !== SH.rev) applyShared(st); else if (first) renderFleet();
  } catch { if (shOnline) { shOnline = false; renderFleet(); } }
}

/* ---------------- tabs + sheet -------------------------------------------- */
const setTall = on => {
  $('#sheet').classList.toggle('tall', on);
  document.body.classList.toggle('tall', on);   // map chrome gets out of the way
};
document.querySelectorAll('#tabs button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#paneMap').hidden = tab !== 'map';
    $('#paneSlots').hidden = tab !== 'slots';
    $('#paneSet').hidden = tab !== 'set';
    setTall(tab !== 'map');
    if (tab === 'map') fitRoute();
  };
});
$('#grip').onclick = () => setTall(!$('#sheet').classList.contains('tall'));

$('#soloToggle').onclick = () => { $('#solo').hidden = !$('#solo').hidden; applyLang(); };
$('#aWhy').onclick = () => { $('#whyBox').hidden = !$('#whyBox').hidden; setTall(!$('#whyBox').hidden); applyLang(); };

$('#aGo').onclick = async () => {
  if (!best) return;
  const b = Math.floor((best.gateMin % 1440) / 30);
  if (myClaim !== b) {                                    // local hold; backend POST /claim later
    claimed[b] = (claimed[b] || 0) + 1;
    myClaim = b;
    renderSlots();
  }
  // confirm before sharing: the share sheet can sit open for a long time
  toast(T('claimed').replace('{t}', fmt(b * 30)));
  $('#aGo').textContent = T('goDone');
  const msg = lang === 'vi'
    ? `[DispatchMonkey] Xuất phát ${best.departTime}, ${best.route.vi}, vào cổng ${best.gateTime} (chờ ${best.queue.lo}–${best.queue.hi} phút). Demo — số liệu mô phỏng.`
    : `[DispatchMonkey] Depart ${best.departTime}, ${best.route.en}, gate ${best.gateTime} (wait ${best.queue.lo}–${best.queue.hi} min). Demo — simulated data.`;
  if (navigator.share) { try { await navigator.share({ text: msg }); return; } catch {} }
  try { await navigator.clipboard.writeText(msg); toast(T('copied')); } catch {}
};

['demoTime', 'slot', 'fuel', 'hours'].forEach(id => $('#' + id).onchange = run);
$('#btn3d').onclick = () => {
  const on = $('#btn3d').getAttribute('aria-pressed') === 'true';
  $('#btn3d').setAttribute('aria-pressed', String(!on));
  $('#btn3d').textContent = on ? '2D' : '3D';
  map.easeTo({ pitch: on ? 0 : 55, bearing: on ? 0 : -20, duration: 500 });
};
$('#btnFit').onclick = fitRoute;
window.addEventListener('resize', () => { if (map) map.resize(); });

async function boot() {
  let prof = null;
  try { prof = JSON.parse(localStorage.getItem('dunggio-profile') || 'null'); } catch {}
  if (prof) { originId = prof.origin || originId; destId = prof.dest || destId; lang = prof.lang || lang; myTruck = prof.truck || myTruck; }
  $('#segPay').dataset.v = 'trip';
  $('#segReg').dataset.v = 'no';
  applyLang();

  try { geo = await (await fetch('geo.json')).json(); } catch { geo = null; }
  if (geo) POI = poiCounts();

  map = new maplibregl.Map({
    container: 'map', style: 'https://tiles.openfreemap.org/styles/liberty',
    center: [106.760, 10.752], zoom: 12.3, pitch: 55, bearing: -20, attributionControl: false,
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
  map.on('load', () => {
    setMapLang();
    if (geo) {
      map.addSource('roads', { type: 'geojson', data: {
        type: 'FeatureCollection',
        features: Object.entries(geo.roads).map(([name, line]) => ({
          type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: line },
        })),
      }});
      // Sentinel-1 radar crop of Cát Lái (REAL, ships boxed in red by tools/count_ships.py). Local file, works offline.
      map.addSource('radar', { type: 'image', url: 'sat/latest_overlay.png',
        coordinates: [[106.76, 10.80], [106.84, 10.80], [106.84, 10.73], [106.76, 10.73]] });
      map.addLayer({ id: 'radar', type: 'raster', source: 'radar', paint: { 'raster-opacity': .55 } });
      map.addLayer({ id: 'route-case', type: 'line', source: 'roads',
        filter: ['in', ['get', 'name'], ['literal', []]],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#2563eb', 'line-width': 13, 'line-opacity': .5 } });
      map.addLayer({ id: 'roads', type: 'line', source: 'roads',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-width': 6, 'line-opacity': .95 } });
    }
    new maplibregl.Marker({ color: '#2563eb' }).setLngLat([GATE.lon, GATE.lat]).addTo(map);
    mapReady = true;
    paintRoads(); fitRoute();
    setTimeout(() => { map.resize(); fitRoute(); }, 400);   // sheet/viewport may settle after load
  });

  run();
  renderFleet();
  pullShared(); setInterval(pullShared, 1500);
  if (!prof) openSearch('from', id => {              // first run: ask the 2 navigation questions
    originId = id; applyLang();
    openSearch('to', d => { destId = d; saveProfile(); applyLang(); run(); });
  });
  setInterval(() => { paintRoads(); if (tab === 'slots') renderSlots(); }, 5000);
}
boot();
</script>
