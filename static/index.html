<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detour Receipt — port to warehouse decision support</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    --bg:#11151c; --panel:#1a2029; --panel2:#212936; --line:#2d3747;
    /* ink3 is #8b97a8 not a darker grey: at 11px it must clear 4.5:1, and it is
       painted on --panel2 (#212936) as well as --panel. 4.9:1 on the worse one. */
    --ink:#e8edf3; --ink2:#9aa7b8; --ink3:#8b97a8;
    --risk:#ff6b6b; --warn:#fbbf24; --ok:#4ade80; --info:#60a5fa; --accent:#c4b5fd;
    --r:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button{font:inherit; color:inherit; cursor:pointer}
  h1,h2,h3{margin:0; font-weight:650}

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:12px 18px 10px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{font-size:17px; letter-spacing:-.2px}
  .brand small{display:block; font-size:12px; font-weight:400; color:var(--ink2); margin-top:3px}
  .spacer{flex:1}
  .seg{display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .seg button{
    background:transparent; border:0; padding:0 14px; min-height:40px;
    color:var(--ink2); font-size:13px; font-weight:600; letter-spacing:.3px;
  }
  .seg button[aria-pressed="true"]{background:var(--accent); color:#14161c}
  select,input[type=text],input[type=number]{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:var(--r); padding:0 12px; min-height:40px; font:inherit;
  }
  .ghost{
    background:transparent; border:1px solid var(--line); border-radius:var(--r);
    min-height:40px; padding:0 14px; font-size:13px; font-weight:600; color:var(--ink2);
  }
  .ghost:hover{color:var(--ink); border-color:var(--ink3)}

  /* ---------- what changed banner ---------- */
  #changed{
    padding:10px 18px; background:#2a1e1e; border-bottom:1px solid #4a2b2b;
    font-size:14px; display:none; gap:10px; align-items:flex-start;
  }
  #changed.on{display:flex}
  #changed .dot{
    width:8px;height:8px;border-radius:50%;background:var(--risk);margin-top:7px;flex:0 0 auto;
    box-shadow:0 0 0 4px rgba(255,107,107,.18);
  }
  #changed b{color:#ffd0d0}

  /* ---------- indicators ---------- */
  #kpis{
    display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
    background:var(--line); border-bottom:1px solid var(--line);
  }
  .kpi{background:var(--panel); padding:9px 14px 11px}
  .kpi .k{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--ink3)}
  .kpi .v{font-size:21px; font-weight:680; margin-top:5px; font-variant-numeric:tabular-nums}
  .kpi .d{font-size:12px; color:var(--ink2); margin-top:2px}
  .kpi .d b{font-variant-numeric:tabular-nums}
  .up{color:var(--risk)} .down{color:var(--ok)} .flat{color:var(--ink3)}

  /* ---------- body ---------- */
  main{flex:1; display:flex; min-height:0}
  #list{
    width:310px; flex:0 0 auto; border-right:1px solid var(--line);
    overflow:auto; background:var(--panel);
  }
  .listhead{
    padding:11px 14px 7px; font-size:11px; text-transform:uppercase;
    letter-spacing:.7px; color:var(--ink3); position:sticky; top:0; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .ship{
    width:100%; text-align:left; background:transparent; border:0;
    border-bottom:1px solid var(--line); padding:11px 14px 13px; display:block;
  }
  .ship:hover{background:var(--panel2)}
  .ship[aria-current="true"]{background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent)}
  .ship .r1{display:flex; align-items:baseline; gap:8px}
  .ship .id{font-weight:650; font-size:14px; letter-spacing:.2px}
  .ship .r2{font-size:12.5px; color:var(--ink2); margin-top:4px}
  .ship .r3{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap}

  .chip{
    font-size:11px; font-weight:650; letter-spacing:.3px; padding:3px 8px;
    border-radius:999px; border:1px solid currentColor; white-space:nowrap;
  }
  .c-risk{color:var(--risk)} .c-warn{color:var(--warn)}
  .c-ok{color:var(--ok)} .c-mute{color:var(--ink3)} .c-info{color:var(--info)}

  #map{flex:1; min-width:0; background:#0c1016}
  .leaflet-container{background:#0c1016}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
  }
  .leaflet-popup-content{margin:11px 13px; font:13px/1.5 inherit}
  #legend{
    position:absolute; left:12px; bottom:12px; z-index:500; background:rgba(26,32,41,.94);
    border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; font-size:12px;
  }
  #legend label{display:flex; align-items:center; gap:7px; min-height:28px; color:var(--ink2)}
  #legend .sim{margin-top:7px; padding-top:7px; border-top:1px solid var(--line); color:var(--ink3); max-width:210px}

  /* ---------- receipts drawer ---------- */
  #drawer{
    width:0; flex:0 0 auto; border-left:1px solid var(--line); overflow:auto;
    background:var(--panel); transition:width .16s ease;
  }
  #drawer.open{width:430px}
  .dhead{padding:14px 16px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2}
  .dhead .t{display:flex; align-items:center; gap:10px}
  .dhead h2{font-size:16px}
  .dhead .sub{font-size:12.5px; color:var(--ink2); margin-top:6px}
  .dsec{padding:13px 16px 15px; border-bottom:1px solid var(--line)}
  .dsec > .st{font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--ink3); margin-bottom:9px}

  /* the receipt — the one loud element on the screen */
  .rcpt{
    border:1px solid var(--line); border-radius:var(--r); background:var(--panel2);
    margin-bottom:12px; overflow:hidden;
  }
  .rcpt.best{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
  .rcpt.dead{opacity:.62}
  .rcpt .rh{padding:10px 13px 11px; border-bottom:1px solid var(--line)}
  .rcpt .rh .nm{font-weight:650; font-size:14px; display:flex; gap:8px; align-items:baseline}
  .rcpt .rh .nm .k{font-size:11px; color:var(--ink3); font-weight:600; letter-spacing:.4px; text-transform:uppercase}
  .rcpt .rh .arr{font-size:12.5px; margin-top:5px}
  .lines{padding:4px 13px 9px; font-size:13px}
  .ln{display:flex; justify-content:space-between; gap:12px; padding:4px 0; border-bottom:1px dotted #273040}
  .ln:last-child{border-bottom:0}
  .ln .lk{color:var(--ink2)}
  .ln .lv{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .why{border-bottom:1px dashed var(--ink3); cursor:help}
  .rnote{
    padding:9px 13px; font-size:12.5px; color:var(--ink2);
    background:#1b2330; border-top:1px solid var(--line);
  }
  .rnote .star{color:var(--accent); font-weight:700}
  .rblock{padding:9px 13px; font-size:12.5px; background:#2a1e1e; color:#ffd0d0; border-top:1px solid var(--line)}
  .runconf{padding:9px 13px; font-size:12.5px; background:#2a2518; color:#ffe9b8; border-top:1px solid var(--line)}
  .racts{display:flex; gap:8px; padding:11px 13px; border-top:1px solid var(--line)}
  .primary{
    flex:1; min-height:44px; border:0; border-radius:8px; background:var(--accent);
    color:#14161c; font-weight:700; font-size:13.5px;
  }
  .primary[disabled]{background:#39414f; color:var(--ink3)}
  .secondary{min-height:44px; border:1px solid var(--line); border-radius:8px; background:transparent; padding:0 13px; font-size:13px; color:var(--ink2)}

  .sliders label{display:flex; align-items:center; gap:10px; min-height:34px; font-size:13px}
  .sliders label span{width:118px; color:var(--ink2)}
  .sliders input[type=range]{flex:1; accent-color:var(--accent)}
  .sliders .n{width:34px; text-align:right; color:var(--ink3); font-variant-numeric:tabular-nums; font-size:12px}

  /* ---------- modal ---------- */
  dialog{
    border:1px solid var(--line); border-radius:12px; background:var(--panel);
    color:var(--ink); max-width:720px; width:92vw; padding:0;
  }
  dialog::backdrop{background:rgba(6,8,12,.7)}
  .mh{padding:15px 18px 13px; border-bottom:1px solid var(--line); display:flex; align-items:center}
  .mb{padding:15px 18px 20px; max-height:65vh; overflow:auto; font-size:13.5px}
  table{width:100%; border-collapse:collapse; font-size:13px}
  th,td{text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:top}
  th{color:var(--ink3); font-size:11px; text-transform:uppercase; letter-spacing:.6px; font-weight:600}
  td.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
  .log{font-size:13px}
  .log li{padding:8px 0; border-bottom:1px solid var(--line); list-style:none}
  .log .ts{color:var(--ink3); font-size:11.5px; font-variant-numeric:tabular-nums}
  .log ul{margin:0; padding:0}

  #tip{
    position:fixed; z-index:9999; max-width:310px; display:none;
    background:#0d1117; border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; font-size:12.5px; line-height:1.5; color:var(--ink);
    box-shadow:0 10px 28px rgba(0,0,0,.55); pointer-events:none;
  }
  #tip .f{color:var(--accent); font-variant-numeric:tabular-nums}
  #tip .s{color:var(--ink3); margin-top:5px; display:block}
  .empty{padding:40px 22px; color:var(--ink3); font-size:13.5px; text-align:center}
</style>
</head>
<body>

<header>
  <div class="brand">Detour Receipt
    <small>Port of LA / Long Beach &rarr; Inland Empire warehouses &middot; dispatcher view</small>
  </div>
  <div class="spacer"></div>

  <div class="seg" role="group" aria-label="Data source">
    <button id="mReplay" aria-pressed="true">Replay</button>
    <button id="mLive" aria-pressed="false">Live CHP</button>
  </div>
  <select id="scenario" aria-label="Replayed situation"></select>
  <button class="ghost" id="btnLog">Activity log</button>
  <button class="ghost" id="btnAssume">Assumptions</button>
</header>

<div id="changed"><div class="dot"></div><div id="changedText"></div></div>

<div id="kpis"></div>

<main>
  <div id="list"></div>
  <div id="map" style="position:relative">
    <div id="legend">
      <label><input type="checkbox" id="lSchools"> Schools (OpenStreetMap)</label>
      <label><input type="checkbox" id="lBurden" checked> High pollution-burden areas</label>
      <label><input type="checkbox" id="lTrust" checked> Trust unconfirmed reports</label>
      <div class="sim">Shipments, trucks and appointments are <b>simulated</b>. Roads and schools are real OpenStreetMap data.</div>
    </div>
  </div>
  <aside id="drawer"></aside>
</main>

<div id="tip"></div>

<dialog id="modal">
  <div class="mh"><h2 id="modalTitle"></h2><div class="spacer"></div>
    <button class="ghost" onclick="document.getElementById('modal').close()">Close</button></div>
  <div class="mb" id="modalBody"></div>
</dialog>

<script src="vendor/leaflet.js"></script>
<script src="fleet.js"></script>
<script src="scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
