<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Đúng Giờ — Cảng Cát Lái</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
  /* Light, map-first. Navy = driving, coral = idling in the gate queue, lime = the pick. */
  :root{
    --paper:#edefea; --card:#ffffff; --sunk:#f4f5f2; --line:#e3e6e0;
    --ink:#14202e; --ink2:#4b5867; --ink3:#6b7785;
    --navy:#1d3557; --jam:#e5484d; --slow:#e8a317; --ok:#2f9e5b;
    --lime:#d4f36b; --lime-ink:#1f2a05;
    --chart:#1d3557; --chart2:#e5484d; --bg:#ffffff;   /* used by the chart */
    --ease-out:cubic-bezier(.23,1,.32,1);
    --r-lg:22px; --r-md:14px; --r-sm:10px;
    --shadow:0 1px 2px rgba(20,32,46,.06), 0 12px 32px rgba(20,32,46,.10);
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; overscroll-behavior:none}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    /* driver UX: 17px floor + 52px targets (phone mounted at arm's length, glare) */
    font:17px/1.45 'Be Vietnam Pro',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  button,[role="button"]{touch-action:manipulation; user-select:none; -webkit-user-select:none; font:inherit; color:inherit}
  :focus-visible{outline:2.5px solid var(--navy); outline-offset:2px}
  input,select{font-size:16px}

  /* ---------- layout: phone = map on top, sheet below ---------- */
  #map{height:44dvh; min-height:280px; background:var(--paper)}
  .sheet{
    position:relative; margin-top:-22px; background:var(--card);
    border-radius:var(--r-lg) var(--r-lg) 0 0; padding:10px 16px calc(32px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -6px 24px rgba(20,32,46,.08);
  }
  .sheet::before{content:""; display:block; width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px}

  /* ---------- desktop: full-bleed map, floating panels (Dribbble reference) ---------- */
  @media (min-width:960px){
    #map{position:fixed; inset:0; height:auto}
    .sheet{
      position:fixed; top:20px; left:20px; bottom:20px; width:430px; margin:0;
      border-radius:var(--r-lg); box-shadow:var(--shadow); overflow-y:auto; overscroll-behavior:contain;
      padding:20px 22px 28px;
    }
    .sheet::before{display:none}
    .live{position:fixed; right:20px; bottom:20px; width:420px; margin:0 !important; box-shadow:var(--shadow); border:0 !important; z-index:2}
    .maplibregl-ctrl-top-right{top:8px; right:8px}
  }

  /* ---------- header ---------- */
  header{display:flex; align-items:center; gap:8px}
  .brand{flex:1; display:flex; align-items:center; gap:10px; min-width:0}
  .mark{width:34px; height:34px; border-radius:10px; background:var(--navy); display:grid; place-items:center; flex:none}
  .mark i{width:14px; height:14px; border-radius:50%; border:3px solid var(--lime); border-right-color:transparent; transform:rotate(-45deg)}
  h1{font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0}
  .sub{color:var(--ink2); font-size:15px; margin:10px 0 16px; max-width:60ch}
  .pill{
    min-height:44px; padding:0 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink2); font-size:15px; font-weight:500; cursor:pointer;
    transition:transform 140ms var(--ease-out), background-color 140ms ease;
  }
  .pill:active{transform:scale(.97); background:var(--sunk)}

  /* ---------- segmented tabs (scenario) ---------- */
  .tabs{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; padding:4px; background:var(--sunk); border-radius:999px}
  .tabs button{
    min-height:46px; border:0; border-radius:999px; background:transparent; color:var(--ink2);
    font-size:15px; font-weight:600; cursor:pointer; padding:0 10px;
    transition:background-color 180ms var(--ease-out), color 180ms ease, transform 140ms var(--ease-out);
  }
  .tabs button:active{transform:scale(.97)}
  .tabs button[aria-pressed="true"]{background:var(--ink); color:#fff}
  .note{font-size:14px; color:var(--ink2); margin:8px 2px 16px}

  /* ---------- tags ---------- */
  .chip{display:inline-block; font-size:12px; font-weight:600; border-radius:6px; padding:1px 7px; vertical-align:2px; white-space:nowrap; background:var(--sunk); color:var(--ink3)}
  .chip.sim{background:#fbf3d9; color:#7a5b00}
  .tag{display:inline-block; font-size:13px; font-weight:600; border-radius:999px; padding:3px 10px; background:var(--sunk); color:var(--ink2)}
  .tag.best{background:var(--lime); color:var(--lime-ink)}

  /* ---------- live gate congestion ---------- */
  .live{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 16px; margin-bottom:18px}
  .liveTop{display:flex; align-items:center; gap:9px; font-size:15px; font-weight:600; color:var(--ink2)}
  .liveTop b{flex:1; font-weight:600}
  .liveDot{width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none; box-shadow:0 0 0 4px rgba(47,158,91,.15)}
  .liveDot.bad{background:var(--jam); box-shadow:0 0 0 4px rgba(229,72,77,.15)}
  .liveRow{display:flex; align-items:baseline; gap:10px; margin:6px 0 0}
  .liveNum{font-size:34px; font-weight:700; letter-spacing:-.02em}
  #jamChart{width:100%; display:block; margin-top:2px}
  #jamChart .ctk{fill:var(--ink3); font:500 11px 'Be Vietnam Pro',sans-serif}
  #jamChart .cax{fill:var(--ink3); font:500 10.5px 'Be Vietnam Pro',sans-serif}
  .hint{font-size:14px; color:var(--ink3); margin-top:6px}

  /* ---------- trip form ---------- */
  .trip{border:1px solid var(--line); border-radius:var(--r-md); margin-bottom:18px}
  .trip summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; min-height:56px; padding:0 16px; font-weight:600}
  .trip summary::-webkit-details-marker{display:none}
  .trip summary span{flex:1}
  .trip summary small{color:var(--ink3); font-weight:400; font-size:14px}
  .trip summary::after{content:""; width:9px; height:9px; border-right:2px solid var(--ink3); border-bottom:2px solid var(--ink3); transform:rotate(45deg); margin-top:-4px; transition:transform 200ms var(--ease-out)}
  .trip[open] summary::after{transform:rotate(225deg); margin-top:4px}
  .tripBody{padding:2px 16px 16px}
  fieldset{border:0; padding:0; margin:0 0 14px}
  legend{font-size:15px; font-weight:600; color:var(--ink); margin-bottom:8px; padding:0}
  .lab{display:block; font-size:14px; font-weight:500; color:var(--ink2); margin:0 0 6px}
  input{
    width:100%; background:var(--sunk); color:var(--ink); border:1px solid transparent;
    border-radius:var(--r-sm); padding:12px 13px; font-family:inherit; min-height:52px;
    transition:border-color 140ms ease, background-color 140ms ease;
  }
  input:focus{border-color:var(--navy); background:var(--card); outline:none}
  .seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; background:var(--sunk); border-radius:12px; padding:4px}
  .seg.v{grid-auto-flow:row}
  .seg button{
    min-height:48px; border:0; border-radius:9px; background:transparent; color:var(--ink2);
    font-size:15.5px; font-weight:500; cursor:pointer; padding:0 10px; text-align:center;
    transition:background-color 160ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .seg.v button{text-align:left; padding:0 14px}
  .seg button:active{transform:scale(.98)}
  .seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(20,32,46,.12)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .go{
    width:100%; min-height:54px; border:0; border-radius:var(--r-sm); background:var(--navy); color:#fff;
    font-size:17px; font-weight:600; cursor:pointer; margin-top:4px;
    transition:transform 140ms var(--ease-out);
  }
  .go:active{transform:scale(.97)}

  /* ---------- option cards ---------- */
  .sect{display:flex; align-items:baseline; gap:12px; margin:4px 2px 10px}
  .sect h2{font-size:18px; font-weight:700; margin:0; flex:1; letter-spacing:-.01em}
  .key{font-size:13px; color:var(--ink3); display:flex; gap:12px}
  .key i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--r-md);
    padding:14px 15px; margin-bottom:10px; cursor:pointer;
    transition:border-color 180ms ease, box-shadow 180ms ease, transform 140ms var(--ease-out);
  }
  .card:active{transform:scale(.99)}
  .card[aria-pressed="true"]{border-color:var(--ink); box-shadow:0 6px 18px rgba(20,32,46,.10)}
  .cardTop{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .cardTop .route{margin-left:auto; font-size:14px; color:var(--ink3)}
  .dep{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:8px 0 2px}
  .dep small{font-size:15px; font-weight:500; color:var(--ink3); letter-spacing:0}
  /* the signature: one bar = the whole trip, so idling in the queue is something you can see */
  .strip{display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--sunk); margin:10px 0 6px}
  .strip span{display:block; height:100%}
  .strip .wait{background:repeating-linear-gradient(135deg,#d7dbd4 0 4px,transparent 4px 8px)}
  .strip .drive{background:var(--navy)}
  .strip .queue{background:var(--jam)}
  .stripLab{display:flex; justify-content:space-between; font-size:13px; color:var(--ink3)}
  .kv{display:grid; grid-template-columns:repeat(4,auto); justify-content:space-between; gap:4px 12px; margin-top:12px}
  .kv div{font-size:13px; color:var(--ink3)}
  .kv b{display:block; font-size:15.5px; font-weight:600; color:var(--ink)}
  @media (max-width:420px){ .kv{grid-template-columns:repeat(2,1fr)} }
  .why{color:var(--ink2); font-size:14.5px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
  .card.blocked{cursor:default; background:var(--sunk); border-style:dashed}
  .card.blocked h3{margin:0; font-size:15px; font-weight:600; color:var(--ink2)}
  .card.blocked .reason{color:#b4232a; font-size:14px; margin-top:4px}

  .share{
    width:100%; min-height:54px; border-radius:var(--r-sm); border:0; background:var(--lime); color:var(--lime-ink);
    font-size:17px; font-weight:600; cursor:pointer; margin:6px 0 18px;
    transition:transform 140ms var(--ease-out);
  }
  .share:active{transform:scale(.97)}
  .mapHint{font-size:13.5px; color:var(--ink3); margin:-8px 2px 18px}

  details.more{border-top:1px solid var(--line); padding:4px 2px}
  details.more summary{cursor:pointer; font-size:15.5px; font-weight:600; min-height:52px; display:flex; align-items:center}
  .rule{font-size:15px; color:var(--ink2); margin:0 0 12px}
  .rule .src{font-size:13px; color:var(--ink3)}
  .ledger{font-size:15px; color:var(--ink2); padding-bottom:12px}
  .ledger div{margin-bottom:6px}
  .ledger b{color:var(--ink)}
  .checkWrap{border-top:1px solid var(--line); padding-top:14px}
  .checkin{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px}
  .checkin button{
    min-height:52px; border-radius:var(--r-sm); border:1px solid var(--line); background:var(--card);
    color:var(--ink2); font-size:15.5px; font-weight:500; cursor:pointer;
    transition:transform 140ms var(--ease-out), background-color 160ms ease;
  }
  .checkin button:active{transform:scale(.97)}
  .checkin button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}

  #toast{
    position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); z-index:60;
    background:var(--ink); color:#fff; border-radius:999px; padding:12px 20px; font-size:15.5px; font-weight:500;
    opacity:0; transform:translate(-50%,8px); pointer-events:none;
    transition:opacity 200ms var(--ease-out), transform 200ms var(--ease-out);
  }
  #toast[data-show]{opacity:1; transform:translate(-50%,0)}

  /* ---------- first-use wizard ---------- */
  #wiz{position:fixed; inset:0; background:var(--card); z-index:50; overflow:auto; overscroll-behavior:contain;
    padding:calc(24px + env(safe-area-inset-top,0px)) 18px 40px}
  #wiz .step{max-width:520px; margin-inline:auto; transition:opacity 220ms var(--ease-out), transform 220ms var(--ease-out)}
  @starting-style{ #wiz .step{opacity:0; transform:translateY(8px)} }
  #wiz .wtop{display:flex; align-items:center; gap:10px; color:var(--ink3); font-size:14px; margin-bottom:26px}
  #wiz .wtop b{flex:1}
  #wiz .dots{display:flex; gap:5px}
  #wiz .dots i{width:22px; height:5px; border-radius:3px; background:var(--line)}
  #wiz .dots i.on{background:var(--navy)}
  #wiz h2{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px}
  #wiz .wq{color:var(--ink2); font-size:16px; margin:0 0 22px}
  #wiz input{margin-bottom:12px}
  #wiz .opt{
    display:block; width:100%; text-align:left; min-height:62px; margin-bottom:10px;
    background:var(--sunk); border:1.5px solid transparent; border-radius:var(--r-md); color:var(--ink);
    font-size:17px; font-weight:600; padding:14px 16px; cursor:pointer;
    transition:transform 140ms var(--ease-out), border-color 140ms ease;
  }
  #wiz .opt:active{transform:scale(.98); border-color:var(--navy)}
  #wiz .opt[disabled]{opacity:.5; cursor:default}
  #wiz .opt small{display:block; color:var(--ink3); font-size:14px; font-weight:400; margin-top:2px}
  #wiz .back{background:none; border:0; color:var(--navy); font-size:16px; font-weight:600; cursor:pointer; min-height:44px; padding:0}

  @media (hover:hover) and (pointer:fine){
    .pill:hover,.checkin button:hover{background:var(--sunk)}
    .card:not(.blocked):hover{border-color:#c9cec6}
    .card[aria-pressed="true"]:hover{border-color:var(--ink)}
    #wiz .opt:not([disabled]):hover{border-color:var(--line)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition-property:opacity,background-color,border-color,color !important}
    .pill:active,.tabs button:active,.go:active,.share:active,.card:active,.checkin button:active,#wiz .opt:active{transform:none}
  }
</style>
</head>
<body>

<div id="map" role="region" aria-label="Bản đồ / Map"></div>

<main class="sheet">
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"><i></i></span><h1>Đúng Giờ</h1></div>
    <button class="pill" id="profBtn" data-i18n="profile"></button>
    <button class="pill" id="langBtn" aria-pressed="false">EN</button>
  </header>
  <p class="sub" data-i18n="sub"></p>

  <div class="tabs" id="scn"></div>
  <div class="note" id="scnNote"></div>

  <section class="live" aria-live="polite">
    <div class="liveTop">
      <span class="liveDot" id="liveDot"></span>
      <b data-i18n="liveTitle"></b>
      <span class="chip sim">SIMULATED</span>
    </div>
    <div class="liveRow">
      <span class="liveNum" id="liveNum">—</span>
      <span class="hint" id="liveNowLab" style="margin:0"></span>
    </div>
    <svg id="jamChart" viewBox="0 0 520 180" role="img" aria-label="Gate wait by hour"></svg>
    <div class="hint" data-i18n="liveSub"></div>
  </section>

  <details class="trip" id="tripBox">
    <summary><span data-i18n="trip"></span><small id="tripSum"></small></summary>
    <div class="tripBody">
      <fieldset>
        <legend data-i18n="originLab"></legend>
        <div class="seg v" id="origin"></div>
      </fieldset>
      <div class="row">
        <div><label class="lab" for="demoTime" data-i18n="timeLab"></label><input id="demoTime" type="time" value="06:10"></div>
        <div><label class="lab" for="slot" data-i18n="slotLab"></label><input id="slot" type="time"><div class="hint" data-i18n="slotHint"></div></div>
      </div>
      <fieldset style="margin-top:14px">
        <legend data-i18n="truck"></legend>
        <div class="row">
          <div><label class="lab" for="fuel" data-i18n="fuelLab"></label><input id="fuel" type="number" inputmode="decimal" value="35" min="10" max="80" step="1"></div>
          <div><label class="lab" for="hours" data-i18n="hoursLab"></label><input id="hours" type="number" inputmode="decimal" min="0" max="11" step="0.5" placeholder="8"></div>
        </div>
        <div class="row" style="margin-top:12px">
          <div><span class="lab" data-i18n="payLab"></span><div class="seg" id="pay"></div><div class="hint" data-i18n="payHint"></div></div>
          <div><span class="lab" data-i18n="regLab"></span><div class="seg" id="reg24"></div></div>
        </div>
      </fieldset>
      <button class="go" id="go" data-i18n="go"></button>
    </div>
  </details>

  <div class="sect">
    <h2 data-i18n="optionsTitle"></h2>
    <span class="key"><span><i style="background:var(--navy)"></i><span data-i18n="keyDrive"></span></span><span><i style="background:var(--jam)"></i><span data-i18n="keyQueue"></span></span></span>
  </div>
  <div id="cards"></div>
  <button class="share" id="share" data-i18n="share"></button>
  <div class="mapHint"><span data-i18n="mapHint"></span> <span class="chip sim">SIMULATED</span></div>

  <details class="more">
    <summary data-i18n="rulesTitle"></summary>
    <div id="rules"></div>
  </details>
  <details class="more">
    <summary data-i18n="ledgerTitle"></summary>
    <div id="ledger" class="ledger"></div>
  </details>

  <section class="checkWrap">
    <h2 class="lab" style="font-size:15.5px;font-weight:600;color:var(--ink);margin-bottom:10px" data-i18n="checkin"></h2>
    <div class="checkin" id="checkin"></div>
    <div class="hint" data-i18n="checkinHint"></div>
  </section>
</main>

<div id="toast" role="status"></div>
<div id="wiz" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="scoring.js"></script>
<script>
const $ = s => document.querySelector(s);
let lang = 'vi', scenario = 'normal', geo = null, picked = null, map, mapReady = false, routeRoads = [];

const STR = {
  sub: { vi: 'Đi lúc nào và đường nào để không xếp hàng ở Cát Lái. Bản demo — số liệu mô phỏng được ghi rõ.',
         en: 'When to leave and which road, so you don’t join the Cát Lái queue. Demo — simulated values are labeled.' },
  trip: { vi: 'Chuyến đi', en: 'Trip' },
  originLab: { vi: 'Điểm xuất phát', en: 'Starting point' },
  timeLab: { vi: 'Giờ hiện tại (demo)', en: 'Current time (demo)' },
  slotLab: { vi: 'Giờ hẹn ePort', en: 'ePort slot' },
  slotHint: { vi: 'Bỏ trống nếu không có', en: 'Leave empty if none' },
  truck: { vi: 'Xe và tài xế', en: 'Truck & driver' },
  fuelLab: { vi: 'Dầu / 100 km (L)', en: 'Fuel / 100 km (L)' },
  hoursLab: { vi: 'Giờ lái còn lại', en: 'Driving hours left' },
  payLab: { vi: 'Trả lương', en: 'Pay type' },
  payHint: { vi: 'Không bắt buộc, không chia sẻ', en: 'Optional, never shared' },
  regLab: { vi: 'Làm hàng 24/24', en: '24/24 registration' },
  go: { vi: 'Xem giờ đi tốt nhất', en: 'Show my best departure' },
  share: { vi: 'Gửi kế hoạch qua Zalo', en: 'Send plan via Zalo' },
  rulesTitle: { vi: 'Sổ quy định (nguồn + ngày kiểm tra)', en: 'Rules Book (source + date verified)' },
  ledgerTitle: { vi: 'Sổ công bằng — khu nào đã chịu tải hôm nay', en: 'Fairness Ledger — who already paid today' },
  checkin: { vi: 'Chấm mốc chuyến đi (1 chạm)', en: 'Trip check-in (one tap)' },
  checkinHint: { vi: 'Giúp đo độ chính xác dự báo. Không lưu tên hay biển số.', en: 'Measures forecast accuracy. No name or plate stored.' },
  payTrip: { vi: 'Theo chuyến', en: 'Per trip' },
  payHour: { vi: 'Theo giờ', en: 'Hourly' },
  regNo: { vi: 'Chưa', en: 'No' },
  regYes: { vi: 'Có', en: 'Yes' },
  copied: { vi: 'Đã sao chép tin nhắn Zalo', en: 'Zalo message copied' },
  checked: { vi: 'Đã ghi mốc', en: 'Check-in saved' },
  queue: { vi: 'chờ cổng', en: 'gate wait' },
  costK: { vi: 'chi phí', en: 'cost' },
  fuelK: { vi: 'dầu', en: 'fuel' },
  blockedTitle: { vi: 'Không khả dụng', en: 'Not possible' },
  unpaid: { vi: 'phút không công', en: 'unpaid min' },
  liveTitle: { vi: 'Kẹt xe ở cổng Cát Lái — trực tiếp', en: 'Cát Lái gate congestion — live' },
  liveNow: { vi: 'phút chờ lúc này (dải lo–hi)', en: 'min wait now (lo–hi band)' },

/* segmented control: container keeps .value, buttons are 1-tap (no native select) */
function seg(id, options) {
  const el = $('#' + id); el.innerHTML = '';
  for (const o of options) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = o.label;
    b.setAttribute('aria-pressed', String(el.value === o.v));
    b.onclick = () => {
      el.value = o.v;
      [...el.children].forEach(c => c.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      run();
    };
    el.appendChild(b);
  }
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  $('#langBtn').textContent = lang === 'vi' ? 'EN' : 'VI';
  $('#liveNowLab').textContent = T('liveNow');
  seg('pay', [{ v: 'trip', label: T('payTrip') }, { v: 'hourly', label: T('payHour') }]);
  seg('reg24', [{ v: 'no', label: T('regNo') }, { v: 'yes', label: T('regYes') }]);
  seg('origin', ORIGINS.map(o => ({ v: o.id, label: o.name })));
  $('#scn').innerHTML = '';
  for (const [k, s] of Object.entries(SCENARIOS)) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = s[lang];
    b.setAttribute('aria-pressed', String(k === scenario));
    b.onclick = () => { scenario = k; applyLang(); run(); };
    $('#scn').appendChild(b);
  }
  $('#scnNote').innerHTML = scenario === 'disrupted'
    ? `${SCENARIOS.disrupted.report[lang]} <span class="chip sim">SIMULATED</span>`
    : `<span class="chip sim">SIMULATED</span> replay`;
  $('#rules').innerHTML = RULES.map(r =>
    `<div class="rule">${r[lang]}<div class="src">${r.src} · ${lang==='vi'?'kiểm tra':'verified'} ${r.verified} · ${r.confidence}</div></div>`).join('');
  $('#ledger').innerHTML = Object.entries(LEDGER).map(([a, v]) =>
    `<div>${a}: <b>${v}</b> ${lang==='vi'?'phút xe nổ máy chờ hôm nay':'idle truck-minutes today'} <span class="chip sim">SIMULATED</span></div>`).join('');
  $('#checkin').innerHTML = '';
  for (const [k, label] of CHECKINS) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label[lang]; b.setAttribute('aria-pressed', 'false');
    b.onclick = () => {
      b.setAttribute('aria-pressed', 'true');
      const log = JSON.parse(localStorage.getItem('dunggio-checkins') || '[]');
      log.push({ k, at: new Date().toISOString() });
      localStorage.setItem('dunggio-checkins', JSON.stringify(log));

$('#langBtn').onclick = () => { lang = lang === 'vi' ? 'en' : 'vi'; applyLang(); run(); };

function toast(msg) {
  $('#toast').textContent = msg; $('#toast').setAttribute('data-show', '');
  clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').removeAttribute('data-show'), 2200);
}

function hm(v) { const [h, m] = v.split(':').map(Number); return h * 60 + m; }
const vnd = n => n.toLocaleString(lang === 'vi' ? 'vi' : 'en') + ' đ';

/* Live gate-congestion chart. Every value comes from queueWaitAt (the same
 * deterministic engine the cards use) — the chart only draws it. */
function renderChart() {
  const scn = SCENARIOS[scenario];
  const nowMin = hm($('#demoTime').value || '06:10');
  const cur = [], base = scenario !== 'normal' ? [] : null;
  let mx = 20;
  for (let s = 0; s < 96; s++) {
    const w = queueWaitAt(s * 15, scn);
    cur.push(w); mx = Math.max(mx, w.hi);
    if (base) base.push(queueWaitAt(s * 15, SCENARIOS.normal).mid);
  }
  mx *= 1.12;
  const W = 520, H = 180, ml = 34, mr = 8, mt = 10, mb = 22, pw = W - ml - mr, ph = H - mt - mb;
  const X = i => ml + pw * i / 95, Y = v => mt + ph * (1 - v / mx);
  const color = scenario === 'normal' ? 'var(--chart)' : 'var(--chart2)';
  let s = '';
  for (let i = 1; i <= 3; i++) {  // hairline grid + ticks
    const v = Math.round(mx * i / 4 / 5) * 5;
    s += `<line x1="${ml}" y1="${Y(v)}" x2="${ml+pw}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
          <text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" class="ctk">${v}</text>`;
  }
  s += `<line x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1.5"/>`;
  for (let h = 0; h <= 24; h += 6) {
    const anchor = h === 0 ? 'start' : h === 24 ? 'end' : 'middle';
    s += `<text x="${X(Math.min(95, h * 4))}" y="${H-6}" text-anchor="${anchor}" class="cax">${String(h).padStart(2,'0')}:00</text>`;
  }
  const band = cur.map((w, i) => `${X(i).toFixed(1)},${Y(w.hi).toFixed(1)}`).join(' ') + ' ' +
               cur.map((w, i) => `${X(95-i).toFixed(1)},${Y(cur[95-i].lo).toFixed(1)}`).join(' ');
  s += `<polygon points="${band}" fill="${color}" opacity="0.16"/>`;
  if (base) {
    const bp = base.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    s += `<polyline points="${bp}" fill="none" stroke="var(--chart)" stroke-width="1.5" stroke-dasharray="4 4" opacity=".65"/>
          <text x="${ml+pw-4}" y="${Y(base[64])-6}" text-anchor="end" class="ctk">${T('liveBase')}</text>`;
  }
  const mid = cur.map((w, i) => `${X(i).toFixed(1)},${Y(w.mid).toFixed(1)}`).join(' ');
  s += `<polyline points="${mid}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  const now = queueWaitAt(nowMin, scn);
  const nx = X(Math.min(95, nowMin / 15));
  s += `<line x1="${nx}" y1="${mt}" x2="${nx}" y2="${Y(0)}" stroke="var(--ink3)" stroke-width="1" stroke-dasharray="2 3"/>
        <circle cx="${nx}" cy="${Y(now.mid)}" r="5" fill="${color}" stroke="var(--bg)" stroke-width="2.5"/>`;
  $('#jamChart').innerHTML = s;
  const u = lang === 'vi' ? 'ph' : 'min';
  $('#liveNum').textContent = now.lo === now.hi ? `${now.mid} ${u}` : `${now.lo}–${now.hi} ${u}`;
  $('#liveDot').classList.toggle('bad', now.mid >= 20);
  paintRoads();
}
setInterval(renderChart, 3000);

/* schools/hospitals within ~150 m of each road polyline (precomputed once) */
function poiCounts() {
  const out = {};
  if (!geo) return out;
  const pois = [...(geo.schools || []), ...(geo.hospitals || [])];
  for (const [name, line] of Object.entries(geo.roads || {})) {
    let n = 0;
    for (const p of pois) {
      for (let i = 0; i < line.length; i += 2) {
        const dLat = (p.lat - line[i][1]) * 111320, dLon = (p.lon - line[i][0]) * 109200;
        if (dLat * dLat + dLon * dLon < 150 * 150) { n++; break; }
      }
    }
    out[name] = n;
  }
  return out;
}
let POI = {};

function run() {
  if (!$('#cards')) return;
  const ctx = {
    nowMin: hm($('#demoTime').value || '06:10'), scenario,
    fuelPer100: +$('#fuel').value || 35, payType: $('#pay').value,
    hourlyRate: RATES.driverVndPerH.v, dieselPrice: RATES.dieselVndPerL.v,
    hoursLeft: $('#hours').value ? +$('#hours').value : null,
    slotMin: $('#slot').value ? hm($('#slot').value) : null,
    registered24: $('#reg24').value === 'yes', poiCount: POI,
  };
  const routes = ROUTES[$('#origin').value];
  const opts = [];
  for (const r of routes) for (const d of [0, 15, 30, 60, 90]) opts.push(evalOption(r, d, ctx));
  const burden = LEDGER['Nguyễn Thị Định (Cát Lái)'] || 0;
  const ledgerMult = 1 + Math.min(1, burden / 600);   // fairness: loaded areas cost more
  const { cards, blocked } = pickCards(opts, WEIGHTS, ledgerMult);
  const baseline = opts.find(o => !o.blocked.length) || opts[0];

  const seen = new Map();
  let html = '';
  for (const [kind, o] of cards) {
    const key = o.route.id + '@' + o.depDelayMin;
    if (seen.has(key)) { seen.get(key).kinds.push(kind); continue; }
    seen.set(key, { o, kinds: [kind] });
  }
  const u = lang === 'vi' ? 'ph' : 'min';
  const opts2 = [...seen.values()];
  for (const [i, { o, kinds }] of opts2.entries()) {
    const tags = kinds.map(k => `<span class="tag${k === 'best' ? ' best' : ''}">${CARD_NAMES[k][lang]}</span>`).join('');
    const why = clauses(o, baseline, lang);
    // trip strip: waiting at origin (hatched) | driving | idling in the gate queue, to scale
    const total = Math.max(1, o.depDelayMin + o.driveMin + o.queue.mid);
    const pct = v => (v / total * 100).toFixed(1) + '%';
    html += `<div class="card" role="button" tabindex="0" aria-pressed="${kinds.includes('best')}" data-i="${i}">
      <div class="cardTop">${tags}<span class="route">${o.route[lang]}</span></div>
      <div class="dep">${o.departTime} <small>→ ${T('gate').toLowerCase()} ${o.gateTime}</small></div>
      <div class="strip" aria-hidden="true">
        ${o.depDelayMin ? `<span class="wait" style="width:${pct(o.depDelayMin)}"></span>` : ''}
        <span class="drive" style="width:${pct(o.driveMin)}"></span>
        ${o.queue.mid ? `<span class="queue" style="width:${pct(o.queue.mid)}"></span>` : ''}
      </div>
      <div class="stripLab"><span>${T('depart')} ${o.departTime}</span><span>${o.driveMin} ${u} ${T('keyDrive')} + ${o.queue.lo === o.queue.hi ? o.queue.mid : `${o.queue.lo}–${o.queue.hi}`} ${u} ${T('keyQueue')}</span></div>
      <div class="kv">
        <div>${T('costK')}<b>${vnd(o.costVnd)}</b></div>
        <div>${T('fuelK')}<b>${o.fuelL} L</b></div>
        <div>CO₂<b>${o.co2Kg} kg</b></div>
        <div>${o.unpaidMin ? T('unpaid') : 'km'}<b>${o.unpaidMin || o.km}</b></div>
      </div>
      ${why ? `<div class="why">${why} <span class="chip sim">SIMULATED</span></div>` : ''}
    </div>`;
  }
  const seenBlocked = new Set();
  for (const o of blocked) {
    if (seenBlocked.has(o.route.id)) continue;
    seenBlocked.add(o.route.id);
    html += `<div class="card blocked"><h3>${T('blockedTitle')} — ${o.route[lang]}</h3>
      <div class="reason">${[...new Set(o.blocked)].map(b => BLOCK_REASONS[b][lang]).join(' · ')}</div></div>`;
  }
  $('#cards').innerHTML = html;
  picked = opts2.find(x => x.kinds.includes('best'))?.o || null;
  // Tapping a card makes it the plan: highlights its route and is what Zalo sends.
  document.querySelectorAll('.card[data-i]').forEach(el => {
    const choose = () => {
      picked = opts2[+el.dataset.i].o;
      document.querySelectorAll('.card[data-i]').forEach(c => c.setAttribute('aria-pressed', String(c === el)));
      drawRoute(picked.route.id);
    };
    el.onclick = choose;
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); } };
  });
  const org = ORIGINS.find(x => x.id === $('#origin').value);
  $('#tripSum').textContent = `${org ? org.name.replace(/\s*\(.*\)/, '') : ''}, ${$('#demoTime').value}`;
  if (picked) drawRoute(picked.route.id);
  renderChart();
}

/* Traffic color per road — from the same deterministic engine as the cards:
 * the queue road uses queueWaitAt now, scenario-slowed corridors are jammed. */
function roadColor(name) {
  const scn = SCENARIOS[scenario];
  if ((scn.slowRoads || []).includes(name)) return '#dc2626';
  const w = queueWaitAt(hm($('#demoTime').value || '06:10'), scn).mid;
  if (name === 'Nguyễn Thị Định') return w >= 20 ? '#dc2626' : w >= 10 ? '#d97706' : '#15803d';
  if (name === 'Đồng Văn Cống') return w >= 40 ? '#d97706' : '#15803d'; // queue spillback approach
  return '#15803d';
}

function paintRoads() {
  if (!mapReady || !geo) return;
  const m = ['match', ['get', 'name']];
  for (const name of Object.keys(geo.roads)) m.push(name, roadColor(name));
  m.push('#15803d');
  map.setPaintProperty('roads', 'line-color', m);
  map.setFilter('route-case', ['in', ['get', 'name'], ['literal', routeRoads]]);
}

function drawRoute(routeId) {
  const route = ROUTES[$('#origin').value].find(r => r.id === routeId) || picked?.route;
  routeRoads = route ? route.roads : [];
  paintRoads();
}

async function boot() {
  let prof = null;
  try { prof = JSON.parse(localStorage.getItem('dunggio-profile') || 'null'); } catch {}
  $('#origin').value = prof?.origin || ORIGINS[0].id;
  $('#pay').value = prof?.pay || 'trip';
  $('#reg24').value = prof?.reg24 || 'no';
  applyLang();
  if (!prof) openWizard();
  try { geo = await (await fetch('geo.json')).json(); } catch { geo = null; }
  if (geo) POI = poiCounts();
  /* Muted grey basemap (OpenFreeMap positron, keyless) so the traffic colors carry
   * the meaning. Slight pitch; drag with two fingers / right-click to tilt more. */
  const wide = matchMedia('(min-width:960px)').matches;
  map = new maplibregl.Map({
    container: 'map', style: 'https://tiles.openfreemap.org/styles/positron',
    center: [106.760, 10.752], zoom: wide ? 12.6 : 12.2, pitch: 30, bearing: -20,
    // keep the corridor clear of the floating panels on desktop
    padding: wide ? { left: 470, bottom: 40, right: 460, top: 20 } : undefined,
    // phone: one finger scrolls the page, two fingers move the map
    cooperativeGestures: !wide, attributionControl: { compact: true },
  });
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
  map.on('load', () => {
    if (geo) {
      map.addSource('roads', { type: 'geojson', data: {
        type: 'FeatureCollection',
        features: Object.entries(geo.roads).map(([name, line]) => ({
          type: 'Feature', properties: { name },
          geometry: { type: 'LineString', coordinates: line },
        })),
      }});
      map.addLayer({ id: 'route-case', type: 'line', source: 'roads',
        filter: ['in', ['get', 'name'], ['literal', []]],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#1d3557', 'line-width': 14, 'line-opacity': .28 } });
      map.addLayer({ id: 'roads', type: 'line', source: 'roads',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-width': 6, 'line-opacity': .95 } });
    }
    new maplibregl.Marker({ color: '#1d3557' }).setLngLat([GATE.lon, GATE.lat])
      .setPopup(new maplibregl.Popup({ closeButton: false }).setText(GATE.name)).addTo(map);
    mapReady = true;
    drawRoute(picked?.route?.id);
  });
  run();
}

/* First-use wizard: one question per screen, one tap advances. */
let wizStep = 0, wizSel = {};
const WT = k => WSTR[k][lang];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function wizOpt(label, sub, onTap, disabled) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'opt';
  b.innerHTML = label + (sub ? `<small>${sub}</small>` : '');
  if (disabled) b.disabled = true; else b.onclick = onTap;
  return b;
}

function renderWiz() {
  const w = $('#wiz'); w.hidden = false; w.innerHTML = '';
  const step = document.createElement('div'); step.className = 'step'; w.appendChild(step);
  const qs = ['q1', 'q2', 'q3', 'q4'];
  step.innerHTML = `<div class="wtop">
      ${wizStep ? `<button class="back" id="wback">‹ ${WT('back')}</button>` : '<span></span>'}
      <b></b><span class="dots" aria-label="${WT('step')} ${wizStep + 1}/4">${[0,1,2,3].map(i => `<i class="${i <= wizStep ? 'on' : ''}"></i>`).join('')}</span>
      <button class="pill" id="wlang">${lang === 'vi' ? 'EN' : 'VI'}</button>
    </div>
    <h2>${WT(qs[wizStep])}</h2><p class="wq">${WT(qs[wizStep] + 's')}</p><div id="wopts"></div>`;
  $('#wlang').onclick = () => { lang = lang === 'vi' ? 'en' : 'vi'; applyLang(); renderWiz(); };
  if ($('#wback')) $('#wback').onclick = () => { wizStep--; renderWiz(); };
  const next = v => { Object.assign(wizSel, v); wizStep++; wizStep > 3 ? finishWiz() : renderWiz(); };
  const opts = $('#wopts');
  if (wizStep === 0) {
    for (const o of ORIGINS) opts.appendChild(wizOpt(o.name, '', () => next({ origin: o.id })));
  } else if (wizStep === 1) {
    const inp = document.createElement('input');
    inp.placeholder = WT('search'); inp.style.marginBottom = '12px';
    const list = document.createElement('div');
    const draw = () => {
      list.innerHTML = '';
      for (const d of DESTS.filter(d => norm(d[lang]).includes(norm(inp.value || ''))))
        list.appendChild(wizOpt(d[lang], d.ok ? '' : WT('soon'), () => next({ dest: d.id }), !d.ok));
    };
    inp.oninput = draw; draw();
    opts.append(inp, list);
  } else if (wizStep === 2) {
    opts.appendChild(wizOpt(T('payTrip'), '', () => next({ pay: 'trip' })));
    opts.appendChild(wizOpt(T('payHour'), '', () => next({ pay: 'hourly' })));
  } else {
    opts.appendChild(wizOpt(T('regYes'), '', () => next({ reg24: 'yes' })));
    opts.appendChild(wizOpt(T('regNo'), '', () => next({ reg24: 'no' })));
  }
}

function openWizard() { wizStep = 0; wizSel = {}; renderWiz(); }

function finishWiz() {
  localStorage.setItem('dunggio-profile', JSON.stringify(wizSel));
  $('#origin').value = wizSel.origin; $('#pay').value = wizSel.pay; $('#reg24').value = wizSel.reg24;
  applyLang();
  $('#wiz').hidden = true;
  run();
}

$('#profBtn').onclick = openWizard;
$('#go').onclick = run;
['demoTime', 'slot', 'fuel', 'hours'].forEach(id => $('#' + id).onchange = run);

$('#share').onclick = async () => {
  if (!picked) return;
  const o = picked;
  const msg = lang === 'vi'
    ? `[Đúng Giờ] Đề xuất: đi lúc ${o.departTime}, ${o.route.vi}, dự kiến vào cổng ${o.gateTime} (chờ ${o.queue.lo}–${o.queue.hi} phút). Chi phí ~${o.costVnd.toLocaleString('vi')} đ, CO₂ ${o.co2Kg} kg. (Demo — số liệu mô phỏng)`
    : `[Đúng Giờ] Suggestion: depart ${o.departTime}, ${o.route.en}, gate at ${o.gateTime} (wait ${o.queue.lo}–${o.queue.hi} min). Cost ~${o.costVnd.toLocaleString('en')} VND, CO₂ ${o.co2Kg} kg. (Demo — simulated)`;
  if (navigator.share) { try { await navigator.share({ text: msg }); return; } catch {} }
  await navigator.clipboard.writeText(msg);
  toast(T('copied'));
};

boot();
</script>
</body>
</html>
