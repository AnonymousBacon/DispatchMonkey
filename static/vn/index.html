<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DispatchMonkey — Cảng Cát Lái</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{
    /* Black and white is the default palette. Colour is reserved for judgement:
       green = best / recommended, yellow = middle / caution, red = worst / blocked.
       Everything coloured also carries a text label, so colour is never the only cue. */
    --bg:#ffffff; --panel:#ffffff; --panel2:#f4f4f5; --line:#e4e4e7; --line2:#d4d4d8;
    --ink:#0b0b0c; --ink2:#55595f; --ink3:#71757c;
    /* "accent" is the selected state, and it is black: a selected nav button is
       black with a white icon and label. Not a hue, so hues stay free for ranking. */
    --accent:#0b0b0c; --accent-ink:#ffffff;
    /* text-safe on white and on --panel2 (>= 4.5:1) */
    --go:#15803d; --warn:#8a5a04; --stop:#b91c1c;
    /* fills: bars, map lines, rank pills. Never used for small text. */
    --gof:#16a34a; --warnf:#eab308; --stopf:#dc2626;
    --loc:#1a73e8;                /* location idiom only, never a judgement */
    --rail:88px; --pw:396px; --topH:58px;
    --ease:cubic-bezier(.22,1,.36,1);
    --shadow:0 1px 2px rgba(11,11,12,.06), 0 14px 36px rgba(11,11,12,.13);
  }
  *{box-sizing:border-box}
  /* id selectors below set display, which outranks the plain [hidden] rule and
     would leave a full-screen overlay pinned over the map forever */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
    /* driver UX: 18px floor, 56px targets — arm's-length mount, gloves, glare */
    font:18px/1.42 'Fira Sans',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  button{font:inherit; cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  /* The map is mounted once, full-bleed under the chrome, and never torn down:
     switching sections must not reset its bearing, pitch or zoom. */
  #map{position:fixed; top:var(--topH); left:0; right:0; bottom:0; background:var(--panel2)}
  /* "You are here": GPS fix when we have one, otherwise the yard the job starts
     from. The ring grows when accuracy is too coarse to pick a carriageway. */
  .me{width:18px; height:18px; border-radius:50%; background:var(--loc);
    border:3px solid #fff; box-shadow:0 0 0 1px rgba(11,11,12,.3)}
  .me.coarse{width:26px; height:26px; opacity:.72; border-style:dashed}
  .maplibregl-ctrl-bottom-right{bottom:10px}
  .maplibregl-ctrl-bottom-left{display:none}

  /* ---- slim top bar ---- */
  #top{
    position:fixed; top:0; left:0; right:0; height:var(--topH); z-index:30;
    display:flex; align-items:center; gap:12px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--line);
  }
  .brand{font-weight:800; letter-spacing:-.02em; font-size:18px; white-space:nowrap}
  .brand small{display:block; font-size:11.5px; font-weight:500; color:var(--ink3); letter-spacing:0}
  #drawerBtn{
    display:none; width:44px; height:44px; flex:none; border-radius:11px;
    border:1px solid var(--line2); background:var(--panel); color:var(--ink);
  }
  #now{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; font-size:14px; color:var(--ink2); white-space:nowrap;
  }
  #now b{font-weight:700; font-size:16px; color:var(--ink)}

  /* ---- left rail: four equal items, selected is black on white ---- */
  #rail{
    position:fixed; top:var(--topH); bottom:0; left:0; width:var(--rail); z-index:25;
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:10px 8px; gap:6px;
  }
  #rail button{
    flex:1 1 0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; max-height:92px; min-height:64px; border:0; border-radius:14px;
    background:none; color:var(--ink2); font-size:13px; font-weight:600;
    line-height:1.2; text-align:center; padding:6px 2px;
    transition:background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
  }
  /* the English half of each label: secondary, but still a nav label someone has
     to read in a cab, so it stays above the 11px legibility floor rather than
     shrinking to fit the rail */
  #rail button i{display:block; font-size:11.5px; font-weight:500; opacity:.85}
  #rail button:active{transform:scale(.94)}
  #rail button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
  @media (hover:hover){#rail button:not([aria-pressed="true"]):hover{background:var(--panel2); color:var(--ink)}}

  /* ---- white content panel, immediately beside the rail ---- */
  #panel{
    position:fixed; top:var(--topH); bottom:0; left:var(--rail); width:var(--pw); z-index:24;
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; box-shadow:var(--shadow);
  }
  #scrim{position:fixed; inset:var(--topH) 0 0; z-index:23; background:rgba(11,11,12,.34); display:none}
  .pane{flex:1; overflow-y:auto; overscroll-behavior:contain;
    padding:16px 16px 40px; -webkit-overflow-scrolling:touch}
  .pane[hidden]{display:none}

  /* ---- where from / where to (now inside the panel) ---- */
  #where{
    border:1px solid var(--line2); border-radius:14px; overflow:hidden; margin-bottom:14px;
  }
  #where button{
    display:flex; align-items:center; gap:12px; width:100%; min-height:58px;
    background:var(--panel); border:0; color:var(--ink); text-align:left; padding:0 14px;
  }
  #where button + button{border-top:1px solid var(--line)}
  @media (hover:hover){#where button:hover{background:var(--panel2)}}
  #where .dot{width:11px; height:11px; border-radius:50%; border:2.5px solid var(--ink); flex:none}
  #where .dot.to{border-radius:3px; border-color:var(--ink); background:var(--ink)}
  #where .txt{flex:1; font-size:16.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #where .txt.empty{color:var(--ink3); font-weight:400}
  #where .ico{flex:none; color:var(--ink3)}

  /* ---- map buttons, clear of the panel ---- */
  #mapbtns{position:fixed; right:14px; top:calc(var(--topH) + 14px); display:grid; gap:9px; z-index:20}
  #mapbtns button{
    width:52px; height:52px; border-radius:13px; background:var(--panel); color:var(--ink);
    border:1px solid var(--line2); box-shadow:var(--shadow);
    display:grid; place-items:center; font-size:14px; font-weight:700;
    transition:transform .12s var(--ease);
  }
  #mapbtns button:active{transform:scale(.92)}
  #mapbtns button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  /* ---- the answer ---- */
  .kicker{font-size:13px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase; color:var(--ink3)}
  .ansRow{display:flex; align-items:center; gap:12px; margin:2px 0 2px}
  .ansTime{font-size:46px; font-weight:800; letter-spacing:-.025em; line-height:1.05; font-variant-numeric:tabular-nums}
  .wait{
    margin-left:auto; text-align:right; font-size:15px; color:var(--ink2); line-height:1.25;
  }
  .wait b{display:block; font-size:21px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  .ansSub{color:var(--ink2); font-size:16px; margin-bottom:10px}
  .ansSub b{color:var(--ink); font-weight:600}
  .saved{color:var(--go); font-weight:600}
  .primary{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:58px; border:0; border-radius:14px;
    background:var(--accent); color:var(--accent-ink); font-size:19px; font-weight:800;
  }
  .primary[disabled]{background:var(--panel2); color:var(--ink3)}
  .ghost{
    width:100%; min-height:52px; border-radius:13px; border:1px solid var(--line);
    background:transparent; color:var(--ink2); font-size:16px; font-weight:600; margin-top:9px;
  }
  .chip{
    display:inline-block; font-size:12px; font-weight:600; border:1px solid var(--line2);
    border-radius:4px; padding:1px 6px; color:var(--ink3); vertical-align:2px; white-space:nowrap;
  }
  .chip.sim{color:var(--ink2); background:var(--panel2)}
  .why{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .why li{font-size:16px; color:var(--ink2); margin-bottom:7px}
  .why ul{margin:0; padding-left:20px}
  .alt{
    display:flex; align-items:center; gap:12px; width:100%; min-height:62px; text-align:left;
    background:var(--panel2); border:1px solid var(--line); border-radius:13px;
    color:var(--ink); padding:9px 14px; margin-top:9px;
  }
  .alt .at{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums}
  .alt .an{flex:1; font-size:15px; color:var(--ink2)}
  .alt .aw{font-size:15px; color:var(--ink2); text-align:right}
  .blocked{color:var(--stop); font-size:15px; margin-top:10px}
  h2.pt{font-size:21px; font-weight:800; margin:6px 0 2px; letter-spacing:-.01em}
  p.ps{color:var(--ink2); font-size:15.5px; margin:0 0 14px}

  /* ---- slot bars ---- */
  #slots{display:grid; gap:7px}
  .slot{display:flex; align-items:center; gap:10px; min-height:40px}
  button.slot{width:100%; background:none; border:0; color:inherit; text-align:left;
    padding:3px 6px; border-radius:9px; font:inherit; cursor:pointer}
  button.slot[aria-pressed="true"]{background:var(--panel2); outline:2px solid var(--ink); outline-offset:1px}
  .slot .t{width:52px; flex:none; font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums}
  .slot .bar{flex:1; height:22px; background:var(--panel2); border-radius:6px; overflow:hidden; display:flex}
  .slot .fill{height:100%}
  .slot .claim{height:100%; background:var(--accent)}
  .slot .w{width:66px; flex:none; text-align:right; font-size:15px; color:var(--ink2); font-variant-numeric:tabular-nums}
  .slot.mine .t,.slot.mine .w{color:var(--ink); font-weight:700}
  .slot.mine .bar{outline:2px solid var(--accent); outline-offset:1px}
  .legend{display:flex; gap:14px; flex-wrap:wrap; color:var(--ink2); font-size:14.5px; margin:12px 0 2px}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px}

  /* ---- settings ---- */
  .srow{padding:14px 0; border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .lab{display:block; font-size:14.5px; font-weight:600; color:var(--ink2); margin-bottom:8px}
  .seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px;
    background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:4px}
  .seg.v{grid-auto-flow:row}
  .seg button{min-height:50px; border:0; border-radius:9px; background:transparent; color:var(--ink2); font-size:16px}
  .seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
  input[type=time],input[type=number],#q{
    width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font:inherit; min-height:56px;
  }
  .two{display:grid; grid-template-columns:1fr 1fr; gap:11px}
  .note{font-size:14.5px; color:var(--ink3); margin-top:7px}
  /* fleet card (shared state with the dispatcher website) */
  #fleet{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin:2px 0 12px}
  #fleet.alert{border-color:var(--warn)} #fleet.new{border-color:var(--go)} #fleet.late{border-color:var(--stop)}
  #fleet .fk{font-size:12.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--ink3); display:flex; gap:8px; align-items:center}
  #fleet .fk .sync{margin-left:auto; font-weight:600; letter-spacing:0; text-transform:none}
  #fleet .fk .sync.on{color:var(--go)}
  #fleet .fm{font-size:18px; margin-top:4px}
  #fleet .fm b{font-size:24px; font-variant-numeric:tabular-nums}
  #fleet .fs{font-size:14px; color:var(--ink2); margin-top:4px}
  /* Truth tiers are a classification, not a judgement, so they stay monochrome:
     ranking owns green/yellow/red and nothing else competes for it. */
  .tier{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.4px;
    border-radius:5px; padding:1px 5px; vertical-align:middle; border:1px solid var(--ink)}
  .tier.real{background:var(--ink); color:#fff}
  .tier.der{background:var(--panel2); color:var(--ink)}
  .tier.est{background:var(--panel2); color:var(--ink2); border-color:var(--line2)}
  .tier.sim{background:repeating-linear-gradient(135deg,#e9e9ec 0 4px,#fff 4px 8px);
    color:var(--ink2); border-color:var(--line2)}
  /* ---- route weather ---- */
  #wxBox{margin-top:14px}
  .wxHead{display:flex; align-items:center; gap:10px; width:100%; min-height:58px; text-align:left;
    background:var(--panel2); border:1px solid var(--line); border-radius:13px; color:var(--ink); padding:9px 14px}
  .wxHead.caution{border-color:var(--warnf)}
  .wxHead.warn{border-color:var(--warn)}
  .wxHead.bad{border-color:var(--stop)}
  .wxBig{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
  .wxRh{font-size:15px; color:var(--ink2)}
  .wxWorst{flex:1; text-align:right; font-size:13.5px; color:var(--ink2); line-height:1.3}
  .wxChev{color:var(--ink3)}
  .wxRow{display:flex; align-items:center; gap:10px; min-height:40px; font-size:15px;
    border-bottom:1px solid var(--line); color:var(--ink2)}
  .wxRow:last-of-type{border-bottom:0}
  .wxRow .wxT{width:52px; flex:none; font-variant-numeric:tabular-nums}
  .wxRow .wxN{flex:1}
  .wxRow .wxV{font-variant-numeric:tabular-nums}
  .wxRow .wxF{width:72px; flex:none; text-align:right; font-variant-numeric:tabular-nums}
  .wxRow.caution .wxF{color:var(--warn)}
  .wxRow.warn .wxF{color:var(--warn)}
  .wxRow.bad .wxF{color:var(--stop); font-weight:700}

  /* ---- driver updates feed ---- */
  #feedBox{margin-top:16px; border-top:1px solid var(--line); padding-top:12px}
  .feedHead{display:flex; align-items:center; gap:9px; margin-bottom:9px}
  .feedHead .kicker{flex:1}
  .post{border:1px solid var(--line); border-radius:13px; padding:11px 13px; margin-bottom:9px; background:var(--panel2)}
  .post.reply{margin-left:22px; background:transparent}
  .pMeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px; color:var(--ink3); margin-bottom:5px}
  .pMeta .who{font-weight:700; color:var(--ink2)}
  .pText{font-size:16px; line-height:1.4}
  .pText.q{font-style:italic}
  .pShot{width:100%; border-radius:10px; margin-top:8px; display:block}
  .pClip{width:100%; margin-top:8px; display:block}
  .pActs{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap}
  .pActs button{
    flex:1; min-width:112px; min-height:44px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--ink2); font-size:14.5px; font-weight:600;
  }
  .pActs button.yes{border-color:var(--ink); color:var(--ink); font-weight:700}
  .pActs button[disabled]{opacity:.55}
  .st{font-size:12px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    border-radius:4px; padding:2px 7px; border:1px solid currentColor}
  .st.unverified{color:var(--ink3)}
  .st.corroborated{color:var(--warn)}
  .st.confirmed{color:var(--stop)}
  .st.expired{color:var(--ink3); opacity:.6}
  .st.question{color:var(--accent)}
  /* corroboration progress: black, not green. A fully confirmed crash is not "good". */
  .bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:8px}
  .bar i{display:block; height:100%; background:var(--ink)}

  /* ---- gate-slot actions ---- */
  #gateActs{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:16px}
  #gateActs button{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    min-height:76px; border-radius:13px; border:1px solid var(--line); background:var(--panel2);
    color:var(--ink); font-size:14px; font-weight:600; text-align:center; padding:8px 4px;
  }

  /* ---- composer ---- */
  #compose{position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column}
  #compose .cTop{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line)}
  #compose .cTop button{width:46px; height:46px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:26px; line-height:1}
  #cTitle{font-size:19px; font-weight:800}
  #compose .cBody{flex:1; overflow-y:auto; padding:14px 16px 28px}
  #compose .lab{margin-top:16px}
  #cVideo,#cShot{width:100%; border-radius:13px; background:#000; display:block; margin-bottom:10px}
  #cCamBtns{display:grid; gap:9px}
  #cAudio{width:100%; margin-top:10px}
  #cText{width:100%; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px; font:inherit; resize:vertical; min-height:92px}
  #cSend{margin-top:18px}

  #report{width:100%; min-height:52px; margin-top:10px; border-radius:12px; border:1px solid var(--stop); background:transparent;
    color:var(--ink); font:inherit; font-weight:700; font-size:16px; cursor:pointer}
  #report[disabled]{opacity:.75; cursor:default}
  .costs{width:100%; border-collapse:collapse; font-size:14.5px; margin-top:6px}
  .costs td{padding:4px 0; border-bottom:1px solid var(--line); color:var(--ink2)}
  .costs td:last-child{text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
  .costs tr.unbilled td{color:var(--warn)}
  .slot.full .bar{opacity:.45} .slot.full .w{color:var(--stop); font-weight:700}
  details{margin-top:12px}
  summary{min-height:48px; display:flex; align-items:center; font-size:16px; color:var(--ink2)}
  .rule{font-size:15px; color:var(--ink2); margin:8px 0}
  .rule .src{font-size:13px; color:var(--ink3)}

  /* ---- ranked option cards (green best / yellow middle / red worst-or-blocked) ----
     A card always says its rank in words next to the colour, and a route that is
     merely ranked last looks different from one a rule or a confirmed closure rules
     out: "worst" keeps a solid border and stays selectable, "blocked" is struck
     through with a dashed border and cannot be chosen. */
  #opts{display:grid; gap:10px; margin-top:4px}
  .card{
    display:block; width:100%; text-align:left; color:inherit; padding:0; overflow:hidden;
    background:var(--panel); border:1.5px solid var(--line2); border-left-width:5px; border-radius:14px;
    transition:border-color .18s var(--ease), box-shadow .18s var(--ease), transform .12s var(--ease);
  }
  .card:active{transform:scale(.99)}
  .card[aria-pressed="true"]{border-color:var(--ink); box-shadow:var(--shadow)}
  .card.ok{border-left-color:var(--gof)}
  .card.warn{border-left-color:var(--warnf)}
  .card.bad{border-left-color:var(--stopf)}
  /* dashed on the ruled-out EDGE only: dashing all four sides made the card read
     as a loading placeholder rather than a decision */
  .card.blocked{border-left-color:var(--stopf); border-left-style:dashed; background:var(--panel2)}
  .card.blocked .cName{text-decoration:line-through; text-decoration-thickness:1px}
  /* spans, because the selectable card is a <button> and a <div> inside one is
     invalid. They still have to lay out as blocks or the text escapes the border. */
  .cHead{display:flex; align-items:flex-start; gap:10px; padding:11px 13px 12px}
  .cMetrics,.cWhy{display:block}
  .cName{flex:1; font-size:15.5px; font-weight:700; line-height:1.3}
  .cName small{display:block; font-size:12.5px; font-weight:500; color:var(--ink3); margin-top:2px}
  .cDepart{text-align:right; flex:none}
  .cDepart b{display:block; font-size:23px; font-weight:800; letter-spacing:-.03em; line-height:1;
    font-variant-numeric:tabular-nums}
  .cDepart span{font-size:11px; font-weight:600; color:var(--ink3); letter-spacing:.04em; text-transform:uppercase}
  /* the text label that carries the same meaning as the colour */
  .rank{display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.07em;
    text-transform:uppercase; padding:3px 8px; border-radius:999px; color:#fff; margin-bottom:5px}
  .rank.ok{background:var(--go)} .rank.warn{background:var(--warn)} .rank.bad{background:var(--stop)}
  .rank.blocked{background:var(--panel); color:var(--stop); border:1.5px dashed var(--stop)}
  .cMetrics{display:grid !important; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line)}
  .cMetrics .m{padding:9px 8px 10px; border-right:1px solid var(--line); text-align:center}
  .cMetrics .m:last-child{border-right:0}
  .cMetrics .mk{display:block; font-size:11px; font-weight:600; color:var(--ink3); margin-bottom:2px}
  .cMetrics .mv{display:block; font-size:16.5px; font-weight:700; font-variant-numeric:tabular-nums}
  .cWhy{border-top:1px solid var(--line); padding:9px 13px 11px; font-size:13.5px;
    color:var(--ink2); line-height:1.5; background:var(--panel2)}

  /* ---- Port view / precipitation controls ---- */
  #layerBox{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .lrow{display:flex; align-items:center; gap:10px; min-height:52px}
  .lrow .ln{flex:1; font-size:15px; font-weight:600}
  .lrow .ln small{display:block; font-size:12.5px; font-weight:400; color:var(--ink3)}
  .tgl{flex:none; min-width:76px; min-height:44px; border-radius:11px; border:1px solid var(--line2);
    background:var(--panel); color:var(--ink2); font-size:14px; font-weight:700}
  .tgl[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  #opacityRow input[type=range]{flex:1; accent-color:var(--ink)}
  .gLeg{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink2); margin-top:6px; flex-wrap:wrap}
  .gLeg .ramp{height:11px; width:112px; border-radius:3px; border:1px solid var(--line2);
    background:linear-gradient(90deg,#c8e6ff,#4da3ff,#1f4fd8,#7b2fd8)}

  /* ---- vessel bubbles over the radar scene ---- */
  .ship{border:2.5px solid var(--stopf); border-radius:50%; background:rgba(220,38,38,.14);
    box-shadow:0 0 0 1px rgba(255,255,255,.75)}

  /* ---- search overlay ---- */
  #search{position:fixed; inset:0; background:var(--bg); z-index:20; padding:14px 14px 0; display:flex; flex-direction:column}
  #search[hidden]{display:none}
  .sTop{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  #sBack{min-width:52px; min-height:52px; border-radius:13px; border:1px solid var(--line);
    background:var(--panel2); color:var(--ink); font-size:22px}
  #sTitle{font-size:20px; font-weight:800}
  #sList{overflow-y:auto; padding-bottom:20px}
  .res{
    display:flex; align-items:center; gap:13px; width:100%; min-height:66px; text-align:left;
    background:none; border:0; border-bottom:1px solid var(--line); color:var(--ink);
    font-size:17.5px; font-weight:600; padding:10px 2px;
  }
  .res small{display:block; color:var(--ink3); font-size:14px; font-weight:400; margin-top:2px}
  .res[disabled]{color:var(--ink3)}
  .res .pin{width:40px; height:40px; flex:none; border-radius:11px; background:var(--panel2);
    display:grid; place-items:center; color:var(--ink3)}
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:70;
    background:var(--ink); color:#fff; border-radius:11px; box-shadow:var(--shadow);
    padding:13px 20px; font-size:16px; display:none; max-width:92vw; text-align:center;
  }

  /* ---- narrow phones: the panel becomes a drawer that opens from the left ---- */
  @media (max-width:900px){
    /* the drawer sits beside the rail, so its width has to leave room for it:
       at min(88vw) on a 390 px phone the right-hand column fell off screen */
    :root{--rail:76px; --pw:min(calc(100vw - 76px - 6px),356px)}
    .brand small{display:none}
    #drawerBtn{display:grid; place-items:center}
    #now{font-size:13px; padding:5px 10px}
    #rail button{min-height:56px}          /* size is the base size: see above */
    #panel{
      transform:translateX(-102%); visibility:hidden;
      transition:transform .26s var(--ease), visibility .26s;
    }
    #panel.open{transform:none; visibility:visible}
    body.drawer #scrim{display:block}
    #mapbtns{top:auto; bottom:calc(18px + env(safe-area-inset-bottom))}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div id="map" role="region" aria-label="Cát Lái"></div>
<div id="scrim"></div>

<header id="top">
  <button id="drawerBtn" type="button" data-title="menu" aria-expanded="false" aria-controls="panel">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand">DispatchMonkey<small id="brandSub">Cảng Cát Lái · TP.HCM</small></div>

</header>

<nav id="rail" aria-label="Menu">

    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></svg>

    <span>Khung giờ</span><i>Gate slots</i>
  </button>
  <button type="button" data-tab="feed" aria-pressed="false" aria-controls="panel">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8A8.5 8.5 0 0112.5 20a8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 014 11.5 8.5 8.5 0 018.7 3.9 8.4 8.4 0 0112.5 3H13a8.5 8.5 0 018 8v.5z"/></svg>

  </button>
  <button type="button" data-tab="set" aria-pressed="false" aria-controls="panel">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.9 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H3a2 2 0 110-4h.1A1.6 1.6 0 004.2 7l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1V3a2 2 0 114 0v.1A1.6 1.6 0 0017.1 5l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
    <span>Cài đặt</span><i>Settings</i>
  </button>
</nav>

<div id="mapbtns">
  <button id="btn3d" type="button" aria-pressed="true" title="2D / 3D">3D</button>
  <button id="btnFit" type="button" title="Toàn tuyến">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>
  </button>
  <button id="btnNorth" type="button" data-title="north" hidden>
    <svg id="northArrow" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 3l4.5 11L12 11.6 7.5 14 12 3z" fill="currentColor" stroke="none"/><path d="M12 11.6V21"/></svg>
  </button>
  <button id="btnGps" type="button" aria-pressed="false" data-title="gps">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
  </button>
  <button id="btnRecenter" type="button" data-title="recenter">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 3L3 10.5l7.5 3L13.5 21 21 3z"/></svg>
  </button>
</div>

<aside id="panel" class="open" aria-label="Bảng điều khiển">
  <div class="pane" id="paneMap">
    <div id="where">
      <button id="btnFrom" type="button">
        <span class="dot"></span><span class="txt" id="txtFrom"></span>
        <svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button id="btnTo" type="button">
        <span class="dot to"></span><span class="txt" id="txtTo"></span>
        <svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>
    <div id="fleet" aria-live="polite"></div>
    <div id="wxBox"></div>
    <h2 class="pt" style="margin-top:18px">Bản đồ <small style="font-weight:600;color:var(--ink3)">/ Map</small></h2>
    <div class="kicker" id="optsTitle" style="margin-top:16px"></div>
    <p class="ps" id="optsSub"></p>
    <div id="opts"></div>
    <div id="laneBox"></div>
    <div id="layerBox">
      <div class="kicker" id="layerTitle"></div>
      <div class="lrow">
        <span class="ln" id="lnPort"></span>
        <button class="tgl" id="btnPort" type="button" aria-pressed="false"></button>
      </div>
      <div class="note" id="portNote"></div>
      <div class="lrow">
        <span class="ln" id="lnRain"></span>
        <button class="tgl" id="btnRain" type="button" aria-pressed="false"></button>
      </div>
      <div class="lrow" id="opacityRow" hidden>
        <label class="ln" for="rainOpacity" id="lnOpacity"></label>

      <div class="note" id="rainNote"></div>
    </div>
    <button class="ghost" id="soloToggle" type="button"></button>
    <div id="solo" hidden>
    <div class="kicker" id="kDepart"></div>
    <div class="ansRow">
      <span class="ansTime" id="aTime">—</span>
      <span class="wait"><b id="aWait">—</b><span id="aWaitLab"></span></span>
    </div>
    <div class="ansSub" id="aSub"></div>
    <button class="primary" id="aGo"></button>
    <button class="ghost" id="aWhy"></button>
    <div class="why" id="whyBox" hidden></div>
    </div>
  </div>

  <div class="pane" id="paneFeed" hidden>
    <h2 class="pt">Tin tài xế <small style="font-weight:600;color:var(--ink3)">/ Driver updates</small></h2>
    <div id="feedBox">
      <div class="feedHead">
        <span class="kicker" id="feedTitle"></span>
        <span class="chip" id="feedSrc"></span>
      </div>
      <div class="note" id="feedScope"></div>
      <div id="feed" aria-live="polite"></div>
    </div>
  </div>

  <div class="pane" id="paneSlots" hidden>
    <h2 class="pt">Khung giờ <small style="font-weight:600;color:var(--ink3)">/ Gate slots</small></h2>
    <h2 class="pt" id="slotsTitle" style="font-size:17px"></h2>
    <p class="ps" id="slotsSub"></p>
    <div id="slots"></div>
    <div class="legend" id="slotsLegend"></div>
    <div id="gateActs">
      <button type="button" data-compose="photo">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 8.5A1.5 1.5 0 014.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5v-9z"/><circle cx="12" cy="12.5" r="3.4"/></svg>
        <span data-i18n="actPhoto"></span>
      </button>
      <button type="button" data-compose="voice">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        <span data-i18n="actVoice"></span>
      </button>
      <button type="button" data-compose="text">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16M4 10h16M4 15h10"/><path d="M14.5 20.5l5.5-5.5 2 2-5.5 5.5H14.5v-2z"/></svg>
        <span data-i18n="actText"></span>
      </button>
    </div>
  </div>

  <div class="pane" id="paneSet" hidden>

      <div class="note" id="truckNote"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labLang"></span>
      <div class="seg" id="segLang"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labScn"></span>
      <div class="seg v" id="segScn"></div>
      <div class="note" id="scnNote"></div>
    </div>
    <div class="srow">
      <div class="two">
        <div><label class="lab" for="demoTime" id="labNow"></label><input id="demoTime" type="time" value="06:10"></div>
        <div><label class="lab" for="slot" id="labSlot"></label><input id="slot" type="time"></div>
      </div>
      <div class="note" id="slotNote"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labReg"></span>
      <div class="seg" id="segReg"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labAc"></span>
      <div class="seg" id="segAc"></div>
      <div class="note" id="acNote"></div>
    </div>
    <div class="srow">
      <span class="lab" id="labPay"></span>
      <div class="seg" id="segPay"></div>
      <div class="note" id="payNote"></div>
    </div>
    <div class="srow">

<div id="search" hidden>
  <div class="sTop">
    <button id="sBack" type="button" aria-label="Back">‹</button>
    <div id="sTitle"></div>
  </div>
  <input id="q" type="search" autocomplete="off">
  <div id="sList"></div>
</div>

<div id="compose" hidden role="dialog" aria-modal="true" aria-labelledby="cTitle">
  <div class="cTop">
    <button id="cBack" type="button" aria-label="Back">‹</button>
    <div id="cTitle"></div>
  </div>
  <div class="cBody">
    <div class="note" id="cCtx"></div>

    <div class="seg v" id="cRoad"></div>

    <span class="lab" id="cLabText"></span>

    <div class="note" id="cPrivacy"></div>
    <button class="primary" id="cSend" type="button"></button>
  </div>
</div>

<div id="toast"></div>

const hm = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
const fmt = m => `${String(Math.floor(m / 60) % 24).padStart(2,'0')}:${String(Math.round(m) % 60).padStart(2,'0')}`;
const nameOf = (list, id) => { const x = list.find(o => o.id === id); return x ? ((lang === 'en' && x.en) || x.name || x[lang]) : ''; };
const oname = o => (lang === 'en' && o.en) || o.name;

/* The header clock is the demo time the user set in Settings, not a live feed:
 * it is static for that reason, and never pulses. */
function syncClock() { $('#nowClock').textContent = $('#demoTime').value || '06:10'; }

function toast(msg) {
  $('#toast').textContent = msg; $('#toast').style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').style.display = 'none', 2400);
}

/* segmented control — never a native select (unusable with gloves in sunlight) */
function seg(id, options, value, onPick) {
  const el = $(id); el.innerHTML = '';
  for (const o of options) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = o.label;
    b.setAttribute('aria-pressed', String(o.v === value));
    b.onclick = () => { onPick(o.v); };
    el.appendChild(b);
  }
}

/* ---------------- search (also used as first-run onboarding) -------------- */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let searchDone = null;

function openSearch(field, onDone) {
  searchDone = onDone;
  $('#search').hidden = false;
  $('#sTitle').textContent = field === 'from' ? T('pickFrom') : T('pickTo');
  $('#q').placeholder = T('searchPh');
  $('#q').value = '';
  const items = field === 'from'
    ? ORIGINS.map(o => ({ id: o.id, name: oname(o), sub: '', ok: true }))
    : DESTS.map(d => ({ id: d.id, name: d[lang], sub: d.ok ? d.sub[lang] : T('soon'), ok: d.ok }));
  const draw = () => {
    const q = norm($('#q').value);
    $('#sList').innerHTML = '';
    for (const it of items.filter(i => norm(i.name).includes(q))) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'res';
      b.innerHTML = `<span class="pin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.4 7-11a7 7 0 10-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
        <span>${it.name}${it.sub ? `<small>${it.sub}</small>` : ''}</span>`;
      if (!it.ok) b.disabled = true;

}
$('#sBack').onclick = () => { $('#search').hidden = true; };
$('#btnFrom').onclick = () => openSearch('from', id => { originId = id; saveProfile(); applyLang(); run(); });
$('#btnTo').onclick = () => openSearch('to', id => { destId = id; saveProfile(); applyLang(); run(); });

function saveProfile() {
  try { localStorage.setItem('dunggio-profile', JSON.stringify({ origin: originId, dest: destId, lang, truck: myTruck, limitedAc })); } catch {}
}

/* ---------------- recommendation (contract shape) ------------------------- */
function ctxNow() {
  return {
    nowMin: hm($('#demoTime').value || '06:10'), scenario,
    fuelPer100: +$('#fuel').value || 35, payType: $('#segPay').dataset.v,
    hourlyRate: RATES.driverVndPerH.v, dieselPrice: RATES.dieselVndPerL.v,
    hoursLeft: $('#hours').value ? +$('#hours').value : null,
    slotMin: $('#slot').value ? hm($('#slot').value) : null,
    registered24: $('#segReg').dataset.v === 'yes', poiCount: POI,
    // Confirmed closures only. An unverified driver report is an advisory.
    closedRoads: [...closedRoads()],
  };
}

/* The cards are (departure, route) PAIRS scored together, so a driver makes one
 * decision and not two. A route is shown as "worst" only when it is still legal
 * and drivable; a route a rule or a confirmed closure removes gets a separate,
 * unselectable "blocked" card that says which rule removed it. */
let optCards = [], blockedCards = [], selKey = null;
const optKey = o => o.route.id + '@' + o.departTime;

function run() {
  syncClock();
  const ctx = ctxNow();
  const opts = [];
  for (const r of ROUTES[originId]) for (const d of [0, 15, 30, 60, 90, 120]) opts.push(evalOption(r, d, ctx));
  const burden = LEDGER['Nguyễn Thị Định (Cát Lái)'] || 0;
  const ranked = scoreOptions(opts, WEIGHTS, 1 + Math.min(1, burden / 600)) || [];

  // Every eligible route gets one card at its own best departure, so route choice
  // stays visible; remaining slots go to the next-best pairs on any route.
  const perRoute = new Map();
  for (const o of ranked) if (!perRoute.has(o.route.id)) perRoute.set(o.route.id, o);
  optCards = [...perRoute.values()];
  for (const o of ranked) { if (optCards.length >= 4) break; if (!optCards.includes(o)) optCards.push(o); }
  optCards.sort((a, b) => a.score - b.score);

  // A route is "blocked" only if NO departure on it is legal. Otherwise it is
  // simply a route whose good departures are elsewhere on the list.
  blockedCards = [];
  for (const o of opts) {
    if (!o.blocked.length || perRoute.has(o.route.id)) continue;
    if (!blockedCards.some(b => b.route.id === o.route.id)) blockedCards.push(o);
  }

  // Keep the driver's own pick across a re-plan when it is still on the list.
  best = optCards.find(o => optKey(o) === selKey) || optCards[0] || null;
  selKey = best ? optKey(best) : null;
  alts = optCards.filter(o => o !== best).slice(0, 2);
  blockedMsg = (!best && blockedCards.length) ? T('noOption') : '';
  renderOptions();
  renderAnswer();
  renderSlots();
  const prev = routeRoads.join();
  routeRoads = best ? best.route.roads : [];
  paintRoads();
  if (routeRoads.join() !== prev) fitRoute();   // re-frame only when the road set changes
  loadRouteWeather();                           // deferred; never blocks the route or the next turn
  renderLanes();
}

/* Rank → colour + the word that carries the same meaning. Colour is never alone. */
function rankOf(i, n) {
  if (i === 0) return ['ok', 'rankBest'];
  if (i === n - 1 && n > 1) return ['bad', 'rankWorst'];
  return ['warn', 'rankMid'];
}
const blockWhy = ids => ids.map(id => {
  const k = 'blk_' + id.replace(/-/g, '_');
  return STR[k] ? T(k) : id;
}).join('; ');

function renderOptions() {
  $('#optsTitle').textContent = T('optsTitle');
  $('#optsSub').textContent = T('optsSub');
  const vnd = v => Math.round(v / 1000) + 'k ₫';
  const n = optCards.length;
  const card = (o, i) => {
    const [cls, lab] = rankOf(i, n);
    const why = i === n - 1 && n > 1 ? T('worstWhy') : (best && o !== best ? clauses(o, best, lang) : '');
    return `<button class="card ${cls}" type="button" data-key="${optKey(o)}"
        aria-pressed="${optKey(o) === selKey}">
      <span class="cHead">
        <span class="cName"><span class="rank ${cls}">${T(lab)}</span>
          ${o.route[lang]}<small>${o.km} km · ${o.route.roads.length} ${lang === 'vi' ? 'đoạn' : 'roads'}</small></span>
        <span class="cDepart"><b>${o.departTime}</b><span>${T('depart')}</span></span>
      </span>
      <span class="cMetrics">
        <span class="m"><span class="mk">${T('mGate')}</span><span class="mv">${o.gateTime}</span></span>
        <span class="m"><span class="mk">${T('mWait')}</span><span class="mv">${o.queue.mid}′</span></span>
        <span class="m"><span class="mk">${T('mCost')}</span><span class="mv">${vnd(o.costVnd)}</span></span>
      </span>
      ${why ? `<span class="cWhy">${why}</span>` : ''}
    </button>`;
  };
  const blocked = o => `<div class="card blocked">
    <span class="cHead">
      <span class="cName"><span class="rank blocked">${T('rankBlocked')}</span>
        ${o.route[lang]}<small>${o.km} km</small></span>
    </span>
    <span class="cWhy">${T('blockedWhy').replace('{why}', blockWhy(o.blocked))}</span>
  </div>`;
  $('#opts').innerHTML = n
    ? optCards.map(card).join('') + blockedCards.map(blocked).join('')
    : `<div class="blocked">${blockedMsg}</div>` + blockedCards.map(blocked).join('');
  $('#opts').querySelectorAll('.card[data-key]').forEach(el => el.onclick = () => {
    selKey = el.dataset.key;
    best = optCards.find(o => optKey(o) === selKey) || best;
    alts = optCards.filter(o => o !== best).slice(0, 2);
    renderOptions(); renderAnswer(); renderSlots();
    routeRoads = best.route.roads; paintRoads(); fitRoute();
    loadRouteWeather();
  });
}

/* Confidence is never "high": the whole replay is simulated, and a disrupted
 * day rests on unverified driver reports. */
const confidence = () => scenario === 'normal' ? 'medium' : 'low';

function renderAnswer() {
  $('#kDepart').textContent = T('depart');
  if (!best) {
    $('#aTime').textContent = '—'; $('#aWait').textContent = '—';
    $('#aSub').textContent = blockedMsg; $('#aGo').disabled = true;
    $('#whyBox').hidden = true; return;
  }
  const o = best;
  $('#aGo').disabled = false;
  $('#aTime').textContent = o.departTime;
  $('#aWait').textContent = o.queue.lo === o.queue.hi ? o.queue.mid : `${o.queue.lo}–${o.queue.hi}`;
  $('#aWaitLab').textContent = T('waitLab');
  $('#aSub').innerHTML = T('sub')
    .replace('{gate}', o.gateTime).replace('{route}', o.route[lang]).replace('{km}', o.km)
    + ` <span class="chip sim">SIMULATED</span>`;
  const now = ROUTES[originId].map(r => evalOption(r, 0, ctxNow())).filter(x => !x.blocked.length)
    .sort((a, b) => a.idleMin - b.idleMin)[0];
  const savedMin = now ? Math.round(now.idleMin - o.idleMin) : 0;
  $('#whyBox').innerHTML = `
    ${savedMin > 4 ? `<div class="saved" style="margin-bottom:9px">${T('saved').replace('{n}', savedMin)}</div>` : ''}
    <ul>${reasons(o, now).map(r => `<li>${r}</li>`).join('')}</ul>
    <div class="kicker" style="margin-top:12px">${T('costT')}</div>
    ${costTable(o)}
    <div class="note">${T('conf')}: ${confidence() === 'low' ? T('confLow') : T('confMed')} · data_source: synthetic</div>
    ${alts.length ? `<div class="kicker" style="margin-top:14px">${T('altTitle')}</div>` : ''}
    ${alts.map(a => `<button class="alt" data-dep="${a.departTime}" type="button">
        <span class="at">${a.departTime}</span>
        <span class="an">${a.route[lang]}</span>
        <span class="aw">${a.queue.lo}–${a.queue.hi} ${lang === 'vi' ? 'ph' : 'min'}</span>
      </button>`).join('')}`;
  $('#whyBox').querySelectorAll('.alt').forEach(el => {
    el.onclick = () => {
      best = alts.find(a => a.departTime === el.dataset.dep) || best;
      alts = []; renderAnswer(); renderSlots();
      routeRoads = best.route.roads; paintRoads();
    };
  });
}

/* xSHIP lens: every cost on one bill, including the ones nobody bills. */
function costTable(o) {
  const vnd = v => Math.round(v).toLocaleString(lang === 'vi' ? 'vi-VN' : 'en-US') + ' ₫';
  const fuel = o.fuelL * RATES.dieselVndPerL.v;
  const wage = Math.max(0, o.costVnd - fuel - o.tollVnd - o.penaltyVnd);
  const rows = [
    [T('cFuel').replace('{l}', o.fuelL).replace('{p}', RATES.dieselVndPerL.v.toLocaleString()), vnd(fuel), 'est', 'EST', RATES.dieselVndPerL.src],
    [T('cToll'), vnd(o.tollVnd), 'est', 'EST', 'cầu Phú Mỹ container toll, estimate'],
    [T('cWage'), vnd(wage), 'est', 'EST', RATES.driverVndPerH.src],
    [T('cPen'), vnd(o.penaltyVnd), 'sim', 'SIM', 'simulated'],
  ];
  return `<table class="costs">${rows.map(([a, b, c, t, tip]) => `<tr><td>${a} ${tier(c, t, tip)}</td><td>${b}</td></tr>`).join('')}
    <tr><td><b>${T('cTotal')}</b></td><td><b>${vnd(o.costVnd)}</b></td></tr>
    <tr class="unbilled"><td>${T('cUnpaid')} ${tier('der', 'DERIVED', 'queue + waiting, per-trip pay')}</td><td>${o.unpaidMin} ${lang === 'vi' ? 'phút' : 'min'}</td></tr>
    <tr class="unbilled"><td>${T('cExpo')} ${tier('real', 'OSM', 'schools/clinics within 150 m of the queue road, OpenStreetMap')}</td><td>${o.exposure}</td></tr></table>`;
}

/* ---------------- gate slot load (30-min buckets) ------------------------- */
function renderSlots() {
  const scn = SCENARIOS[scenario];
  const cap = scn.capacityPerSlot * 2;                   // two 15-min slots per bar
  const mine = best ? Math.floor((best.gateMin % 1440) / 30) : -1;
  let html = '';
  for (let b = 12; b <= 39; b++) {                       // 06:00 → 20:00
    const arr = (ARRIVALS[b * 2] + ARRIVALS[b * 2 + 1]) * scn.arrivalsFactor;
    const load = arr / cap;
    const w = queueWaitAt(b * 30, scn).mid;
    // Same three meanings as the option cards: clear / slow / jammed, each named
    // in the legend below so the bar colour is never the only cue.
    const col = load >= 1 ? 'var(--stopf)' : load >= .85 ? 'var(--warnf)' : 'var(--gof)';
    const held = (claimed[b] || 0) / cap * 100;
    const full = load >= 1;                               // Amazon-style: a full slot is not offered
    const sel = pickedSlot === b;
    html += `<button type="button" class="slot${b === mine ? ' mine' : ''}${full ? ' full' : ''}"
        data-slot="${b}" aria-pressed="${sel}">
      <span class="t">${fmt(b * 30)}</span>
      <span class="bar">
        <span class="fill" style="width:${Math.min(100, load * 100).toFixed(1)}%;background:${col}"></span>
        <span class="claim" style="width:${Math.min(20, held).toFixed(1)}%"></span>
      </span>
      <span class="w">${full ? T('full') : `${w} ${lang === 'vi' ? 'ph' : 'min'}`}</span>
    </button>`;
  }
  $('#slots').innerHTML = html;
  $('#slots').querySelectorAll('[data-slot]').forEach(el => el.onclick = () => {
    pickedSlot = pickedSlot === +el.dataset.slot ? null : +el.dataset.slot;
    renderSlots();
  });
  $('#slotsLegend').innerHTML = [
    ['var(--gof)', T('legClear')], ['var(--warnf)', T('legSlow')],
    ['var(--stopf)', T('legJam')], ['var(--accent)', T('legMine')],
  ].map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')
    + ` <span class="chip sim">SIMULATED</span>`;
}

/* ---------------- map ------------------------------------------------------ */
/* Route-line colour uses the SAME three meanings as the option cards:
 * green = the option you were recommended, yellow = a middle option, red = the
 * worst-ranked one. A stretch under a CONFIRMED full closure is over-drawn in a
 * red dash and a merely slowed stretch in a yellow dash, so "ranked last" can
 * never be mistaken for "you may not drive this". */
const RANKF = { ok: '#16a34a', warn: '#eab308', bad: '#dc2626' };

/* A road is removed from planning only on a CONFIRMED full closure: enough
 * independent driver sources, or a dispatcher/provider confirmation. An
 * unverified report is an advisory and never deletes a route. */
function closedRoads() {
  const out = new Set();
  for (const p of FEED.posts || []) {
    if (p.cat === 'full_closure' && p.state === 'confirmed' && p.road) out.add(p.road);
  }
  for (const r of INCIDENTS.closedRoads || []) out.add(r);
  return out;
}
function slowRoads() {
  const out = new Set(SCENARIOS[scenario].slowRoads || []);
  for (const p of FEED.posts || []) {
    if (p.state === 'expired' || p.cat === 'question' || !p.road) continue;
    if (['crash', 'blocked_lane', 'flooding', 'roadwork', 'traffic', 'breakdown'].includes(p.cat)) out.add(p.road);
  }
  for (const r of INCIDENTS.slowRoads || []) out.add(r);
  return out;
}

const d2 = (a, b) => {                                 // squared metres, flat earth at 10°N
  const x = (a[0] - b[0]) * 109200, y = (a[1] - b[1]) * 111320;
  return x * x + y * y;
};
const nearestIdx = (line, p) => {
  let bi = 0, bd = Infinity;
  for (let i = 0; i < line.length; i++) { const d = d2(line[i], p); if (d < bd) { bd = d; bi = i; } }
  return bi;
};
/* Where two named roads meet: the closest pair of shape points. */
function junction(a, b) {
  let ia = 0, ib = 0, bd = Infinity;
  for (let i = 0; i < a.length; i++) for (let j = 0; j < b.length; j++) {
    const d = d2(a[i], b[j]); if (d < bd) { bd = d; ia = i; ib = j; }
  }
  return [ia, ib];
}

/* Stitch the plan's named roads into one drivable line, yard → gate. Each road is
 * clipped to the stretch between its two junctions and flipped into travel order,
 * so the driver sees a single line to follow instead of whole roads lighting up.
 * One feature per road, so a jammed stretch stays locatable. A road whose two
 * junctions land on the same point (Đồng Văn Cống is listed for the queue, not
 * driven) drops out.
 * shortcut: geo.json has no Thủ Thiêm tunnel, so the Nguyễn Văn Linh → Mai Chí
 * Thọ hand-off draws as a 2.3 km straight line across the river. Add the tunnel
 * way to geo.json if that route becomes the one we demo. */
function routeFeatures() {
  const names = [...new Set(routeRoads)].filter(n => geo && geo.roads[n] && geo.roads[n].length > 1);
  if (!names.length) return [];
  const o = ORIGINS.find(x => x.id === originId);
  const start = o ? [o.lon, o.lat] : null, end = [GATE.lon, GATE.lat];
  const lines = names.map(n => geo.roads[n]);
  const cuts = lines.map(() => [0, 0]);
  cuts[0][0] = start ? nearestIdx(lines[0], start) : 0;
  for (let i = 0; i + 1 < lines.length; i++) {
    const [ia, ib] = junction(lines[i], lines[i + 1]);
    cuts[i][1] = ia; cuts[i + 1][0] = ib;
  }
  cuts[lines.length - 1][1] = nearestIdx(lines[lines.length - 1], end);
  const feats = [];
  for (let i = 0; i < lines.length; i++) {
    const [a, b] = cuts[i];
    const seg = a <= b ? lines[i].slice(a, b + 1) : lines[i].slice(b, a + 1).reverse();
    if (seg.length < 2) continue;
    feats.push({ type: 'Feature', properties: { name: names[i] },
                 geometry: { type: 'LineString', coordinates: seg } });
  }
  if (feats.length) {                                  // pin the ends to the yard and the gate
    if (start) feats[0].geometry.coordinates.unshift(start);
    feats[feats.length - 1].geometry.coordinates.push(end);
  }
  return feats;
}

function paintRoads() {
  if (!mapReady || !geo) return;
  routeFeats = routeFeatures();
  map.getSource('route').setData({ type: 'FeatureCollection', features: routeFeats });
  const i = optCards.indexOf(best);
  const cls = i >= 0 ? rankOf(i, optCards.length)[0] : 'warn';
  map.setPaintProperty('route', 'line-color', RANKF[cls]);
  const closed = [...closedRoads()], slow = [...slowRoads()].filter(r => !closed.includes(r));
  map.setFilter('route-closed', ['in', ['get', 'name'], ['literal', closed]]);
  map.setFilter('route-slow', ['in', ['get', 'name'], ['literal', slow]]);
  placeMe();
}

function placeMe() {                                   // "you are here" = the yard we start from
  const o = ORIGINS.find(x => x.id === originId);
  if (!mapReady || !o || gps.coords) return;           // a real GPS fix outranks the yard
  if (!meMarker) {
    const el = document.createElement('div');
    el.className = 'me';
    meMarker = new maplibregl.Marker({ element: el }).setLngLat([o.lon, o.lat]).addTo(map);
  } else meMarker.setLngLat([o.lon, o.lat]);
}

function fitRoute() {
  if (!mapReady || !geo) return;
  const pts = routeFeats.flatMap(f => f.geometry.coordinates);
  if (!pts.length) return;
  const b = pts.reduce((a, p) => a.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  // The rail and the panel overlay the map, so the route has to be framed into
  // what is left. On a phone the drawer is transient, so only the rail counts.
  const railW = $('#rail').getBoundingClientRect().width;
  const panW = isNarrow() ? 0 : $('#panel').getBoundingClientRect().width;
  // Keep the driver's bearing. pitch is deliberately NOT passed: fitBounds would
  // then solve for a 55° camera, whose view reaches the horizon, and pull the
  // centre kilometres back down the road to squeeze the route into the padding.
  map.fitBounds(b, { padding: { top: 46, bottom: 46, left: railW + panW + 34, right: 86 },
                     duration: 600, bearing: map.getBearing() });
}

/* schools/hospitals within ~150 m of each road (exposure input) */
function poiCounts() {
  const out = {};
  const pois = [...(geo.schools || []), ...(geo.hospitals || [])];
  for (const [name, line] of Object.entries(geo.roads || {})) {
    let n = 0;
    for (const p of pois) {
      for (let i = 0; i < line.length; i += 2) {
        const dLat = (p.lat - line[i][1]) * 111320, dLon = (p.lon - line[i][0]) * 109200;
        if (dLat * dLat + dLon * dLon < 150 * 150) { n++; break; }
      }
    }
    out[name] = n;
  }
  return out;
}

/* ---------------- language + chrome --------------------------------------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll('[data-title]').forEach(el => {   // icon-only map buttons
    el.title = T(el.dataset.title); el.setAttribute('aria-label', T(el.dataset.title));
  });
  $('#feedTitle').textContent = T('feedTitle');
  if (FEED.posts.length || !$('#feed').innerHTML) renderFeed();
  if (!$('#compose').hidden) renderComposeOpts();
  const o = ORIGINS.find(x => x.id === originId);
  $('#txtFrom').textContent = o ? oname(o) : T('from');
  $('#txtFrom').classList.toggle('empty', !o);
  $('#txtTo').textContent = nameOf(DESTS, destId) || T('to');
  $('#aGo').textContent = T('go');
  /* One time on screen: the dispatcher's plan is the answer; the solo planner is
   * folded away so a driver (or judge) never sees two different leave times. */
  $('#soloToggle').textContent = $('#solo').hidden
    ? (lang === 'vi' ? 'Chạy chuyến riêng, không theo nhà xe? Tự xem giờ đi ▸' : 'Not on a fleet job? Plan your own trip ▸')
    : (lang === 'vi' ? 'Ẩn công cụ chuyến riêng ▴' : 'Hide own-trip planner ▴');
  $('#aWhy').textContent = $('#whyBox').hidden ? T('why') : T('whyHide');
  for (const [id, k] of [['#slotsTitle','slotsTitle'], ['#slotsSub','slotsSub'],
    ['#labLang','labLang'], ['#labScn','labScn'], ['#labNow','labNow'], ['#labSlot','labSlot'],

/* Map labels follow the app language: English names where OSM has them, else the local name. */
const _origTF = {};
function setMapLang() {
  if (!map || !map.isStyleLoaded || !map.isStyleLoaded()) return;
  for (const l of map.getStyle().layers) {
    if (l.type !== 'symbol') continue;
    const tf = map.getLayoutProperty(l.id, 'text-field');
    if (tf == null) continue;
    if (!(l.id in _origTF)) _origTF[l.id] = tf;

      ? ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']]

/* engine-written reasons (no LLM ever writes a number) */
function reasons(o, vs) {
  const vi = lang === 'vi', r = [];
  const loadPct = Math.round((ARRIVALS[Math.floor((o.gateMin % 1440) / 15)] * SCENARIOS[scenario].arrivalsFactor)
    / SCENARIOS[scenario].capacityPerSlot * 100);
  r.push(vi ? `Khung giờ này cổng nhận ${loadPct}% so với sức thông quan`
            : `At this slot the gate is at ${loadPct}% of its clearing capacity`);
  if (vs) { const c = clauses(o, vs, lang); if (c) r.push(c[0].toUpperCase() + c.slice(1)); }
  if (o.waitOpenMin > 0) r.push(vi ? `Gồm ${o.waitOpenMin} phút chờ cổng mở lúc 7:30`
                                   : `Includes ${o.waitOpenMin} min waiting for the 7:30 opening`);
  if (o.unpaidMin) r.push(vi ? `${o.unpaidMin} phút này anh/chị không được trả công`
                             : `${o.unpaidMin} of these minutes are unpaid for you`);
  return r;
}

/* ---------------- fleet plan + shared state with the dispatcher website ---- */
/* Same engine as the website (fleet.js → allocateFleet 'aware'): app users are placed
 * first, one at a time, each counting the ones before it. The website's Re-plan and
 * Approve arrive here through /api/state. Offline, the card shows the morning plan. */
let myTruck = 'T09', SH = { step: 0, approved: false, trust: false, reports: 0, rev: -1 }, shOnline = false, DAYF = null;
function fleetDay() {
  if (!DAYF) DAYF = runDay({}, geo ? exposureShare(geo.roads['Nguyễn Thị Định'], [...geo.schools, ...geo.hospitals]) : 0.243);

const tier = (cls, txt, tip) => `<span class="tier ${cls}" title="${tip}">${txt}</span>`;
function renderFleet() {
  const d = fleetDay(), id = myTruck, vi = lang === 'vi';
  const row = p => p.ev.rows.find(r => r.id === id);
  const n = row(d.normal), st = row(d.stale), re = row(d.replan);
  const step = SH.step, live = step === 4 && SH.approved;
  let r = n, cls = '', head = T('fleetLeave').replace('{dep}', fmt(n.depart)).replace('{gate}', fmt(n.gate)), extra = '';
  if (step >= 3 && !live) {

      : T('fleetLeave').replace('{dep}', fmt(re.depart)).replace('{gate}', fmt(re.gate)) + `<div class="fs">${T('fleetSame')}</div>`;
  }
  const creep = Math.max(0, Math.round(r.depart - r.planned));

    <div class="fk">${T('fleetK').replace('{id}', id)} ${tier('sim', 'SIM', vi ? 'Đội xe, đơn hàng, giờ kho là mô phỏng' : 'Fleet, jobs and warehouse windows are simulated')}
      <span class="sync ${shOnline ? 'on' : ''}">● ${shOnline ? (vi ? 'đồng bộ với nhà xe' : 'live with dispatcher') : (vi ? 'ngoại tuyến' : 'offline')}</span></div>
    <div class="fm">${head} ${tier('der', 'DERIVED', vi ? 'Tính bởi bộ xếp giờ: mỗi xe được xếp có tính các xe đã xếp trước (chống dồn cục)' : 'Computed by the allocator: each truck is placed counting the trucks already placed (anti-herding)')}</div>
    <div class="fs">${T('fleetSub').replace('{w}', Math.round(r.wait)).replace('{wh}', fmt(r.whArrive)).replace('{close}', fmt(r.win[1]))}</div>
    ${extra}
    <div class="fs">${T('creep').replace('{cap}', CREEP_CAP_MIN).replace('{n}', creep ? T('creepN').replace('{n}', creep) : T('creepNone'))}</div>
    <div class="note">${T('appFirst')}</div>
    <button id="report" type="button"></button>`;
  // One button, one report system: the same live feed the dashboard watches (/api/posts).
  const b = bridgeReport();
  const mine = b && (b.by === whoAmI || (() => { try { return localStorage.getItem('dg-confirmed-' + b.id) === '1'; } catch { return false; } })());
  const sources = b ? b.confirms + 1 : 0;

    : b.state === 'unverified' ? T('report1') : T('report2').replace('{n}', sources);

/* The live crash report on the bridge, if any (not a reply, not expired). */
function bridgeReport() {
  return (FEED.posts || []).find(p => !p.replyTo && p.road === 'Cầu Phú Mỹ' && p.state !== 'expired'
    && ['crash', 'blocked_lane', 'full_closure'].includes(p.cat));
}
async function doReport() {
  const b = bridgeReport();
  try {
    if (b) {                                                   // someone else reported it: this phone confirms
      await sendConfirm(b.id, false);
      try { localStorage.setItem('dg-confirmed-' + b.id, '1'); } catch {}
    } else {
      const r = await fetch('/api/posts', { method: 'POST', headers: { 'Content-Type': 'application/json' },

          dir: T('dirTo'), corridor: destId }) });
      const j = await r.json();
      if (!r.ok) { toast(T('sendFail')); return; }

function applyShared(st) {
  const was = SH;

    scenario = st.step >= 3 ? 'disrupted' : 'normal';         // the map turns red once the incident is CONFIRMED + applied
    if (st.step === 0) { try { localStorage.removeItem('dg-reported'); } catch {} }
    applyLang(); run();
  }
  if (st.approved && !was.approved && st.step === 4) toast(lang === 'vi' ? 'Nhà xe đã duyệt kế hoạch mới' : 'Dispatcher approved a new plan');
  renderFleet();
}
async function pullShared() {
  try {
    const st = await (await fetch('/api/state', { cache: 'no-store' })).json();
    const first = !shOnline; shOnline = true;
    if (st.rev !== SH.rev) applyShared(st); else if (first) renderFleet();
  } catch { if (shOnline) { shOnline = false; renderFleet(); } }
}

/* ---------------- route weather (Open-Meteo, no key) ----------------------- */
/* Deferred: the route and the next turn come first. One batched call for all
 * checkpoints, re-run only when the route or the departure actually changes,
 * and the previous reading stays on screen while a new one is in flight. */
let WX = { state: 'idle', points: [], sum: null, at: null, day: null, err: null };
let wxKey = '', wxAbort = null, limitedAc = false;

async function loadRouteWeather() {
  if (!best || !routeFeats.length) return;
  const cps = routeCheckpoints(routeFeats, GATE, 5);
  const queueEnd = best.gateMin + (best.queue ? best.queue.mid : 0);
  const mins = passingTimes(cps, best.departMin, best.gateMin, queueEnd);
  const key = cps.map(c => `${c.lon.toFixed(3)},${c.lat.toFixed(3)}`).join('|') + '@' + mins.join(',');
  if (key === wxKey) return;                          // same route, same times
  wxKey = key;
  if (wxAbort) wxAbort.abort();                       // a stale forecast is wasted bandwidth
  wxAbort = new AbortController();
  WX = { ...WX, state: 'loading', err: null };
  renderWeather();
  const u = 'https://api.open-meteo.com/v1/forecast'
    + `?latitude=${cps.map(c => c.lat.toFixed(4)).join(',')}`
    + `&longitude=${cps.map(c => c.lon.toFixed(4)).join(',')}`
    + '&hourly=temperature_2m,relative_humidity_2m,apparent_temperature'
    + '&timezone=Asia%2FHo_Chi_Minh&forecast_days=2';
  try {
    const r = await fetch(u, { signal: wxAbort.signal });
    if (!r.ok) throw new Error('http ' + r.status);
    const raw = await r.json();
    const series = Array.isArray(raw) ? raw : [raw];
    const day = series[0].hourly.time[0].slice(0, 10);
    WX = {
      state: 'ok', day, at: Date.now(), err: null,
      points: cps.map((c, i) => {
        const s = series[i] || series[0], h = s.hourly;
        const k = hourIndex(h.time, day, mins[i]);
        return {
          label: c.label, minute: mins[i],
          cellLat: s.latitude, cellLon: s.longitude,
          tempC: k == null ? NaN : h.temperature_2m[k],
          rh: k == null ? NaN : h.relative_humidity_2m[k],
          apparentC: k == null ? NaN : h.apparent_temperature[k],
        };
      }),
      sum: null,
    };
    WX.sum = summarise(WX.points, limitedAc);
  } catch (e) {
    if (e.name === 'AbortError') return;
    WX = { ...WX, state: WX.points.length ? 'stale' : 'error', err: String(e.message || e) };
  }
  renderWeather();
}

function renderWeather() {
  const box = $('#wxBox');
  if (WX.state === 'loading' && !WX.points.length) { box.innerHTML = `<div class="note">${T('wxLoading')}</div>`; return; }
  if (WX.state === 'error') { box.innerHTML = `<div class="note">${T('wxFail')}</div>`; return; }
  if (!WX.sum) { box.innerHTML = ''; return; }
  const s = WX.sum;
  const name = p => p.label === 'gate' ? T('wxGate') : p.label === 'origin' ? T('wxOrigin') : T('wxEnroute');
  box.innerHTML = `
    <button class="wxHead ${s.band}" type="button" id="wxToggle" aria-expanded="false">
      <span class="wxBig">${s.tempC}°C</span>
      <span class="wxRh">${s.rh}% ${T('wxRh')}</span>
      <span class="wxWorst">${T('wxWorst')} ${Math.round(s.worst.apparentC)}°C · ${name(s.worst)} ${fmt(s.worst.minute)}</span>
      <span class="wxChev">▾</span>
    </button>
    <div id="wxRows" hidden>
      ${WX.points.map(p => `<div class="wxRow ${heatBand(p.apparentC, limitedAc)}">
        <span class="wxT">${fmt(p.minute)}</span>
        <span class="wxN">${name(p)}</span>
        <span class="wxV">${Number.isFinite(p.tempC) ? p.tempC.toFixed(1) : '—'}°C · ${Number.isFinite(p.rh) ? p.rh : '—'}%</span>
        <span class="wxF">${T('wxFeels')} ${Number.isFinite(p.apparentC) ? Math.round(p.apparentC) : '—'}°</span>
      </div>`).join('')}
      <div class="note">${T('wxNote').replace('{cells}', s.cells).replace('{points}', s.points)}
        ${WX.state === 'stale' ? ' ' + T('wxStale') : ''}</div>
      <div class="note">${T('wxSrc')} · ${WX.day} · ${T('wxTz')}</div>
    </div>`;
  renderSources();            // Open-Meteo has resolved; the status row was stale
  $('#wxToggle').onclick = () => {
    const r = $('#wxRows');
    r.hidden = !r.hidden;
    $('#wxToggle').setAttribute('aria-expanded', String(!r.hidden));
  };
}

 * A LANE prompt is shown only where the lane scope is in a published notice and
 * the rule covers a road on the chosen route. Everywhere else the app gives
 * turn-level guidance and says nothing about lanes: a wrong lane instruction to
 * a container tractor at the Mỹ Thủy interchange is worse than no instruction.

  if (LANES) return LANES;

      }).join('')
    + (needs.length ? `<details><summary>${T('laneNeeds')} (${needs.length})</summary>
        ${needs.map(x => `<div class="rule">${x.road} — ${esc(x.segment)}
          <div class="src">${esc(x.why_not_applied)}</div></div>`).join('')}</details>` : '');

/* ---------------- Port view: Sentinel-1 scene + circled vessels ------------
 * The radar image and the detections both come from the repository (REAL data,
 * tools/count_ships.py). The circles are placed at the detections' georeferenced
 * centres as MapLibre markers anchored to lng/lat, so they stay on the vessels
 * through pan, zoom, rotate and pitch rather than being drawn in screen space.
 * Vessel activity, truck traffic and gate queues are three different signals from
 * three different sources and three different time windows; each says so. */

async function loadShips() {
  if (SHIPS) return SHIPS;

async function setPort(on) {

  // Markers are anchored to lon/lat, so the circles ride the basemap through pan,

  for (const v of sh.vessels || []) {
    const el = document.createElement('div');
    el.className = 'ship';
    const px = Math.max(18, Math.min(46, Math.max(v.wPx, v.hPx)));

  const q = Math.round((ARRIVALS[Math.floor(nowM / 15)] || 0) * SCENARIOS[scenario].arrivalsFactor);

/* ---------------- NASA GIBS IMERG precipitation (no key) -------------------
 * EPSG:3857 WMTS, IMERG_Precipitation_Rate_30min / GoogleMapsCompatible_Level6.
 * The observation timestamp is read from the capabilities document rather than
 * assumed, and a layer older than two hours is labelled stale. Rain is kept
 * strictly separate from a road closure: it never removes a route. */
const GIBS_WMTS = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best';
const GIBS_LAYER = 'IMERG_Precipitation_Rate_30min';
let RAIN = { state: 'idle', time: null, err: null, on: false, opacity: 0.65 };

const gibsTileUrl = t => `${GIBS_WMTS}/${GIBS_LAYER}/default/${t}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png`;

/* Latest <Value> under the layer's time Dimension. Falls back to null so the
 * caller shows an error instead of inventing a timestamp. */
function latestGibsTime(xml) {
  const i = xml.indexOf(`<ows:Identifier>${GIBS_LAYER}</ows:Identifier>`);
  if (i < 0) return null;
  const end = xml.indexOf('</Layer>', i);
  const block = xml.slice(i, end < 0 ? undefined : end);
  const vals = [...block.matchAll(/<Value>([^<]+)<\/Value>/g)].map(m => m[1].trim());
  const last = vals[vals.length - 1];
  if (!last) return null;
  // GIBS can give a single value or an ISO period "start/end/PT30M".
  return last.includes('/') ? last.split('/')[1] : last;
}

async function setRain(on) {
  RAIN.on = on;
  $('#btnRain').setAttribute('aria-pressed', String(on));
  $('#btnRain').textContent = on ? T('tglOn') : T('tglOff');
  $('#opacityRow').hidden = !on;
  $('#rainLegend').hidden = !on;
  if (!mapReady) return;
  if (!on) {
    if (map.getLayer('rain')) map.setLayoutProperty('rain', 'visibility', 'none');
    $('#rainNote').textContent = '';
    return;
  }
  if (map.getLayer('rain')) {
    map.setLayoutProperty('rain', 'visibility', 'visible');
    renderRainNote();
    return;
  }
  RAIN.state = 'loading'; $('#rainNote').textContent = T('rainLoading');
  try {
    const r = await fetch(`${GIBS_WMTS}/1.0.0/WMTSCapabilities.xml`, { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const t = latestGibsTime(await r.text());
    if (!t) throw new Error('no time dimension');
    RAIN = { ...RAIN, state: 'ok', time: t, err: null };
    map.addSource('rain', { type: 'raster', tiles: [gibsTileUrl(t)], tileSize: 256, maxzoom: 6,
      attribution: 'NASA GIBS / GPM IMERG' });
    // Under the route so a rain tile never hides the line the driver follows.
    map.addLayer({ id: 'rain', type: 'raster', source: 'rain',
      paint: { 'raster-opacity': RAIN.opacity } }, 'route-casing');
  } catch (e) {
    RAIN = { ...RAIN, state: 'error', err: String(e.message || e) };
  }
  renderRainNote();
}
function renderRainNote() {
  const box = $('#rainNote');
  if (RAIN.state === 'error') { box.textContent = `${T('rainErr')} (${RAIN.err})`; return; }
  if (RAIN.state !== 'ok') { box.textContent = ''; return; }
  const ageH = Math.floor((Date.now() - Date.parse(RAIN.time)) / 3600e3);
  box.innerHTML = `${T('rainAt').replace('{t}', RAIN.time)} ${tier('real', 'REAL', 'NASA GIBS WMTS, key-free')}`
    + (ageH >= 2 ? `<br>${T('rainStale').replace('{n}', ageH)}` : '');
  renderSources();
}
$('#rainOpacity').oninput = e => {
  RAIN.opacity = +e.target.value / 100;
  if (mapReady && map.getLayer('rain')) map.setPaintProperty('rain', 'raster-opacity', RAIN.opacity);
};
$('#btnPort').onclick = () => setPort(!portOn);
$('#btnRain').onclick = () => setRain(!RAIN.on);

/* ---------------- which sources are actually live right now ---------------
 * Missing keys block live verification, not the app: every row says plainly
 * whether it is a live provider, local repository data, a cached snapshot, or
 * simulated demo data, so nothing on screen can pass for more than it is. */
const SRC_ROWS = () => [

  ['TomTom Orbis', 'incidents', INCIDENTS.state === 'ok' ? (INCIDENTS.stale ? 'cached' : 'live') : 'off', 'real', 'REAL'],

let FLOW = { state: 'idle' }, VMROUTE = { state: 'idle' }, AISV = { mode: 'idle', count: 0 }, ASRSTATE = 'off';
function renderSources() {

/* ---------------- provider incidents (TomTom Orbis, server-side) ----------
 * The browser never holds the key. /api/incidents matches incidents to the
 * corridor, the direction of travel and the active time window; the server
 * decides which are closures and which are advisories, and says so. */
let INCIDENTS = { state: 'idle', closedRoads: [], slowRoads: [], events: [], at: 0, note: '' };
async function pullIncidents() {
  try {
    const r = await fetch('/api/incidents?dir=to', { cache: 'no-store' });
    if (!r.ok) { INCIDENTS = { ...INCIDENTS, state: 'off' }; return; }
    const j = await r.json();
    const before = INCIDENTS.closedRoads.join();
    INCIDENTS = { state: 'ok', closedRoads: j.closedRoads || [], slowRoads: j.slowRoads || [],
                  events: j.events || [], at: Date.now(), note: j.note || '', stale: !!j.stale };
    renderSources();
    if (INCIDENTS.closedRoads.join() !== before) run();     // a closure changes legality
    else if (mapReady) paintRoads();
  } catch { INCIDENTS = { ...INCIDENTS, state: 'off' }; renderSources(); }
}

/* One probe each at boot so the Settings status list is truthful without
 * polling endpoints that need a key we may not have. */
async function probeProviders() {
  const hit = async (url, set) => {
    try { const r = await fetch(url, { cache: 'no-store' }); set(r.ok ? 'ok' : 'off', await r.json()); }
    catch { set('off', null); }
  };
  await Promise.all([
    hit('/api/flow', st => { FLOW = { state: st }; }),
    hit('/api/route?from=' + encodeURIComponent(originId), (st, j) => {
      VMROUTE = { state: st, data: j };
    }),
    hit('/api/vessels', (st, j) => { AISV = j && j.mode ? j : { mode: 'off', count: 0 }; }),
  ]);
  // Transcription is a POST; an empty body tells us whether a key is configured
  // without sending any audio.
  try {
    const r = await fetch('/api/transcribe', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const j = await r.json();
    ASRSTATE = j.configured ? 'live' : 'off';
  } catch { ASRSTATE = 'off'; }
  renderSources();
}

/* A per-phone random id, not a login and not a name: enough for "one phone is

const whoAmI = (() => {

function renderFeed() {

async function sendConfirm(id, cleared) {
  try {
    const r = await fetch('/api/posts/confirm', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ who: whoAmI, id, cleared }),
    });
    const j = await r.json();
    if (!r.ok) { toast(j.error === 'already counted' ? T('alreadyCounted') : T('sendFail')); return; }
    FEED = { ...j, offline: false }; renderFeed();
    const p = j.posts.find(x => x.id === id);
    toast(cleared ? T('markedCleared')
      : p && p.state === 'confirmed' ? T('nowConfirmed') : T('thanksConfirm'));
  } catch { toast(T('sendFail')); }
}

/* ---------------- composer: photo / voice / text -------------------------- */
let COMP = { kind: 'text', replyTo: null, photo: null, stream: null, rec: null,
             chunks: [], voiceS: 0, cat: 'traffic', road: FEED_ROADS[0], dir: 'to',
             blob: null, mime: '', asr: null, asrDraft: null, voiceData: null };

function openCompose(kind, replyTo) {
  COMP = { ...COMP, kind, replyTo: replyTo || null, photo: null, voiceS: 0,
           blob: null, mime: '', asr: null, asrDraft: null, voiceData: null };
  $('#cAsr').hidden = true; $('#cAsrNote').textContent = ''; $('#cAudio').hidden = true;
  $('#compose').hidden = false;
  $('#cTitle').textContent = T(replyTo ? 'cReply' : kind === 'photo' ? 'cPhoto'
    : kind === 'voice' ? 'cVoice' : 'cText');

    : ($('#slot').value || (best ? best.gateTime : ''));

  $('#cVoice').hidden = kind !== 'voice';
