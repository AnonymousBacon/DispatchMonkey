<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đúng Giờ — Cảng Cát Lái</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* ---------------------------------------------------------------------------
   Đúng Giờ — black-and-white interface. Colour is reserved for judgement:
   green = best option, yellow = middle, red = worst / avoid. Nothing else
   is coloured, so a driver reading the screen in glare sees the answer first.

   Motion follows the 20 UX/animation principles the team picked:
   slow-in/slow-out easing, pose-to-pose staggered card entry, anticipation on
   the sliding panel, exaggerated press feedback, snappy timing (<=260ms),
   Fitts/bigger hit areas (56px), Hick (three choices, never five),
   Miller (three metrics per card), Doherty (every recompute is synchronous),
   Jakob (map + left rail, the layout of giaothong.hochiminhcity.gov.vn).
--------------------------------------------------------------------------- */
:root{
  --paper:#ffffff; --sunk:#f4f4f5; --line:#e4e4e7; --line2:#d4d4d8;
  --ink:#0b0b0c; --ink2:#55595f; --ink3:#71757c;
  /* text-safe semantics (>=4.5:1 on white and on --sunk) */
  --ok:#15803d; --warn:#a16207; --bad:#b91c1c;
  /* fills / bars / map lines */
  --okf:#16a34a; --warnf:#eab308; --badf:#dc2626;
  --rail:84px; --panel:400px;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow:0 1px 2px rgba(11,11,12,.06), 0 16px 40px rgba(11,11,12,.12);
}
*{box-sizing:border-box}
/* id selectors below set display, which outranks the plain [hidden] rule */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink); overflow:hidden;
  /* driver UX: 17px floor, arm's-length mount, gloves, glare */
  font:17px/1.45 'Be Vietnam Pro',ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit; font-variant-numeric:tabular-nums}
button{cursor:pointer; touch-action:manipulation; user-select:none}
:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px; border-radius:4px}
#map{position:fixed; inset:0; background:var(--sunk)}
.maplibregl-ctrl-bottom-left{display:none}
.maplibregl-ctrl-bottom-right{bottom:10px}

/* ---- top bar ------------------------------------------------------------ */
#top{
  position:fixed; top:0; left:0; right:0; height:60px; z-index:30;
  display:flex; align-items:center; gap:14px; padding:0 16px;
  background:var(--paper); border-bottom:1px solid var(--line);
}
.brand{font-weight:800; letter-spacing:-.02em; font-size:19px; white-space:nowrap}
.brand small{display:block; font-size:12px; font-weight:500; color:var(--ink3); letter-spacing:0}
#now{
  margin-left:auto; display:flex; align-items:center; gap:9px;
  background:var(--sunk); border:1px solid var(--line); border-radius:999px;
  padding:7px 14px 7px 12px; font-size:15px;
}
#now b{font-weight:700; font-size:17px}
#now span.lab{color:var(--ink2); font-size:13px}
.pulse{width:8px; height:8px; border-radius:50%; background:var(--okf); flex:none;
  animation:pulse 2.4s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.35; transform:scale(.72)}}
#langBtn{
  height:40px; min-width:56px; padding:0 14px; border-radius:10px;
  border:1px solid var(--line2); background:var(--paper); color:var(--ink); font-weight:600;
  transition:background .16s var(--ease), transform .12s var(--ease);
}
#langBtn:active{transform:scale(.95)}

/* ---- left rail (Jakob: nav on the left, like the city traffic portal) ---- */
#rail{
  position:fixed; top:60px; bottom:0; left:0; width:var(--rail); z-index:25;
  background:var(--paper); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:10px 8px; gap:6px;
}
#rail button{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  min-height:72px; border:0; border-radius:14px; background:none; color:var(--ink2);
  font-size:12px; font-weight:600; line-height:1.15; text-align:center; padding:6px 2px;
  transition:background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
}
#rail button:active{transform:scale(.94)}
#rail button[aria-expanded="true"]{background:var(--ink); color:#fff}
@media (hover:hover){#rail button:not([aria-expanded="true"]):hover{background:var(--sunk); color:var(--ink)}}

/* ---- side panel (anticipation: slides in with a small overshoot) --------- */
#panel{
  position:fixed; top:60px; bottom:0; left:var(--rail); width:var(--panel); z-index:24;
  background:var(--paper); border-right:1px solid var(--line);
  overflow-y:auto; overscroll-behavior:contain; padding:18px 18px 40px;
  transform:translateX(-102%); visibility:hidden;
  transition:transform .26s var(--ease), visibility .26s;
  box-shadow:var(--shadow);
}
#panel.open{transform:translateX(0); visibility:visible}
.ptitle{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink3); margin:0 0 6px}
.psub{margin:0 0 20px; font-size:14px; color:var(--ink2); line-height:1.5}

/* ---- from / to ---------------------------------------------------------- */
#where{border:1px solid var(--line2); border-radius:14px; overflow:hidden; margin-bottom:22px}
#where button{
  display:flex; align-items:center; gap:12px; width:100%; min-height:58px;
  background:var(--paper); border:0; border-bottom:1px solid var(--line);
  color:var(--ink); text-align:left; padding:0 14px; font-size:16px; font-weight:500;
  transition:background .16s var(--ease);
}
#where button:last-child{border-bottom:0}
@media (hover:hover){#where button:hover{background:var(--sunk)}}
#where .dot{width:11px; height:11px; border-radius:50%; border:2.5px solid var(--ink); flex:none}
#where .dot.to{border-radius:3px; background:var(--ink)}
#where .txt{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#where .txt.empty{color:var(--ink3); font-weight:400}
#where .chev{color:var(--ink3); flex:none}

/* ---- conditions strip (environment + traffic, right now) ---------------- */
.condHead{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:9px}
#cond{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:26px}
.cond{
  border:1px solid var(--line); border-left-width:4px; border-radius:11px;
  background:var(--sunk); padding:10px 12px; min-height:68px;
  animation:rise .3s var(--ease) both;
}
.cond .k{font-size:12px; font-weight:600; color:var(--ink2); display:block; margin-bottom:2px}
.cond .v{font-size:19px; font-weight:700; line-height:1.15; display:block}
.cond .u{font-size:12px; font-weight:500; color:var(--ink3)}
.cond.ok{border-left-color:var(--okf)} .cond.ok .v{color:var(--ok)}
.cond.warn{border-left-color:var(--warnf)} .cond.warn .v{color:var(--warn)}
.cond.bad{border-left-color:var(--badf)} .cond.bad .v{color:var(--bad)}
.cond.na{border-left-color:var(--line2)} .cond.na .v{color:var(--ink3)}

/* ---- the three options (Hick: three, never five) ------------------------ */
#opts{display:flex; flex-direction:column; gap:12px}
.card{
  border:1.5px solid var(--line2); border-radius:16px; background:var(--paper);
  padding:0; overflow:hidden; text-align:left; width:100%; color:inherit;
  animation:rise .32s var(--ease) both; animation-delay:calc(var(--i) * 70ms);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), transform .12s var(--ease);
}
.card:active{transform:scale(.985)}
.card[aria-pressed="true"]{border-color:var(--ink); border-width:2.5px; box-shadow:var(--shadow)}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.cHead{
  display:flex; flex-direction:column; gap:7px; width:100%; min-height:56px;
  padding:12px 14px 13px; background:none; border:0; color:inherit; text-align:left;
}
.cTop{display:flex; align-items:center; gap:6px; flex-wrap:wrap; width:100%}
.cRank{
  font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  padding:4px 9px; border-radius:999px; color:#fff; flex:none;
}
.cRank.ok{background:var(--ok)} .cRank.warn{background:var(--warn)} .cRank.bad{background:var(--bad)}
.cRank.neutral{background:var(--ink)}
.cName{font-size:16px; font-weight:700; line-height:1.25; width:100%}
.cName small{display:block; font-size:12.5px; font-weight:500; color:var(--ink3)}
.cDepart{text-align:right; margin-left:auto; flex:none}
.cDepart b{display:block; font-size:26px; font-weight:800; letter-spacing:-.03em; line-height:1}
.cDepart span{font-size:11.5px; font-weight:600; color:var(--ink3); letter-spacing:.04em; text-transform:uppercase}
.cMetrics{display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line)}
.m{padding:11px 10px 12px; border-right:1px solid var(--line); text-align:center}
.m:last-child{border-right:0}
.m .mk{display:block; font-size:11px; font-weight:600; color:var(--ink3); margin-bottom:3px}
.m .mv{display:block; font-size:18px; font-weight:700; line-height:1.1}
.m .mu{font-size:11.5px; font-weight:500; color:var(--ink3)}
.m.ok .mv{color:var(--ok)} .m.warn .mv{color:var(--warn)} .m.bad .mv{color:var(--bad)}
.cBody{border-top:1px solid var(--line); padding:14px; background:var(--sunk)}
.cBody ul{margin:0 0 14px; padding-left:19px; font-size:14.5px; color:var(--ink2); line-height:1.55}
.cBody li{margin-bottom:5px}
.go{
  width:100%; min-height:56px; border:0; border-radius:12px; background:var(--ink); color:#fff;
  font-size:17px; font-weight:700; margin-bottom:8px;
  transition:transform .12s var(--ease), opacity .16s var(--ease);
}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.4}
.cNote{font-size:12.5px; color:var(--ink3); line-height:1.5}
.sim{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.06em;
  background:#fef3c7; color:#713f12; border-radius:5px; padding:2px 6px; vertical-align:2px;
}
.empty{border:1px dashed var(--line2); border-radius:14px; padding:20px; color:var(--ink2); font-size:15px}

/* ---- gate slots --------------------------------------------------------- */
.slot{display:flex; align-items:center; gap:10px; min-height:30px}
.slot .t{width:46px; font-size:13.5px; font-weight:600; color:var(--ink2); flex:none}
.slot .bar{flex:1; height:16px; background:var(--sunk); border-radius:4px; position:relative; overflow:hidden}
.slot .fill{position:absolute; inset:0 auto 0 0; border-radius:4px;
  transition:width .4s var(--ease), background .3s var(--ease)}
.slot .w{width:54px; text-align:right; font-size:13px; color:var(--ink3); flex:none}
.slot.mine .bar{outline:2.5px solid var(--ink); outline-offset:2px}
.slot.mine .t{color:var(--ink); font-weight:800}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:16px; font-size:13px; color:var(--ink2)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px}

/* ---- settings ----------------------------------------------------------- */
.srow{margin-bottom:22px}
.lab{display:block; font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:6px}
.note{font-size:12.5px; color:var(--ink3); margin-top:6px; line-height:1.5}
.seg{display:flex; gap:6px; background:var(--sunk); border:1px solid var(--line); border-radius:12px; padding:4px}
.seg.v{flex-direction:column}
.seg button{
  flex:1; min-height:48px; border:0; border-radius:9px; background:none; color:var(--ink2);
  font-size:15px; font-weight:600; padding:0 10px;
  transition:background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
}
.seg button:active{transform:scale(.96)}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}
.two{display:grid; grid-template-columns:1fr 1fr; gap:12px}
input[type=time],input[type=number]{
  width:100%; min-height:52px; padding:0 12px; font-size:16px; color:var(--ink);
  background:var(--paper); border:1px solid var(--line2); border-radius:11px;
}
details{border-top:1px solid var(--line); padding-top:12px; margin-top:12px}
summary{min-height:48px; display:flex; align-items:center; font-size:14.5px; font-weight:600; color:var(--ink2)}
.rule{font-size:14px; color:var(--ink2); padding:9px 0; border-bottom:1px solid var(--line); line-height:1.5}
.rule .src{font-size:12px; color:var(--ink3); margin-top:3px}

/* ---- map buttons / search / toast --------------------------------------- */
#mapbtns{position:fixed; right:14px; top:76px; z-index:20; display:flex; flex-direction:column; gap:8px}
#mapbtns button{
  width:50px; height:50px; border-radius:12px; border:1px solid var(--line2);
  background:var(--paper); color:var(--ink); font-weight:700; font-size:14px;
  box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
  transition:transform .12s var(--ease);
}
#mapbtns button:active{transform:scale(.92)}
#mapbtns button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
#search{
  position:fixed; inset:0; z-index:60; background:var(--paper); display:flex; flex-direction:column;
  padding:max(14px,env(safe-area-inset-top)) 16px 16px; animation:slideUp .24s var(--ease) both;
}
@keyframes slideUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
.sTop{display:flex; align-items:center; gap:10px; margin-bottom:14px}
#sBack{width:52px; height:52px; border-radius:12px; border:1px solid var(--line2);
  background:var(--paper); font-size:26px; line-height:1; color:var(--ink)}
#sTitle{font-size:19px; font-weight:700}
#q{width:100%; min-height:58px; font-size:18px; padding:0 16px; border-radius:13px;
  border:1.5px solid var(--line2); background:var(--sunk); margin-bottom:12px}
#sList{overflow-y:auto; flex:1}
.res{display:flex; align-items:center; gap:13px; width:100%; min-height:64px; padding:0 8px;
  background:none; border:0; border-bottom:1px solid var(--line); color:var(--ink);
  text-align:left; font-size:16.5px; font-weight:500}
.res small{display:block; font-size:13px; color:var(--ink3); font-weight:400}
.res:disabled{color:var(--ink3)}
.res .pin{width:40px; height:40px; border-radius:50%; background:var(--sunk); color:var(--ink2);
  display:flex; align-items:center; justify-content:center; flex:none}
#toast{
  position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:70; display:none;
  background:var(--ink); color:#fff; padding:13px 20px; border-radius:12px; font-size:15.5px;
  font-weight:600; box-shadow:var(--shadow); max-width:88vw;
}

/* ---- narrow screens: the panel becomes a drawer over the map ------------- */
@media (max-width:860px){
  :root{--rail:68px; --panel:min(86vw,380px)}
  .brand small{display:none}
  #now span.lab{display:none}
  #rail button{font-size:11px; min-height:66px}
  #mapbtns{top:auto; bottom:calc(20px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-delay:0ms !important;
    transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div id="map" role="region" aria-label="Bản đồ Cát Lái"></div>

<header id="top">
  <div class="brand">Đúng Giờ<small id="brandSub">Cảng Cát Lái · TP.HCM</small></div>
  <div id="now"><span class="pulse"></span><b id="nowClock">06:10</b><span class="lab" id="nowLab"></span></div>
  <button id="langBtn" type="button">EN</button>
</header>

<nav id="rail" aria-label="Menu">
  <button type="button" data-panel="map" aria-expanded="false" aria-controls="panel">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v13"/></svg>
    <span data-i18n="tabMap"></span>
  </button>
  <button type="button" data-panel="slots" aria-expanded="false" aria-controls="panel">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    <span data-i18n="tabSlots"></span>
  </button>
  <button type="button" data-panel="set" aria-expanded="false" aria-controls="panel">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 006.9 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H3a2 2 0 110-4h.1A1.6 1.6 0 004.2 7l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1V3a2 2 0 114 0v.1A1.6 1.6 0 0017.1 5l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
    <span data-i18n="tabSet"></span>
  </button>
</nav>

<aside id="panel" aria-label="Bảng điều khiển">
  <section class="pane" id="pMap">
    <h2 class="ptitle" id="tRoute"></h2>
    <div id="where">
      <button id="btnFrom" type="button">
        <span class="dot"></span><span class="txt" id="txtFrom"></span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button id="btnTo" type="button">
        <span class="dot to"></span><span class="txt" id="txtTo"></span>
        <svg class="chev" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>

    <div class="condHead"><h2 class="ptitle" id="tCond" style="margin:0"></h2><span class="cNote" id="condTime"></span></div>
    <div id="cond"></div>

    <h2 class="ptitle" id="tOpts"></h2>
    <p class="psub" id="sOpts"></p>
    <div id="opts"></div>
  </section>

  <section class="pane" id="pSlots" hidden>
    <h2 class="ptitle" id="tSlots"></h2>
    <p class="psub" id="sSlots"></p>
    <div id="slots"></div>
    <div class="legend" id="slotsLegend"></div>
  </section>

  <section class="pane" id="pSet" hidden>
    <h2 class="ptitle" id="tSet"></h2>
    <p class="psub" id="sSet"></p>
    <div class="srow"><span class="lab" id="labScn"></span><div class="seg v" id="segScn"></div><div class="note" id="scnNote"></div></div>
    <div class="srow">
      <div class="two">
        <div><label class="lab" for="demoTime" id="labNow"></label><input id="demoTime" type="time" value="06:10"></div>
        <div><label class="lab" for="slot" id="labSlot"></label><input id="slot" type="time"></div>
      </div>
      <div class="note" id="slotNote"></div>
    </div>
    <div class="srow"><span class="lab" id="labReg"></span><div class="seg" id="segReg"></div></div>
    <div class="srow"><span class="lab" id="labPay"></span><div class="seg" id="segPay"></div><div class="note" id="payNote"></div></div>
    <div class="srow">
      <div class="two">
        <div><label class="lab" for="fuel" id="labFuel"></label><input id="fuel" type="number" value="35" min="10" max="80" step="1"></div>
        <div><label class="lab" for="hours" id="labHours"></label><input id="hours" type="number" min="0" max="11" step="0.5" placeholder="8"></div>
      </div>
    </div>
    <div class="srow">
      <details><summary id="sumRules"></summary><div id="rules"></div></details>
      <details><summary id="sumSrc"></summary><div id="srcList"></div></details>
      <details><summary id="sumLedger"></summary><div id="ledger"></div></details>
      <div class="note" id="srcNote"></div>
    </div>
  </section>
</aside>

<div id="mapbtns">
  <button id="btn3d" type="button" aria-pressed="true" aria-label="2D / 3D">3D</button>
  <button id="btnFit" type="button" aria-label="Toàn tuyến">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/></svg>
  </button>
</div>

<div id="search" hidden>
  <div class="sTop">
    <button id="sBack" type="button" aria-label="Back">‹</button>
    <div id="sTitle"></div>
  </div>
  <input id="q" type="search" autocomplete="off">
  <div id="sList"></div>
</div>

<div id="toast" role="status"></div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="env.js"></script>
<script>
const $ = s => document.querySelector(s);
let lang = 'vi', scenario = 'normal', openPanel = 'map';
let geo = null, POI = {}, map, mapReady = false, routeRoads = [];

const vnd = n => Math.round(n / 1000) + 'k';

function toast(msg) {
  $('#toast').textContent = msg; $('#toast').style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').style.display = 'none', 2600);
}

function seg(id, options, value, onPick) {
  const el = $(id); el.innerHTML = '';
  for (const o of options) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = o.label;
    b.setAttribute('aria-pressed', String(o.v === value));
    b.onclick = () => onPick(o.v);
    el.appendChild(b);
  }
}

/* ---------------- search / onboarding ------------------------------------ */
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let searchDone = null;

function openSearch(field, onDone) {
  searchDone = onDone;
  $('#search').hidden = false;
  $('#sTitle').textContent = field === 'from' ? T('pickFrom') : T('pickTo');
  $('#q').placeholder = T('searchPh');
  $('#q').value = '';
  const items = field === 'from'
    ? ORIGINS.map(o => ({ id: o.id, name: o.name, sub: '', ok: true }))
    : DESTS.map(d => ({ id: d.id, name: d[lang], sub: d.ok ? d.sub[lang] : T('soon'), ok: d.ok }));
  const draw = () => {
    const q = norm($('#q').value);
    $('#sList').innerHTML = '';
    for (const it of items.filter(i => norm(i.name).includes(q))) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'res';
      b.innerHTML = `<span class="pin"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.4 7-11a7 7 0 10-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg></span>
        <span>${it.name}${it.sub ? `<small>${it.sub}</small>` : ''}</span>`;
      if (!it.ok) b.disabled = true;
      else b.onclick = () => { $('#search').hidden = true; searchDone(it.id); };
      $('#sList').appendChild(b);
    }
  };
  $('#q').oninput = draw; draw();
  $('#q').focus();
}
$('#sBack').onclick = () => { $('#search').hidden = true; };
$('#btnFrom').onclick = () => openSearch('from', id => { originId = id; saveProfile(); applyLang(); run(); });
$('#btnTo').onclick = () => openSearch('to', id => { destId = id; saveProfile(); applyLang(); run(); });

const saveProfile = () =>
  localStorage.setItem('dunggio-profile', JSON.stringify({ origin: originId, dest: destId, lang }));

/* ---------------- environment (real readings from data/vn/) --------------- */
/* Returns the row for the demo hour on today's date, or null if the files
 * are missing. `stale` means we fell back to the last day in the dataset. */
function envNow() {
  if (!ENV) return null;
  const day = new Date().toISOString().slice(0, 10);
  const hour = Math.floor(hm($('#demoTime').value || '06:10') / 60);
  const a = hourIndex(ENV.aq.hourly.time, day, hour);
  const w = hourIndex(ENV.wx.hourly.time, day, hour);
  const t = ENV.tide ? hourIndex(ENV.tide.hourly.time, day, hour) : null;
  if (!a || !w) return null;
  return {
    time: a.time, stale: a.stale,
    aqi: ENV.aq.hourly.us_aqi[a.i], pm25: ENV.aq.hourly.pm2_5[a.i],
    rain: ENV.wx.hourly.rain[w.i], temp: ENV.wx.hourly.temperature_2m[w.i],
    tide: t ? ENV.tide.hourly.sea_level_height_msl[t.i] : null,
  };
}

function renderConditions(e) {
  const scn = SCENARIOS[scenario];
  const wait = queueWaitAt(hm($('#demoTime').value || '06:10'), scn).mid;
  const chips = [
    // US AQI breakpoints: 0–50 good, 51–100 moderate, 101+ unhealthy for sensitive groups
    { k: T('cTraffic'), v: wait, u: T('uWait'), b: band(wait, 10, 25), sim: true },
    e && { k: T('cAir'), v: Math.round(e.aqi), u: T('uAqi').replace('{pm}', `${e.pm25?.toFixed(0)} µg/m³`), b: band(e.aqi, 51, 101) },
    e && { k: T('cRain'), v: e.rain?.toFixed(1), u: T('uRain').replace('{t}', e.temp?.toFixed(0)), b: band(e.rain, 0.2, 2.5) },
    e && e.tide != null && { k: T('cTide'), v: e.tide.toFixed(2), u: T('uTide'), b: band(e.tide, 0.9, 1.4) },
  ].filter(Boolean);
  $('#cond').innerHTML = chips.map((c, i) => `
    <div class="cond ${c.b}" style="animation-delay:${i * 55}ms">
      <span class="k">${c.k}${c.sim ? ' <span class="sim">SIM</span>' : ''}</span>
      <span class="v">${c.v}</span><span class="u">${c.u}</span>
    </div>`).join('');
  $('#condTime').textContent = e
    ? (e.stale ? `${e.time} · ${lang === 'vi' ? 'số liệu gần nhất' : 'latest available'}` : e.time.replace('T', ' '))
    : (lang === 'vi' ? 'chưa tải được dữ liệu môi trường' : 'environmental data unavailable');
}

/* ---------------- recommendation ----------------------------------------- */
function ctxNow(e) {
  return {
    nowMin: hm($('#demoTime').value || '06:10'), scenario,
    fuelPer100: +$('#fuel').value || 35, payType: $('#segPay').dataset.v,
    hourlyRate: RATES.driverVndPerH.v, dieselPrice: RATES.dieselVndPerL.v,
    hoursLeft: $('#hours').value ? +$('#hours').value : null,
    slotMin: $('#slot').value ? hm($('#slot').value) : null,
    registered24: $('#segReg').dataset.v === 'yes', poiCount: POI,
    aqiUnhealthy: !!(e && e.aqi > 100),      // real AQI raises the exposure cost
  };
}

function run() {
  const e = envNow();
  renderConditions(e);
  const ctx = ctxNow(e);
  const opts = [];
  for (const r of ROUTES[originId]) for (const d of [0, 15, 30, 60, 90, 120]) opts.push(evalOption(r, d, ctx));
  const mult = 1 + Math.min(1, (LEDGER['Nguyễn Thị Định (Cát Lái)'] || 0) / 600);
  const picks = pickCards(opts, WEIGHTS, mult);
  // One card per distinct (route, departure). When "cheapest" and "greenest" are
  // the same trip, say so on one card instead of showing it twice; then top up
  // to three distinct trips from the ranked pool so the driver always compares.
  const byKey = Object.fromEntries(picks.cards);
  const same = o => cards.find(c => c.o.route.id === o.route.id && c.o.depDelayMin === o.depDelayMin);
  cards = [];
  for (const k of ORDER) {
    const o = byKey[k];
    if (!o) continue;
    const dup = same(o);
    // "balanced"/"leave later" never add a chip to a card that already names a metric
    if (dup) { if (LABELS[k].metric != null || !dup.keys.some(x => LABELS[x].metric != null)) dup.keys.push(k); continue; }
    if (cards.length < 3) cards.push({ o, keys: [k] });
  }
  for (const o of scoreOptions(opts, WEIGHTS, mult) || []) {
    if (cards.length >= 3) break;
    if (!same(o)) cards.push({ o, keys: ['alt'] });
  }
  blockedMsg = cards.length ? '' : T('noOption');
  if (picked >= cards.length) picked = 0;
  renderOptions();
  renderSlots();
  const prev = routeRoads.join();
  routeRoads = cards[picked] ? cards[picked].o.route.roads : [];
  paintRoads();
  if (routeRoads.join() !== prev) fitRoute();
}

/* Never "high": truck arrivals are simulated and a disrupted day rests on
 * unverified driver reports. */
const confidence = () => (scenario === 'normal' ? 'medium' : 'low');

function renderOptions() {
  if (!cards.length) {
    $('#opts').innerHTML = `<div class="empty">${blockedMsg}</div>`;
    return;
  }
  // colour-rank the picks on each metric: green best, yellow middle, red worst
  const bands = [
    rankBand(cards.map(c => c.o.gateMin)),
    rankBand(cards.map(c => c.o.costVnd)),
    rankBand(cards.map(c => c.o.co2Kg)),
  ];
  const [bGate, bCost, bCo2] = bands;
  const now = ROUTES[originId].map(r => evalOption(r, 0, ctxNow(envNow())))
    .filter(x => !x.blocked.length).sort((a, b) => a.idleMin - b.idleMin)[0];

  $('#opts').innerHTML = cards.map(({ o, keys }, i) => {
    const on = i === picked;
    const sub = LABELS[keys[0]][lang === 'vi' ? 'viSub' : 'enSub'];
    const chips = keys.map(k => {
      const L = LABELS[k];
      return `<span class="cRank ${L.metric == null ? 'neutral' : bands[L.metric][i]}">${L[lang]}</span>`;
    }).join('');
    return `
    <div class="card" role="group" aria-label="${keys.map(k => LABELS[k][lang]).join(', ')}" aria-pressed="${on}" data-i="${i}" style="--i:${i}">
      <button class="cHead" type="button" data-pick="${i}">
        <span class="cTop">${chips}<span class="cDepart"><b>${o.departTime}</b><span>${T('depart')}</span></span></span>
        <span class="cName">${o.route[lang]}<small>${sub}</small></span>
      </button>
      <div class="cMetrics">
        <div class="m ${bGate[i]}"><span class="mk">${T('mGate')}</span><span class="mv">${o.gateTime}</span><span class="mu">+${o.queue.mid} ${lang === 'vi' ? 'ph chờ' : 'min wait'}</span></div>
        <div class="m ${bCost[i]}"><span class="mk">${T('mCost')}</span><span class="mv">${vnd(o.costVnd)}</span><span class="mu">đ · ${o.km} km</span></div>
        <div class="m ${bCo2[i]}"><span class="mk">${T('mCo2')}</span><span class="mv">${o.co2Kg.toFixed(1)}</span><span class="mu">kg CO₂</span></div>
      </div>
      ${on ? `<div class="cBody">
        <ul>${reasons(o, now).slice(0, 3).map(r => `<li>${r}</li>`).join('')}</ul>
        <button class="go" type="button" data-go="${i}">${shared ? T('goDone') : T('go')}</button>
        <div class="cNote">${T('conf')}: ${confidence() === 'low' ? T('confLow') : T('confMed')}
          · data_source: mixed <span class="sim">SIMULATED</span></div>
      </div>` : ''}
    </div>`;
  }).join('');

  $('#opts').querySelectorAll('[data-pick]').forEach(b => {
    b.onclick = () => {
      picked = +b.dataset.pick; shared = false;
      renderOptions(); renderSlots();
      routeRoads = cards[picked].o.route.roads;
      paintRoads(); fitRoute();                      // staging: the map follows the choice
    };
  });
  const go = $('#opts').querySelector('[data-go]');
  if (go) go.onclick = takeSlot;
}

/* engine-written reasons — no LLM ever writes a number */
function reasons(o, vs) {
  const vi = lang === 'vi', r = [];
  const scn = SCENARIOS[scenario];
  const loadPct = Math.round((ARRIVALS[Math.floor((o.gateMin % 1440) / 15)] * scn.arrivalsFactor) / scn.capacityPerSlot * 100);
  r.push(vi ? `Khung giờ này cổng nhận ${loadPct}% so với sức thông quan`
            : `At this slot the gate is at ${loadPct}% of its clearing capacity`);
  if (vs) { const c = clauses(o, vs, lang); if (c) r.push(c[0].toUpperCase() + c.slice(1)); }
  if (o.waitOpenMin > 0) r.push(vi ? `Gồm ${o.waitOpenMin} phút chờ cổng mở lúc 7:30`
                                   : `Includes ${o.waitOpenMin} min waiting for the 7:30 opening`);
  if (o.unpaidMin) r.push(vi ? `${o.unpaidMin} phút này anh/chị không được trả công`
                             : `${o.unpaidMin} of these minutes are unpaid for you`);
  if (o.tollVnd) r.push(vi ? `Gồm phí cầu ${o.tollVnd.toLocaleString('vi')} đ`
                           : `Includes ${o.tollVnd.toLocaleString('en')} VND bridge toll`);
  return r;
}

async function takeSlot() {
  const o = cards[picked] && cards[picked].o;
  if (!o) return;
  const b = Math.floor((o.gateMin % 1440) / 30);
  if (myClaim !== b) { claimed[b] = (claimed[b] || 0) + 1; myClaim = b; renderSlots(); }
  toast(T('claimed').replace('{t}', fmt(b * 30)));
  shared = true; renderOptions();
  const msg = lang === 'vi'
    ? `[Đúng Giờ] Xuất phát ${o.departTime}, ${o.route.vi}, vào cổng ${o.gateTime} (chờ ${o.queue.lo}–${o.queue.hi} phút, ${o.co2Kg.toFixed(1)} kg CO₂). Demo — lưu lượng mô phỏng.`
    : `[Đúng Giờ] Depart ${o.departTime}, ${o.route.en}, gate ${o.gateTime} (wait ${o.queue.lo}–${o.queue.hi} min, ${o.co2Kg.toFixed(1)} kg CO₂). Demo — simulated arrivals.`;
  if (navigator.share) { try { await navigator.share({ text: msg }); return; } catch {} }
  try { await navigator.clipboard.writeText(msg); toast(T('copied')); } catch {}
}

/* ---------------- gate slot load (30-min buckets) ------------------------- */
function renderSlots() {
  const scn = SCENARIOS[scenario];
  const cap = scn.capacityPerSlot * 2;
  const mine = cards[picked] ? Math.floor((cards[picked].o.gateMin % 1440) / 30) : -1;
  let html = '';
  for (let b = 12; b <= 39; b++) {                   // 06:00 → 20:00
    const load = (ARRIVALS[b * 2] + ARRIVALS[b * 2 + 1]) * scn.arrivalsFactor / cap;
    const w = queueWaitAt(b * 30, scn).mid;
    const col = load >= 1 ? 'var(--badf)' : load >= .85 ? 'var(--warnf)' : 'var(--okf)';
    html += `<div class="slot${b === mine ? ' mine' : ''}">
      <span class="t">${fmt(b * 30)}</span>
      <span class="bar"><span class="fill" style="width:${Math.min(100, load * 100).toFixed(1)}%;background:${col}"></span></span>
      <span class="w">${w} ${lang === 'vi' ? 'ph' : 'min'}</span>
    </div>`;
  }
  $('#slots').innerHTML = html;
  $('#slotsLegend').innerHTML = [
    ['var(--okf)', T('legClear')], ['var(--warnf)', T('legSlow')],
    ['var(--badf)', T('legJam')], ['var(--ink)', T('legMine')],
  ].map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')
    + ` <span class="sim">SIMULATED</span>`;
}

/* ---------------- map ----------------------------------------------------- */
function roadColor(name) {
  const scn = SCENARIOS[scenario];
  if ((scn.slowRoads || []).includes(name)) return '#dc2626';
  const w = queueWaitAt(hm($('#demoTime').value || '06:10'), scn).mid;
  if (name === 'Nguyễn Thị Định') return w >= 20 ? '#dc2626' : w >= 10 ? '#eab308' : '#16a34a';
  if (name === 'Đồng Văn Cống') return w >= 40 ? '#eab308' : '#16a34a';   // queue spillback
  return '#16a34a';
}

function paintRoads() {
  if (!mapReady || !geo) return;
  const onRoute = ['in', ['get', 'name'], ['literal', routeRoads]];
  const m = ['match', ['get', 'name']];
  for (const name of Object.keys(geo.roads)) m.push(name, roadColor(name));
  m.push('#16a34a');
  map.setPaintProperty('roads', 'line-color', ['case', onRoute, m, '#b4b4b8']);
  map.setPaintProperty('roads', 'line-width', ['case', onRoute, 8, 2.5]);
  map.setPaintProperty('roads', 'line-opacity', ['case', onRoute, 1, .6]);
  map.setFilter('route-case', onRoute);
}

function fitRoute() {
  if (!mapReady || !geo) return;
  const pts = routeRoads.flatMap(r => geo.roads[r] || []);
  if (!pts.length) return;
  const b = pts.reduce((a, p) => a.extend(p), new maplibregl.LngLatBounds(pts[0], pts[0]));
  const open = $('#panel').classList.contains('open');
  const rail = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--rail'));
  const pan = open ? $('#panel').getBoundingClientRect().width : 0;
  map.fitBounds(b, { padding: { top: 90, bottom: 60, left: rail + pan + 30, right: 90 }, duration: 640 });
}

/* schools/hospitals within ~150 m of each road (exposure input) */
function poiCounts() {
  const out = {};
  const pois = [...(geo.schools || []), ...(geo.hospitals || [])];
  for (const [name, line] of Object.entries(geo.roads || {})) {
    let n = 0;
    for (const p of pois) {
      for (let i = 0; i < line.length; i += 2) {
        const dLat = (p.lat - line[i][1]) * 111320, dLon = (p.lon - line[i][0]) * 109200;
        if (dLat * dLat + dLon * dLon < 150 * 150) { n++; break; }
      }
    }
    out[name] = n;
  }
  return out;
}

/* ---------------- language + chrome --------------------------------------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  $('#langBtn').textContent = lang === 'vi' ? 'EN' : 'VI';
  $('#langBtn').setAttribute('aria-label', lang === 'vi' ? 'Switch to English' : 'Chuyển sang tiếng Việt');
  const o = ORIGINS.find(x => x.id === originId);
  $('#txtFrom').textContent = o ? o.name : T('from');
  $('#txtFrom').classList.toggle('empty', !o);
  const d = DESTS.find(x => x.id === destId);
  $('#txtTo').textContent = d ? d[lang] : T('to');
  $('#nowLab').textContent = T('nowLab');
  for (const [id, k] of [['#tRoute','tRoute'], ['#tCond','tCond'], ['#tOpts','tOpts'], ['#sOpts','sOpts'],
    ['#tSlots','tSlots'], ['#sSlots','sSlots'], ['#tSet','tSet'], ['#sSet','sSet'],
    ['#labScn','labScn'], ['#labNow','labNow'], ['#labSlot','labSlot'], ['#slotNote','slotNote'],
    ['#labReg','labReg'], ['#labPay','labPay'], ['#payNote','payNote'], ['#labFuel','labFuel'],
    ['#labHours','labHours'], ['#sumRules','sumRules'], ['#sumSrc','sumSrc'],
    ['#sumLedger','sumLedger'], ['#srcNote','srcNote']]) $(id).textContent = T(k);

  seg('#segPay', [{ v: 'trip', label: T('payTrip') }, { v: 'hourly', label: T('payHour') }],
    $('#segPay').dataset.v, v => { $('#segPay').dataset.v = v; applyLang(); run(); });
  seg('#segReg', [{ v: 'no', label: T('no') }, { v: 'yes', label: T('yes') }],
    $('#segReg').dataset.v, v => { $('#segReg').dataset.v = v; applyLang(); run(); });
  seg('#segScn', Object.entries(SCENARIOS).map(([k, s]) => ({ v: k, label: s[lang] })), scenario,
    v => { scenario = v; applyLang(); run(); });
  $('#scnNote').innerHTML = scenario === 'disrupted'
    ? `${SCENARIOS.disrupted.report[lang]} <span class="sim">SIMULATED</span>` : '';
  $('#rules').innerHTML = RULES.map(r =>
    `<div class="rule">${r[lang]}<div class="src">${r.src} · ${lang === 'vi' ? 'kiểm tra' : 'verified'} ${r.verified} · ${r.confidence}</div></div>`).join('');
  $('#ledger').innerHTML = Object.entries(LEDGER).map(([a, v]) =>
    `<div class="rule">${a}: <b>${v}</b> ${lang === 'vi' ? 'phút xe nổ máy chờ' : 'idle truck-minutes'}</div>`).join('');
  $('#srcList').innerHTML = (ENV && ENV.manifest ? ENV.manifest : []).map(s =>
    `<div class="rule">${s.file}<div class="src">${s.source} · ${s.licence}</div></div>`).join('')
    || `<div class="rule">${lang === 'vi' ? 'Chưa tải được manifest.' : 'Manifest not loaded.'}</div>`;
}

/* ---------------- panel + controls ---------------------------------------- */
function showPanel(which) {
  const same = openPanel === which && $('#panel').classList.contains('open');
  openPanel = which;
  $('#panel').classList.toggle('open', !same);
  for (const [id, key] of [['#pMap','map'], ['#pSlots','slots'], ['#pSet','set']]) $(id).hidden = key !== which;
  document.querySelectorAll('#rail button').forEach(b =>
    b.setAttribute('aria-expanded', String(!same && b.dataset.panel === which)));
  setTimeout(fitRoute, 280);                         // re-frame once the panel has moved
}
document.querySelectorAll('#rail button').forEach(b => { b.onclick = () => showPanel(b.dataset.panel); });

$('#langBtn').onclick = () => { lang = lang === 'vi' ? 'en' : 'vi'; saveProfile(); applyLang(); run(); };
['demoTime', 'slot', 'fuel', 'hours'].forEach(id => $('#' + id).onchange = () => {
  $('#nowClock').textContent = $('#demoTime').value; run();
});
$('#btn3d').onclick = () => {
  const on = $('#btn3d').getAttribute('aria-pressed') === 'true';
  $('#btn3d').setAttribute('aria-pressed', String(!on));
  $('#btn3d').textContent = on ? '2D' : '3D';
  map.easeTo({ pitch: on ? 0 : 52, bearing: on ? 0 : -18, duration: 520 });
};
$('#btnFit').onclick = fitRoute;

/* ---------------- boot ----------------------------------------------------- */
async function boot() {
  let prof = null;
  try { prof = JSON.parse(localStorage.getItem('dunggio-profile') || 'null'); } catch {}
  if (prof) { originId = prof.origin || originId; destId = prof.dest || destId; lang = prof.lang || lang; }
  $('#segPay').dataset.v = 'trip';
  $('#segReg').dataset.v = 'no';
  $('#nowClock').textContent = $('#demoTime').value;
  applyLang();

  try { geo = await (await fetch('geo.json')).json(); } catch { geo = null; }
  if (geo) POI = poiCounts();

  // Real environmental readings. Missing files must not break the app: the
  // conditions strip says so and the options still compute.
  const grab = async u => { try { return await (await fetch(u)).json(); } catch { return null; } };
  const [aq, wx, tide, manifest] = await Promise.all([
    grab('/data/vn/air_quality_hourly.json'), grab('/data/vn/weather_hourly.json'),
    grab('/data/vn/tide_vung_tau_hourly.json'), grab('/data/vn/manifest.json'),
  ]);
  if (aq && wx) ENV = { aq, wx, tide, manifest };

  map = new maplibregl.Map({
    container: 'map', style: 'https://tiles.openfreemap.org/styles/positron',
    center: [106.760, 10.752], zoom: 12.3, pitch: 52, bearing: -18, attributionControl: false,
  });
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');
  map.on('load', () => {
    try {
      map.addLayer({ id: 'buildings', type: 'fill-extrusion', source: 'openmaptiles',
        'source-layer': 'building', minzoom: 13,
        paint: { 'fill-extrusion-color': '#dcdce0',
                 // render_height is null on some buildings; ['number', a, b] falls through
                 'fill-extrusion-height': ['number', ['get', 'render_height'], 8],
                 'fill-extrusion-opacity': .85 } });
    } catch {}                                        // style without a building layer: skip 3D
    if (geo) {
      map.addSource('roads', { type: 'geojson', data: {
        type: 'FeatureCollection',
        features: Object.entries(geo.roads).map(([name, line]) => ({
          type: 'Feature', properties: { name }, geometry: { type: 'LineString', coordinates: line },
        })),
      }});
      map.addLayer({ id: 'route-case', type: 'line', source: 'roads',
        filter: ['in', ['get', 'name'], ['literal', []]],
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#0b0b0c', 'line-width': 15, 'line-opacity': .16 } });
      map.addLayer({ id: 'roads', type: 'line', source: 'roads',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-width': 6, 'line-opacity': .95 } });
    }
    new maplibregl.Marker({ color: '#0b0b0c' }).setLngLat([GATE.lon, GATE.lat]).addTo(map);
    mapReady = true;
    paintRoads(); fitRoute();
  });

  run();
  showPanel('map');
  if (!prof) openSearch('from', id => {               // first run: ask the two nav questions
    originId = id; applyLang();
    openSearch('to', d => { destId = d; saveProfile(); applyLang(); run(); });
  });
  setInterval(() => { paintRoads(); if (openPanel === 'slots') renderSlots(); }, 5000);
}
boot();
</script>
